<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>UIモックエディタ</title>
<style>
:root{--bg:#1d2026;--panel:#262a31;--panel2:#30353e;--line:#3d434d;--ink:#e9ecf1;--muted:#9aa3b0;--acc:#5aa9ff;--danger:#ff6b6b;--stage:#13151a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer;white-space:nowrap}
button:active{filter:brightness(1.25)}
button.pri{background:var(--acc);border-color:var(--acc);color:#06121f;font-weight:700}
button.dan{color:var(--danger)}
button.on{background:var(--acc);color:#06121f;border-color:var(--acc)}
select,input[type=text],input[type=number],textarea{background:var(--stage);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
input[type=color]{width:40px;height:32px;padding:0;border:1px solid var(--line);border-radius:8px;background:none}
header{display:flex;align-items:center;gap:6px;padding:6px 8px;padding-top:max(6px,env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line)}
header select{flex:1;min-width:0}
header .z{color:var(--muted);font-size:12px;min-width:38px;text-align:center}
#area{flex:1;overflow:auto;position:relative;background:var(--stage);touch-action:none}
#wrap{position:relative;margin:12px auto}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;box-shadow:0 0 0 1px #000,0 6px 24px #0008}
#stage .el{position:absolute;touch-action:none}
#stage .el svg{display:block;width:100%;height:100%;overflow:visible}
#stage .el.lock{cursor:default}
#grid,#safe,#guides{position:absolute;inset:0;pointer-events:none}
#sel{position:absolute;pointer-events:none;outline:2px solid var(--acc);outline-offset:0}
#sel .h{position:absolute;pointer-events:auto;background:#fff;border:2px solid var(--acc);border-radius:50%;touch-action:none}
.gl{position:absolute;background:#ff4fd8}
#bottom{background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;height:30dvh;min-height:170px;padding-bottom:env(safe-area-inset-bottom)}
#bottom.min{height:auto;min-height:0}
#bottom.min .body{display:none}
.tabs{display:flex;gap:4px;padding:6px 8px 0}
.tabs button{flex:1;border-radius:8px 8px 0 0;border-bottom:none}
.tabs .tg{flex:0 0 auto}
.body{flex:1;overflow:auto;padding:10px;border-top:1px solid var(--line)}
#pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
#pal button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;font-size:12px}
#pal svg{width:56px;height:36px}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.row>label{color:var(--muted);font-size:12px;min-width:56px}
.row input[type=number]{width:72px}
.row input[type=text],.row textarea,.row select{flex:1}
.row textarea{min-height:56px;resize:vertical}
.geo{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.geo label{display:flex;flex-direction:column;font-size:11px;color:var(--muted)}
.geo input{width:100%}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.hint{color:var(--muted);font-size:13px}
.li{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:var(--panel2)}
.li.cur{border-color:var(--acc)}
.li span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li button{padding:3px 8px}
#menu{position:fixed;inset:0;background:#000a;display:none;z-index:20}
#menu.show{display:block}
#menu .sheet{position:absolute;right:0;top:0;bottom:0;width:min(360px,92vw);background:var(--panel);overflow:auto;padding:14px;padding-top:max(14px,env(safe-area-inset-top))}
#menu h3{margin:16px 0 8px;font-size:13px;color:var(--muted);font-weight:600}
#menu h3:first-child{margin-top:0}
#menu .acts button{flex:1 1 45%}
#toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%);background:#000d;color:#fff;padding:8px 14px;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
#toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <button id="bUndo" title="元に戻す">↶</button>
  <button id="bRedo" title="やり直し">↷</button>
  <select id="scrSel" title="画面"></select>
  <button id="bZo" title="縮小">−</button>
  <span class="z" id="zl">100%</span>
  <button id="bZi" title="拡大">＋</button>
  <button id="bFit" title="全体表示">⤢</button>
  <button id="bMenu" title="メニュー">☰</button>
</header>
<div id="area"><div id="wrap"><div id="stage"><div id="els"></div><canvas id="grid"></canvas><div id="safe"></div><div id="guides"></div><div id="sel"></div></div></div></div>
<div id="bottom">
  <div class="tabs">
    <button data-t="pal" class="on">部品</button>
    <button data-t="prop">設定</button>
    <button data-t="list">一覧</button>
    <button class="tg" id="bMin" title="たたむ">▾</button>
  </div>
  <div class="body" id="body"></div>
</div>
<div id="menu"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<input type="file" id="fImg" accept="image/*" hidden>
<input type="file" id="fJson" accept=".json,application/json" hidden>
<script>
'use strict';
// ===== 部品の定義 =====
const FONT = `system-ui,-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fillOf = c => (!c || c === 'none') ? 'none' : c;
function txt(lines, x, cy, e, anchor = 'middle', topAlign = false) {
  if (!Array.isArray(lines)) lines = String(lines ?? '').split('\n');
  const fs = +e.fs || 16, lh = fs * 1.25;
  const y0 = topAlign ? cy + fs * .5 : cy - (lines.length - 1) * lh / 2;
  return `<text x="${x}" font-family="${FONT}" font-size="${fs}" font-weight="${e.bold === false ? 400 : 700}" fill="${fillOf(e.color)}" text-anchor="${anchor}" dominant-baseline="central">` +
    lines.map((l, i) => `<tspan x="${x}" y="${y0 + i * lh}">${esc(l)}</tspan>`).join('') + `</text>`;
}
function box(e, w, h, rx) {
  const lw = +e.lw || 0;
  return `<rect x="${lw/2}" y="${lw/2}" width="${Math.max(0,w-lw)}" height="${Math.max(0,h-lw)}" rx="${rx ?? (+e.r||0)}" fill="${fillOf(e.fill)}" stroke="${lw?fillOf(e.line):'none'}" stroke-width="${lw}"/>`;
}
const P = { // 共通で出す設定項目
  label: {k:'label', t:'textarea', lab:'文字'},
  fs: {k:'fs', t:'num', lab:'文字サイズ'},
  color: {k:'color', t:'color', lab:'文字色'},
  fill: {k:'fill', t:'color', lab:'塗り', none:true},
  line: {k:'line', t:'color', lab:'線の色'},
  lw: {k:'lw', t:'num', lab:'線の太さ'},
  r: {k:'r', t:'num', lab:'角丸'},
  op: {k:'op', t:'range', lab:'不透明度'},
};
const TYPES = {
  button: {name:'ボタン', w:160, h:52, d:{label:'START', fill:'#3b82f6', line:'#1e3a8a', lw:3, color:'#ffffff', fs:20, r:12},
    p:['label','fs','color','fill','line','lw','r','op'],
    draw:(e,w,h) => box(e,w,h) + txt(e.label, w/2, h/2, e)},
  round: {name:'丸ボタン', w:72, h:72, d:{label:'A', fill:'#ef4444', line:'#7f1d1d', lw:3, color:'#ffffff', fs:26},
    p:['label','fs','color','fill','line','lw','op'],
    draw:(e,w,h) => { const lw=+e.lw||0; return `<ellipse cx="${w/2}" cy="${h/2}" rx="${Math.max(0,w/2-lw/2)}" ry="${Math.max(0,h/2-lw/2)}" fill="${fillOf(e.fill)}" stroke="${lw?fillOf(e.line):'none'}" stroke-width="${lw}"/>` + txt(e.label, w/2, h/2, e); }},
  text: {name:'テキスト', w:200, h:40, d:{label:'テキスト', fill:'none', color:'#ffffff', fs:24, align:'center', line:'#000000', lw:0, r:0},
    p:['label','fs','color','align','fill','op'],
    draw:(e,w,h) => { const a=e.align||'center'; const x=a==='left'?4:a==='right'?w-4:w/2; return box({...e,lw:0},w,h,0) + txt(e.label, x, h/2, e, a==='left'?'start':a==='right'?'end':'middle'); }},
  panel: {name:'パネル', w:240, h:160, d:{label:'', fill:'#0f172a', line:'#94a3b8', lw:2, color:'#cbd5e1', fs:14, r:12, op:0.85},
    p:['label','fs','color','fill','line','lw','r','op'],
    draw:(e,w,h) => box(e,w,h) + (e.label ? txt(e.label, 12, 8, e, 'start', true) : '')},
  bar: {name:'HPバー', w:220, h:26, d:{label:'HP', val:72, max:100, fill:'#22c55e', bg2:'#1f2937', line:'#e5e7eb', lw:2, color:'#ffffff', fs:13, r:6, num:true},
    p:['label','val','max','num','fill','bg2','line','lw','r','fs','color','op'],
    draw:(e,w,h) => { const lw=+e.lw||0, m=lw+2, ratio=Math.max(0,Math.min(1,(+e.val||0)/(+e.max||1)));
      const ir=Math.max(0,(+e.r||0)-m/2);
      const s = e.label ? `${e.label}${e.num!==false?`  ${e.val}/${e.max}`:''}` : (e.num!==false?`${e.val}/${e.max}`:'');
      return box({...e,fill:e.bg2},w,h) + `<rect x="${m}" y="${m}" width="${Math.max(0,(w-2*m)*ratio)}" height="${Math.max(0,h-2*m)}" rx="${ir}" fill="${fillOf(e.fill)}"/>` + (s?txt(s, w/2, h/2, e):''); }},
  icon: {name:'アイコン枠', w:64, h:64, d:{label:'⚔️', fill:'#1e293b', line:'#fbbf24', lw:3, color:'#ffffff', fs:30, r:12, badge:''},
    p:['label','fs','color','fill','line','lw','r','badge','op'],
    draw:(e,w,h) => box(e,w,h) + txt(e.label, w/2, h/2, e) + (e.badge ? `<circle cx="${w-4}" cy="4" r="11" fill="#ef4444" stroke="#fff" stroke-width="2"/>` + txt(e.badge, w-4, 4, {...e, fs:12, color:'#fff'}) : '')},
  msg: {name:'メッセージ窓', w:350, h:130, d:{label:'スライムが あらわれた！', fill:'#000000', line:'#ffffff', lw:4, color:'#ffffff', fs:18, r:10, op:0.9},
    p:['label','fs','color','fill','line','lw','r','op'],
    draw:(e,w,h) => box(e,w,h) + txt(e.label, 18, 16, e, 'start', true) + `<path d="M${w-30} ${h-24}h14l-7 9z" fill="${fillOf(e.color)}"/>`},
  dpad: {name:'十字キー', w:130, h:130, d:{fill:'#334155', line:'#94a3b8', lw:2, color:'#e2e8f0', op:0.85},
    p:['fill','line','lw','color','op'],
    draw:(e,w,h) => { const a=w/3, b=h/3, lw=+e.lw||0, c=fillOf(e.color);
      return `<path d="M${a} ${lw/2}h${a}v${b}h${a-lw/2}v${b}h-${a-lw/2}v${b-lw/2}h-${a}v-${b-lw/2}h-${a-lw/2}v-${b}h${a-lw/2}z" fill="${fillOf(e.fill)}" stroke="${lw?fillOf(e.line):'none'}" stroke-width="${lw}" stroke-linejoin="round"/>` +
      `<path d="M${w/2} ${b*.25}l${a*.22} ${b*.38}h-${a*.44}z M${w/2} ${h-b*.25}l${a*.22} -${b*.38}h-${a*.44}z M${a*.25} ${h/2}l${a*.38} ${b*.22}v-${b*.44}z M${w-a*.25} ${h/2}l-${a*.38} ${b*.22}v-${b*.44}z" fill="${c}"/>`; }},
  stick: {name:'スティック', w:130, h:130, d:{fill:'#334155', line:'#94a3b8', lw:2, color:'#cbd5e1', op:0.7},
    p:['fill','line','lw','color','op'],
    draw:(e,w,h) => { const lw=+e.lw||0; return `<ellipse cx="${w/2}" cy="${h/2}" rx="${w/2-lw/2}" ry="${h/2-lw/2}" fill="${fillOf(e.fill)}" stroke="${lw?fillOf(e.line):'none'}" stroke-width="${lw}"/><ellipse cx="${w/2}" cy="${h/2}" rx="${w*.22}" ry="${h*.22}" fill="${fillOf(e.color)}"/>`; }},
  map: {name:'ミニマップ', w:120, h:120, d:{label:'', fill:'#14532d', line:'#e5e7eb', lw:2, color:'#facc15', fs:12, r:8, op:0.85},
    p:['label','fill','line','lw','r','color','fs','op'],
    draw:(e,w,h) => { let g=''; for (let i=1;i<4;i++) g+=`<path d="M${w*i/4} 0V${h}M0 ${h*i/4}H${w}" stroke="${fillOf(e.line)}" stroke-opacity=".25" stroke-width="1"/>`;
      return box(e,w,h) + g + `<circle cx="${w*.55}" cy="${h*.45}" r="${Math.min(w,h)*.06}" fill="${fillOf(e.color)}"/>` + (e.label?txt(e.label, w/2, h-(+e.fs||12), {...e}):''); }},
  tabs: {name:'タブ', w:390, h:64, d:{label:'ホーム|クエスト|装備|ショップ|設定', val:1, fill:'#111827', line:'#374151', lw:1, color:'#d1d5db', hi:'#3b82f6', fs:13, r:0},
    p:['label','val','fill','hi','line','lw','color','fs','op'],
    draw:(e,w,h) => { const t=String(e.label||'').split('|'), n=t.length||1, cw=w/n, sel=(+e.val||0)-1; let s=box(e,w,h);
      t.forEach((x,i)=>{ if(i===sel) s+=`<rect x="${i*cw+3}" y="3" width="${cw-6}" height="${h-6}" rx="8" fill="${fillOf(e.hi)}"/>`; if(i) s+=`<path d="M${i*cw} ${h*.2}V${h*.8}" stroke="${fillOf(e.line)}"/>`; s+=txt(x, i*cw+cw/2, h/2, {...e, color:i===sel?'#ffffff':e.color}); });
      return s; }},
  list: {name:'リスト', w:200, h:180, d:{label:'たたかう\nまほう\nどうぐ\nにげる', val:1, fill:'#000000', line:'#ffffff', lw:3, color:'#ffffff', fs:18, r:8, op:0.9},
    p:['label','val','fs','color','fill','line','lw','r','op'],
    draw:(e,w,h) => { const t=String(e.label||'').split('\n'), n=t.length||1, lw=+e.lw||0, rh=(h-lw*2-8)/n, sel=(+e.val||0)-1; let s=box(e,w,h);
      t.forEach((x,i)=>{ const cy=lw+4+rh*i+rh/2; if(i===sel) s+=`<path d="M${lw+10} ${cy-6}l9 6l-9 6z" fill="${fillOf(e.color)}"/>`; s+=txt(x, lw+26, cy, e, 'start'); if(i) s+=`<path d="M${lw+6} ${lw+4+rh*i}H${w-lw-6}" stroke="${fillOf(e.line)}" stroke-opacity=".2"/>`; });
      return s; }},
  image: {name:'画像', w:200, h:150, d:{label:'IMAGE', fill:'#475569', line:'#94a3b8', lw:2, color:'#e2e8f0', fs:14, r:6, src:''},
    p:['label','fill','line','lw','r','color','fs','op'],
    draw:(e,w,h) => { const lw=+e.lw||0;
      if (e.src) return `<defs><clipPath id="c${e.id}"><rect width="${w}" height="${h}" rx="${+e.r||0}"/></clipPath></defs><image href="${e.src}" width="${w}" height="${h}" preserveAspectRatio="xMidYMid ${e.fit==='contain'?'meet':'slice'}" clip-path="url(#c${e.id})"/>` + (lw?`<rect x="${lw/2}" y="${lw/2}" width="${w-lw}" height="${h-lw}" rx="${+e.r||0}" fill="none" stroke="${fillOf(e.line)}" stroke-width="${lw}"/>`:'');
      return box(e,w,h) + `<path d="M${lw} ${lw}L${w-lw} ${h-lw}M${w-lw} ${lw}L${lw} ${h-lw}" stroke="${fillOf(e.line)}" stroke-opacity=".5"/>` + (e.label?`<rect x="${w/2-Math.min(w*.4,60)}" y="${h/2-(+e.fs||14)}" width="${Math.min(w*.8,120)}" height="${(+e.fs||14)*2}" rx="4" fill="${fillOf(e.fill)}"/>`+txt(e.label, w/2, h/2, e):''); }},
  chara: {name:'キャラ', w:90, h:120, d:{label:'', fill:'#a78bfa', line:'#4c1d95', lw:3, color:'#ffffff', fs:14, op:1},
    p:['label','fill','line','lw','color','fs','op'],
    draw:(e,w,h) => { const lw=+e.lw||0, st=`fill="${fillOf(e.fill)}" stroke="${lw?fillOf(e.line):'none'}" stroke-width="${lw}"`, hr=Math.min(w*.26,h*.2);
      return `<circle cx="${w/2}" cy="${hr+lw}" r="${hr}" ${st}/><path d="M${w*.12} ${h-lw/2}Q${w*.12} ${hr*2+lw+6} ${w/2} ${hr*2+lw+6}Q${w*.88} ${hr*2+lw+6} ${w*.88} ${h-lw/2}Z" ${st}/>` + (e.label?txt(e.label, w/2, h*.72, e):''); }},
};
const ORDER = ['button','round','text','panel','bar','icon','msg','list','tabs','dpad','stick','map','image','chara'];
const EXTRA = { // 部品固有の設定項目
  align: {k:'align', t:'select', lab:'揃え', o:[['left','左'],['center','中央'],['right','右']]},
  val: {k:'val', t:'num', lab:'値/選択'},
  max: {k:'max', t:'num', lab:'最大'},
  num: {k:'num', t:'check', lab:'数値を出す'},
  bg2: {k:'bg2', t:'color', lab:'バー背景'},
  hi: {k:'hi', t:'color', lab:'選択色'},
  badge: {k:'badge', t:'text', lab:'バッジ'},
};
const PRESETS = [
  ['iPhone 縦 390×844', 390, 844], ['iPhone 横 844×390', 844, 390],
  ['iPhone SE 375×667', 375, 667], ['Android 縦 360×800', 360, 800], ['Android 横 800×360', 800, 360],
  ['iPad 縦 820×1180', 820, 1180], ['iPad 横 1180×820', 1180, 820],
  ['PC 1280×720', 1280, 720], ['PC 1920×1080', 1920, 1080], ['正方形 1080×1080', 1080, 1080],
];

// ===== 状態 =====
const KEY = 'uimock.v1';
let S, cur = null, zoom = 1, tab = 'pal';
let hist = [], hi = -1;
let view = {grid: true, snap: 8, safe: true};
const uid = () => Math.random().toString(36).slice(2, 9);
const scr = () => S.screens[S.cur] || S.screens[0];
const elById = id => scr().els.find(e => e.id === id);
function newScreen(name, w = 390, h = 844) { return {id: uid(), name, w, h, bg: '#2b3a55', bgSrc: '', els: []}; }
function load() {
  try { const j = JSON.parse(localStorage.getItem(KEY)); if (j && j.screens && j.screens.length) S = j; } catch (e) {}
  try { const v = JSON.parse(localStorage.getItem(KEY + '.view')); if (v) view = {...view, ...v}; } catch (e) {}
  if (!S) { S = {screens: [], cur: 0}; addTemplate('battle', true); }
  if (S.cur >= S.screens.length) S.cur = 0;
}
let saveT;
function save() {
  clearTimeout(saveT);
  saveT = setTimeout(() => {
    try { localStorage.setItem(KEY, JSON.stringify(S)); }
    catch (e) { toast('保存容量オーバー。画像を減らすかJSONで書き出してな'); }
  }, 200);
}
function saveView() { try { localStorage.setItem(KEY + '.view', JSON.stringify(view)); } catch (e) {} }
function commit() {
  const j = JSON.stringify(S);
  if (hist[hi] === j) return;
  hist = hist.slice(0, hi + 1); hist.push(j);
  if (hist.length > 80) hist.shift();
  hi = hist.length - 1; save(); updUndo();
}
function restore(j) { S = JSON.parse(j); if (cur && !elById(cur)) cur = null; renderAll(); save(); updUndo(); }
function undo() { if (hi > 0) restore(hist[--hi]); }
function redo() { if (hi < hist.length - 1) restore(hist[++hi]); }
function updUndo() { $('#bUndo').disabled = hi <= 0; $('#bRedo').disabled = hi >= hist.length - 1; }

// ===== 描画 =====
const $ = q => document.querySelector(q);
const stage = $('#stage'), elsBox = $('#els'), selBox = $('#sel'), area = $('#area'), wrap = $('#wrap');
function inner(e) { const T = TYPES[e.type]; return T ? T.draw(e, e.w, e.h) : ''; }
function elHTML(e) { return `<svg viewBox="0 0 ${e.w} ${e.h}" xmlns="http://www.w3.org/2000/svg">${inner(e)}</svg>`; }
function placeEl(div, e) {
  Object.assign(div.style, {left: e.x + 'px', top: e.y + 'px', width: e.w + 'px', height: e.h + 'px', opacity: e.op ?? 1, display: e.hide ? 'none' : ''});
  div.classList.toggle('lock', !!e.lock);
}
function renderEls() {
  elsBox.innerHTML = '';
  for (const e of scr().els) {
    const d = document.createElement('div');
    d.className = 'el'; d.dataset.id = e.id; d.innerHTML = elHTML(e); placeEl(d, e);
    elsBox.appendChild(d);
  }
}
function renderOne(e) {
  const d = elsBox.querySelector(`[data-id="${e.id}"]`);
  if (!d) return renderEls();

    case 'mCopy': return copyJson();
    case 'mLoad': return $('#fJson').click();
    default: return;
  }
  closeMenu(); renderAll(); fit(); commit();
});
$('#fJson').addEventListener('change', ev => {
  const f = ev.target.files[0]; ev.target.value = ''; if (!f) return;
  f.text().then(t => {
    const j = JSON.parse(t);
    if (!j.screens || !Array.isArray(j.screens)) throw 0;
    if (!confirm('今の内容を読み込んだJSONで置き換えますか？')) return;
    S = j; S.cur = 0; cur = null; closeMenu(); renderAll(); fit(); commit(); toast('読み込みました');
  }).catch(() => toast('このJSONは読めませんでした'));
});
function copyJson() {
  const s = scr(), out = {screen: s.name, w: s.w, h: s.h, bg: s.bg, elements: s.els.filter(e => !e.hide).map(e => { const o = {...e}; delete o.id; if (o.src) o.src = '(画像)'; return o; })};
  const t = JSON.stringify(out, null, 1);
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast('この画面のJSONをコピーしました'), () => toast('コピーできませんでした'));
}
const stamp = () => { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`; };
function download(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
function screenSVG(s) {
  let b = `<rect width="${s.w}" height="${s.h}" fill="${fillOf(s.bg)}"/>`;
  if (s.bgSrc) b += `<image href="${s.bgSrc}" width="${s.w}" height="${s.h}" preserveAspectRatio="xMidYMid slice"/>`;
  for (const e of s.els) if (!e.hide) b += `<g transform="translate(${e.x} ${e.y})" opacity="${e.op ?? 1}"><svg width="${e.w}" height="${e.h}" viewBox="0 0 ${e.w} ${e.h}" overflow="visible">${inner(e)}</svg></g>`;
  return `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="${s.w}" height="${s.h}" viewBox="0 0 ${s.w} ${s.h}">${b}</svg>`;
}
function exportPng() {
  const s = scr(), k = s.w * s.h > 2e6 ? 1 : 2;
  const im = new Image();
  im.onload = () => {
    const c = document.createElement('canvas'); c.width = s.w * k; c.height = s.h * k;
    const x = c.getContext('2d'); x.scale(k, k); x.drawImage(im, 0, 0, s.w, s.h);
    c.toBlob(bl => { download(bl, `ui-mock-${S.cur + 1}-${stamp()}.png`); toast('PNGを保存しました'); }, 'image/png');
  };
  im.onerror = () => toast('PNGにできませんでした');
  im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(screenSVG(s));
}

// ===== テンプレート =====

// ===== トースト・イベント =====
let toastT;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1600); }
document.querySelectorAll('.tabs [data-t]').forEach(b => b.onclick = () => setTab(b.dataset.t));
$('#bMin').onclick = () => { const m = $('#bottom').classList.toggle('min'); $('#bMin').textContent = m ? '▴' : '▾'; setTimeout(fit, 0); };
$('#bUndo').onclick = undo; $('#bRedo').onclick = redo;
$('#bZi').onclick = () => { zoom = Math.min(4, zoom * 1.25); applyZoom(); };
$('#bZo').onclick = () => { zoom = Math.max(0.1, zoom / 1.25); applyZoom(); };
$('#bFit').onclick = fit;
$('#bMenu').onclick = openMenu;
$('#scrSel').onchange = ev => { S.cur = +ev.target.value; cur = null; renderAll(); fit(); save(); };
area.addEventListener('wheel', ev => { if (ev.ctrlKey) { ev.preventDefault(); zoom = Math.max(0.1, Math.min(4, zoom * (ev.deltaY < 0 ? 1.1 : 1 / 1.1))); applyZoom(); } }, {passive: false});
// 2本指ピンチで拡大縮小
const pts = new Map(); let pinch = null;
area.addEventListener('pointerdown', ev => { pts.set(ev.pointerId, ev); if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = {d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), z: zoom}; if (drag) { const o = drag; drag = null; Object.assign(o.e, o.o); renderOne(o.e); renderSel(); } } }, true);
area.addEventListener('pointermove', ev => { if (!pts.has(ev.pointerId)) return; pts.set(ev.pointerId, ev); if (pinch && pts.size === 2) { const [a, b] = [...pts.values()]; zoom = Math.max(0.1, Math.min(4, pinch.z * Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) / pinch.d)); applyZoom(); } }, true);
const up = ev => { pts.delete(ev.pointerId); if (pts.size < 2) pinch = null; };
area.addEventListener('pointerup', up, true); area.addEventListener('pointercancel', up, true);
window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(fit, 150); }); let rzT;

load(); renderAll(); fit(); commit();
