<body>
<title>激突！暗記大戦</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: 胡桃材の卓に一枚の札。上に札、下に手元のテンキー。片手で遊べる縦一列。単一テーマ（夜の座敷）で配色を固定。 */
:root{
  color-scheme:dark;
  --table:#241c16; --table-2:#30261e; --ink:#efe6d4; --muted:#b5a68e;
  --card:#f2e9d6; --card-ink:#2e2219; --card-muted:#7d6a55;
  --shu:#7a4a2b; --kin:#c8a464; --ok:#8fae74; --ng:#c98c78; --line:#4a3b2e;
  --digits:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
  --mincho:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
}
html,body{height:100%}
body{background:var(--table);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.7;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--table)}
.app{max-width:520px;margin:0 auto;min-height:100%;box-sizing:border-box;padding-block:16px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--digits);font-weight:800;font-size:30px;margin:0;letter-spacing:.04em;line-height:1.3}
h1 span{color:var(--kin)}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:12.5px}
button{font:inherit;color:inherit;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--kin);outline-offset:2px}
.btn{background:var(--shu);color:#fff;font-weight:700;padding:13px 18px;border-radius:10px;font-size:16px}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.panel{background:var(--table-2);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
label{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
input,select{font:inherit;font-size:16px;background:var(--table);color:var(--ink);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lv{background:var(--table);border:1.5px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;gap:2px}
.lv b{font-size:15px}
.lv span{font-size:12px;color:var(--muted)}
.lv[aria-pressed="true"]{border-color:var(--kin);background:#2a2a2a00;box-shadow:inset 0 0 0 1px var(--kin)}
.players{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--table);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.chip.me{border-color:var(--kin)}
.chip .s{font-family:var(--digits);color:var(--kin)}
.chip .st{font-size:11px;color:var(--muted)}
.chip .st.ok{color:var(--ok)}
.invite{background:var(--kin);color:#2a1d10;border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.invite button{background:#1a1408;color:var(--kin);font-weight:700;padding:8px 14px;border-radius:8px}
/* game */
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.bar .prog{font-family:var(--digits);color:var(--ink);font-size:15px}
.bar .prog,.bar .mute{white-space:nowrap;flex:none}
#eraRange{flex:1;min-width:0;font-size:12px;line-height:1.3}
.timer{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--kin);width:100%;transform-origin:left}
.card{background:var(--card);color:var(--card-ink);border-radius:14px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:6px;box-shadow:0 10px 30px #0006;position:relative;overflow:hidden}
.card::after{content:"";position:absolute;inset:6px;border:1px solid #c2ab84;border-radius:10px;pointer-events:none}
.card .era{font-size:12px;letter-spacing:.2em;color:var(--shu);font-weight:700}
.card .ev{font-family:var(--mincho);font-weight:700;font-size:clamp(22px,6.4vw,30px);line-height:1.35;text-wrap:balance}
.card .en{color:var(--card-muted);font-size:14px;line-height:1.4}
.flip{animation:flip .45s ease-out}
@keyframes flip{from{transform:perspective(700px) rotateY(80deg);opacity:.2}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.flip{animation:none}}
.slots{display:flex;justify-content:center;gap:8px}
.slot{font-weight:700;width:54px;height:66px;border-radius:10px;background:var(--table-2);border:2px solid var(--line);display:grid;place-items:center;font-family:var(--digits);font-size:34px}
.slot.cur{border-color:var(--kin)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{font-weight:600;background:var(--table-2);border:1px solid var(--line);border-radius:12px;height:58px;font-family:var(--digits);font-size:26px}
.key:active{background:var(--line)}
.key.fn{font-family:var(--body);font-size:15px;font-weight:700}
.key.pass{color:var(--muted)}
.waiting{text-align:center;color:var(--muted);font-size:14px;min-height:1.7em}
/* reveal */
.year{font-family:var(--digits);font-weight:800;font-variant-numeric:tabular-nums;font-size:56px;line-height:1;color:var(--shu);letter-spacing:.02em}
.year small{font-size:16px;margin-left:4px;color:var(--card-muted);font-family:var(--body)}
.expl{font-size:14.5px;line-height:1.85;color:var(--card-ink)}
.goro{background:#fff6;border:1px dashed #c9b48f;border-radius:8px;padding:6px 10px;font-size:14px}
.goro b{color:var(--shu)}
.answers{display:flex;flex-direction:column;gap:6px}
.arow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;background:var(--table-2);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.arow .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow .v{font-family:var(--digits);font-size:18px}
.mark{font-weight:700;font-size:13px}
.mark.ok{color:var(--ok)} .mark.ng{color:var(--ng)} .mark.near{color:var(--kin)}
/* result */
.banzuke{display:flex;flex-direction:column;gap:8px}
.rank{display:grid;grid-template-columns:3.2em 1fr auto;gap:10px;align-items:center;background:var(--table-2);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.rank .r{font-family:var(--mincho);font-weight:800;color:var(--kin)}
.rank .sc{font-family:var(--digits);font-size:22px}
.rank .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.miss{display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.miss div{display:grid;grid-template-columns:3.4em 1fr;gap:8px}
.miss b{font-family:var(--digits);font-weight:700;color:var(--kin)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row > *{flex:1 1 140px}
.gap{font-size:12.5px;color:var(--card-muted);margin-top:-2px}
.flow{display:flex;flex-direction:column;gap:6px;margin-top:6px;border-top:1px solid #d9c9a8;padding-top:10px}
.fr{font-size:15px;line-height:1.7}
.fr.arrow{padding-left:1.3em;text-indent:-1.3em}
.fr.arrow.dot::before{content:"・";color:var(--shu);font-size:1em;font-weight:700}
.fr.arrow.cz::before{content:"→";font-size:1em;font-weight:700}
.fr.arrow::before{content:"▶";color:var(--shu);font-size:.8em;display:inline-block;width:1.6em;text-indent:0}
.fk{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--shu);border:1px solid #e3b9a8;border-radius:4px;text-align:center;padding:1px 0}
.fv{min-width:0}
.bce{align-self:flex-end;font-size:14px;color:var(--muted);padding-bottom:6px}
.genres{grid-template-columns:repeat(2,1fr)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice{background:var(--table-2);border:1px solid var(--line);border-radius:12px;min-height:56px;padding:8px;font-size:16px;font-weight:700;line-height:1.35}
.choice.pass{grid-column:1/-1;min-height:44px;color:var(--muted);font-weight:500}
.choice.picked{border-color:var(--kin);box-shadow:inset 0 0 0 1px var(--kin)}
.choice:disabled{opacity:.6}
.choice.picked:disabled{opacity:1}
.qtext{display:flex;flex-direction:column;gap:6px;font-size:17px;line-height:1.7;font-weight:600}
.photo{width:100%;aspect-ratio:4/3;object-fit:contain;background:#e4d8bf;border-radius:8px;max-width:100%;display:block}
.voice{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 0 8px}
.voice .wave{display:flex;gap:4px;align-items:center;height:34px}
.voice .wave i{width:5px;border-radius:3px;background:var(--shu);height:8px;opacity:.5}
.voice.playing .wave i{animation:wv 1s ease-in-out infinite;opacity:.9}
.voice .wave i:nth-child(2n){animation-delay:.2s}.voice .wave i:nth-child(3n){animation-delay:.45s}
@keyframes wv{0%,100%{height:8px}50%{height:32px}}
@media (prefers-reduced-motion:reduce){.voice.playing .wave i{animation:none;height:20px}}
.playbtn{background:var(--shu);color:#fff;font-weight:700;border-radius:999px;padding:9px 18px;font-size:15px}
.voice .vnote{font-size:12.5px;color:var(--card-muted)}
.credit{font-size:11px;line-height:1.55;color:var(--card-muted);margin-top:6px}
.credit a{color:inherit}
.bname{font-size:34px;font-weight:800;color:var(--shu);line-height:1.2}
.bsub{font-size:13px;color:var(--card-muted)}
.arow .v.vs{font-size:14px;font-family:var(--body);font-weight:700}
.mute{background:transparent;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--muted)}
.answers.flipin .arow{animation:aflip .5s ease-out both}
.answers.flipin .arow:nth-child(2){animation-delay:.25s}.answers.flipin .arow:nth-child(3){animation-delay:.5s}.answers.flipin .arow:nth-child(4){animation-delay:.75s}.answers.flipin .arow:nth-child(n+5){animation-delay:1s}
@keyframes aflip{from{transform:perspective(500px) rotateX(-90deg);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.answers.flipin .arow{animation:none}}
.arow .stp{font-size:20px;line-height:1;min-width:1.2em;text-align:center}
.arow .stp.pop{animation:pop .6s ease-out}
@keyframes pop{0%{transform:scale(.2)}60%{transform:scale(1.5)}100%{transform:scale(1)}}
.stamps{display:flex;justify-content:center;gap:8px}
.stamps button{background:var(--table-2);border:1px solid var(--line);border-radius:999px;width:48px;height:40px;font-size:20px}
.stamps button:active{background:var(--line)}
.card.big{box-shadow:0 0 0 2px var(--kin),0 10px 30px #0006}
.bigtag{display:inline-block;background:var(--kin);color:#2a1d10;font-size:11.5px;font-weight:800;letter-spacing:.1em;border-radius:4px;padding:1px 8px;margin-right:6px}
.mapbox{position:relative;border-radius:8px;overflow:hidden;background:#cfd9d6;border:1px solid #c9b48f}
.mapbox svg{display:block;width:100%;height:auto}
.mapbox .land{fill:#e9dcc0;stroke:#a88f6a;stroke-width:.8;vector-effect:non-scaling-stroke}
.mapbox .pin{fill:var(--shu);stroke:#fff;stroke-width:2;vector-effect:non-scaling-stroke}
.mapbox .ring{fill:none;stroke:var(--shu);stroke-width:2;vector-effect:non-scaling-stroke;transform-box:fill-box;transform-origin:center;animation:ring 1.6s ease-out infinite}
@keyframes ring{from{transform:scale(.4);opacity:1}to{transform:scale(2.2);opacity:0}}
@media (prefers-reduced-motion:reduce){.mapbox .ring{animation:none}}
.mapcap{position:absolute;left:8px;bottom:6px;background:#2e2219d9;color:#f2e9d6;font-size:12px;font-weight:700;border-radius:4px;padding:2px 8px;max-width:calc(100% - 16px)}
.links{display:flex;flex-direction:column;gap:6px;margin-top:8px;border-top:1px solid #d9c9a8;padding-top:10px}
.links .lh{font-size:11.5px;font-weight:700;letter-spacing:.1em;color:var(--shu)}
.chain{display:flex;flex-direction:column;align-items:stretch;gap:0}
.node{border:1px solid #cdb995;background:#fff8;border-radius:8px;padding:5px 10px;font-size:13.5px;line-height:1.45}
.node b{font-weight:800;color:var(--shu);margin-right:6px;font-variant-numeric:tabular-nums}
.node.me{background:var(--shu);color:#fff;border-color:var(--shu)}
.node.me b{color:#f2e0b8}
.node .soon{font-size:10.5px;color:var(--card-muted);border:1px solid #cdb995;border-radius:3px;padding:0 4px;margin-left:6px;white-space:nowrap}
.edge{font-size:12px;color:var(--card-muted);padding:3px 0 3px 22px;position:relative}
.edge::before{content:"";position:absolute;left:12px;top:0;bottom:0;border-left:2px solid #c2ab84}
.edge::after{content:"▼";position:absolute;left:7.5px;bottom:-4px;font-size:9px;color:#a88f6a}
.terrain{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-top:4px}
.terrain div{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10.5px;color:#b3a184;border-radius:6px;padding:4px 0 3px;background:#0000}
.terrain svg{width:26px;height:20px}
.terrain .on{background:#7a4a2b1f;color:var(--shu);font-weight:700}
.terrain svg *{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.vtabs{display:flex;gap:4px;margin-bottom:-2px}
.vtabs button{font-size:12px;font-weight:700;padding:3px 12px;border-radius:999px;background:transparent;border:1px solid #c9b48f;color:var(--card-muted)}
.vtabs button[aria-pressed="true"]{background:var(--shu);border-color:var(--shu);color:#fff}
.docimg{margin:0;display:flex;flex-direction:column;gap:3px}
.docimg img{width:100%;max-height:260px;object-fit:contain;background:#e4d8bf;border-radius:8px;display:block}
.docimg figcaption{font-size:12.5px;color:var(--card-muted)}
.rules{margin:0;padding-left:1.2em;color:var(--muted);line-height:1.8}
.habnote{font-size:13.5px;line-height:1.6}
.hard{display:flex;flex-direction:column;gap:4px;font-size:13.5px}
[hidden]{display:none!important}
</style>

<div class="app" id="app">

  <!-- ロビー -->
  <section id="lobby" style="display:flex;flex-direction:column;gap:14px">
    <h1>激突！<span>暗記</span>大戦</h1>
    <ul class="rules">
      <li>歴史は年号、鳥は名前を当てる</li>
      <li>1問10秒。全員答えたら答え合わせ</li>
      <li>正解で1点。早押しの差はなし</li>
    </ul>

    <div class="invite" id="invite" hidden>
      <span id="inviteText"></span>
      <button id="joinBtn" type="button">参加する</button>
    </div>

    <div class="panel">
      <label for="nick">あなたの名前
        <input id="nick" maxlength="12" placeholder="例：本能寺の火元" autocomplete="off">
      </label>
      <div style="display:flex;flex-direction:column;gap:6px">
        <span class="small muted">ジャンル</span>
        <div class="levels genres" id="genres"></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px" id="modesBox">
        <span class="small muted" id="modesLabel">出題範囲</span>
        <div class="levels" id="modes"></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <span class="small muted">難易度（出題数）</span>
        <div class="levels" id="levels"></div>
        <p class="small muted" id="rangeNote"></p>
      </div>
      <button class="btn" id="startBtn" type="button">対戦をはじめる</button>
    </div>

    <div class="panel">
      <span class="small muted">いまこのページを開いている人</span>
      <div class="players" id="lobbyPlayers"></div>
      <p class="small muted" id="roomNote">接続を確認しています…</p>
    </div>
  </section>

  <!-- 出題 -->
  <section id="game" hidden style="display:flex;flex-direction:column;gap:12px">
    <div class="bar"><span class="prog" id="prog"></span><span id="eraRange"></span><button class="mute" id="muteBtn" type="button" aria-pressed="true">音：オン</button><button class="mute" id="quitBtn" type="button">やめる</button></div>
    <div class="players" id="gamePlayers"></div>
    <div class="timer"><i id="timerBar"></i></div>
    <div class="card" id="card">
      <span class="era" id="cEra"></span>
      <span class="ev" id="cEv"></span>
      <span class="en" id="cEn"></span>
    </div>

    <div id="askArea" style="display:flex;flex-direction:column;gap:12px">
      <div class="slots" id="slots"></div>
      <div class="waiting" id="waitAsk"></div>
      <div class="keypad" id="keypad"></div>
      <div class="choices" id="choices" hidden></div>
    </div>

    <div id="revealArea" hidden style="display:flex;flex-direction:column;gap:12px">
      <div class="answers" id="answers"></div>
      <div class="stamps" id="stamps"></div>
      <button class="btn" id="nextBtn" type="button">次へ</button>
      <div class="waiting" id="waitNext"></div>
    </div>
  </section>

  <!-- 結果 -->
  <section id="result" hidden style="display:flex;flex-direction:column;gap:14px">
    <h1>番付</h1>
    <div class="banzuke" id="banzuke"></div>
    <div class="panel">
      <span class="small muted">あなたが外した札（復習用）</span>
      <div class="miss" id="missList"></div>
      <button class="btn" id="revengeBtn" type="button" hidden>外した札だけでリベンジ戦</button>
    </div>
    <div class="panel" id="hardBox" hidden>
      <span class="small muted">全員が外した今日の難問</span>
      <div class="hard" id="hardList"></div>
    </div>
    <div class="row">
      <button class="btn" id="againBtn" type="button">もう一度</button>
      <button class="btn ghost" id="lobbyBtn" type="button">ロビーへ</button>
    </div>
  </section>

</div>

<script src="map.js"></script>
<script>
// 形式: [年(紀元前はマイナス), 難易度(1やさしい 2ふつう 3むずかしい), 出来事, 英名, 時代/地域, きっかけ, できごと, その後, 語呂]
const JP = [
[57,2,"奴国の王が金印を授かる","King of Na receives a gold seal from Han China","弥生","小さな国々が争い、強い後ろ盾が欲しかった","九州北部の奴国王が後漢に使いを送り、金印を授かる","日本が文字の記録に初めて登場。金印は江戸時代に志賀島で見つかる"],

// 季節: 冬鳥は10〜4月、夏鳥は4〜9月
function inSeason(c,m){ return c.season==="冬"? (m>=10||m<=4) : c.season==="夏"? (m>=4&&m<=9) : true; }
const GENRES=[{id:"H",name:"歴史"},{id:"B",name:"関東の鳥"}];
function rng(seedStr){let h=1779033703^seedStr.length;for(let i=0;i<seedStr.length;i++){h=Math.imul(h^seedStr.charCodeAt(i),3432918353);h=h<<13|h>>>19;}
  return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return (h>>>0)/4294967296;};}
function shuffle(arr,r){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function choicesFor(deck,qi,gid){
  const c=deck[qi], r=rng(gid+":"+qi), pool=deck.filter(x=>x!==c);
  const same=shuffle(pool.filter(x=>x.grp===c.grp),r), other=shuffle(pool.filter(x=>x.grp!==c.grp),r);
  const picks=same.slice(0,2).concat(other).slice(0,3);
  return shuffle([c].concat(picks),r).map(x=>x.name);
}
const MODES=[{id:"J",name:"日本史"},{id:"W",name:"世界史"},{id:"M",name:"ミックス"}];
const BMODES=[{id:"V",name:"写真＋鳴き声"},{id:"P",name:"写真のみ"}];
const LEVELS=[{lv:1,name:"やさしい"},{lv:2,name:"ふつう"},{lv:3,name:"むずかしい"},{lv:4,name:"今月の鳥"}];
function sortYears(d){ return d.slice().sort((a,b)=>a.y-b.y || (a.src==="J"?-1:1)); }
function birdDeck(d,gid,bmode){ if(!gid) return d; const r=rng(gid), sd=shuffle(d,r); return sd.map(c=>({...c,q:(bmode==="V"&&c.m.snd&&r()<0.5)?"V":"P"})); }
function deckFor(mode,lv,genre,gid,bmode,custom){
  if(Array.isArray(custom)&&custom.length){ const d=custom.map(k=>BYKEY[k]).filter(Boolean); return genre==="B"? birdDeck(d,gid,bmode) : sortYears(d); }
  if(genre==="B"){ const m=new Date().getMonth()+1; return birdDeck(ALL.B.filter(c=>(lv===4?inSeason(c,m):c.lv<=lv) && c.m.img),gid,bmode); }
  const base = mode==="J"?ALL.J : mode==="W"?ALL.W : ALL.J.concat(ALL.W);
  return base.filter(c=>c.lv<=lv).slice().sort((a,b)=>a.y-b.y || (a.src==="J"?-1:1));
}

let AC=null, muted=(()=>{try{return localStorage.getItem("nb-mute")==="1"}catch(e){return false}})();
function ac(){ try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended") AC.resume(); }catch(e){ AC=null; } return AC; }
function tone(freq,start,dur,vol,type){ const a=ac(); if(!a) return; const t=a.currentTime+start;
  const o=a.createOscillator(), g=a.createGain(); o.type=type||"sine"; o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.015); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+0.05); }
function se(kind){ if(muted) return;
  if(kind==="ok"){ tone(784,0,0.35,0.12); tone(1175,0.09,0.5,0.10); }        // ソ→レ、軽い鈴のような2音
  else if(kind==="ng"){ tone(311,0,0.32,0.09,"triangle"); tone(233,0.12,0.4,0.08,"triangle"); } // 低めに下がる2音
  else if(kind==="flip"){ tone(1568,0,0.06,0.03); }
}

const SVGNS="http://www.w3.org/2000/svg";
function svgEl(t,a){ const e=document.createElementNS(SVGNS,t); for(const k in a) e.setAttribute(k,a[k]); return e; }
function mapFor(c){
  if(!c.place||typeof GEO==="undefined") return null;
  const [lat,lon,label,view,wdeg]=c.place; let path,x,y,vb;
  if(view==="w"||c.src==="W"){
    const K=GEO.K, w=(wdeg||55)*K, h=w*0.6; x=lon*K; y=-lat*K;
    let x0=x-w/2, y0=Math.max(-75*K, Math.min(y-h/2, 60*K-h)); vb=[x0,y0,w,h]; path=GEO.world;
  } else {
    const J=GEO.J, w=13*J*GEO.c, h=w*0.62; x=(lon-122)*GEO.c*J; y=(46-lat)*J;
    let x0=Math.max(0,Math.min(x-w/2,GEO.jw-w)), y0=Math.max(0,Math.min(y-h/2,GEO.jh-h)); vb=[x0,y0,w,h]; path=GEO.japan;
  }
  const r=vb[2]/70;
  const svg=svgEl("svg",{viewBox:vb.join(" "),role:"img","aria-label":"地図："+label});
  svg.append(svgEl("path",{d:path,class:"land"}), svgEl("circle",{cx:x,cy:y,r:r*1.6,class:"ring"}), svgEl("circle",{cx:x,cy:y,r:r,class:"pin"}));
  const box=el("div","mapbox reveal-x"); box.append(svg, el("span","mapcap","📍 "+label)); return box;
}
function docFor(c){
  if(!c.doc) return null; const f=el("figure","docimg reveal-x"); const im=document.createElement("img"); im.src=c.doc[0]; im.alt=c.doc[4]; im.loading="lazy";
  f.append(im, el("figcaption",null,c.doc[4])); return f;
}

function linksFor(c){
  const ca=(CAUSES[c.key]||[]).slice(-2), ef=(EFFECTS[c.key]||[]).slice(0,2);
  if(!ca.length&&!ef.length) return null;
  const box=el("div","links reveal-x"); box.append(el("span","lh","つながり"));
  const ch=el("div","chain");
  ca.forEach(([k,t])=>{ ch.append(nodeFor(k)); ch.append(el("div","edge",t)); });
  ch.append(nodeFor(c.key,true));
  ef.forEach(([k,t])=>{ ch.append(el("div","edge",t)); ch.append(nodeFor(k)); });
  box.append(ch); return box;
}

const VOICE_BUF=new Map(); let voiceSrc=null, voiceEl=null;
function loadVoice(url){
  if(VOICE_BUF.has(url)) return VOICE_BUF.get(url);
  const p=fetch(url).then(r=>{ if(!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
    .then(ab=>{ const a=ac(); if(!a) throw new Error("noaudio"); return new Promise((ok,ng)=>a.decodeAudioData(ab,ok,ng)); });
  p.catch(()=>VOICE_BUF.delete(url)); VOICE_BUF.set(url,p); return p;
}
function setPlaying(on){ const v=document.getElementById("voiceBox"); if(v) v.classList.toggle("playing",on); }
function stopVoice(){ try{ if(voiceSrc) voiceSrc.stop(); }catch(e){} voiceSrc=null; if(voiceEl){ voiceEl.pause(); voiceEl=null; } setPlaying(false); }
function playVoice(c,manual){
  if(!c.m.snd || (muted && !manual)) return;
  const url=c.m.snd[0], qi=S.qi; stopVoice();
  loadVoice(url).then(buf=>{ if(S.qi!==qi||S.view!=="game") return; const a=ac(); stopVoice();
    const src=a.createBufferSource(), g=a.createGain(); g.gain.value=0.9; src.buffer=buf; src.connect(g).connect(a.destination);
    src.onended=()=>{ if(voiceSrc===src){ voiceSrc=null; setPlaying(false);} }; src.start(); voiceSrc=src; setPlaying(true);
  }).catch(()=>{ // Web Audioが使えない端末は audio 要素で
    if(S.qi!==qi) return; const au=new Audio(url); voiceEl=au; au.onended=()=>setPlaying(false); au.play().then(()=>setPlaying(true)).catch(()=>{});
  });
}
function preloadNext(){
  const n=S.deck[S.qi+1]; if(!n||n.kind!=="choice") return;
  if(n.q==="V"&&n.m.snd) loadVoice(n.m.snd[0]);
  if(n.m.img){ const im=new Image(); im.src=n.m.img[0]; }
}

    if(p.childNodes.length) p.append(document.createElement("br"));
    p.append(label+"："+who+(extra?"（"+extra+"）":"")+"／"+lic+"／");

  return p;
}

// 公開版: Supabase Realtime の presence で同じ部屋の人をつなぐ（DBの表は使わない）
function sbRoom(cfg){
  const sb=window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:false,autoRefreshToken:false}});
  const me=Math.random().toString(36).slice(2,10); let list=[], cbs=[], errCb=null, ready=false, pending=null, timer=null, lastSent=0;
  const ch=sb.channel("anki-taisen:"+cfg.room,{config:{presence:{key:me}}});
  ch.on("presence",{event:"sync"},()=>{ const st=ch.presenceState();
    list=Object.entries(st).filter(([k])=>k!==me).map(([k,arr])=>({sameTab:false,kind:"viewer",presence:(arr[arr.length-1]||{}).p}));
    cbs.forEach(f=>{try{f()}catch(e){}}); });
  const flush=()=>{ timer=null; if(!ready||!pending) return; lastSent=Date.now(); const p=pending; pending=null; ch.track({p}).catch(()=>{}); };
  const api={
    presence(p){ pending=p; if(!timer){ const wait=Math.max(0,200-(Date.now()-lastSent)); timer=setTimeout(flush,wait); } return Promise.resolve(); },
    peers(){ return list; },
    onPeers(f,e){ cbs.push(f); errCb=e; }
  };
  return new Promise(res=>{ let done=false; ch.subscribe(st=>{
    if(st==="SUBSCRIBED"){ ready=true; if(pending) flush(); if(!done){done=true;res(api);} }
    else if(st==="CHANNEL_ERROR"||st==="TIMED_OUT"||st==="CLOSED"){ if(!done){done=true;res(null);} else if(errCb) errCb(); }
  }); setTimeout(()=>{ if(!done){done=true;res(null);} },10000); });
}

  if(!room){ $("roomNote").textContent="いまは一人で遊べます。友人と対戦するには、このページを友人と共有して同時に開いてください。"; return; }
  $("roomNote").textContent="同じページを開いた友人がここに並びます。誰かが「対戦をはじめる」を押すと、ほかの人に参加ボタンが出ます。";
  room.onPeers(()=>check(), ()=>{ $("roomNote").textContent="接続できませんでした。一人で遊べます。"; room=null; });
  push();
})();
</script>
