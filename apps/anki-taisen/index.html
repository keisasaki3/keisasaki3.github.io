<body>
<title>激突！暗記大戦</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: 窓辺の明るい部屋（ミント）と栗色の壁（夜）の2トーン。上は胡桃色の見出し帯、中央に白い札、下に手元の操作。片手で遊べる縦一列。トーンは data-tone で切り替え。 */
:root{
  color-scheme:light;
  --pg:#eef5f1; --surf:#ffffff; --surf2:#f1f7f4; --ink:#2d3a35; --muted:#6d7f77; --line:#cfe0d7;
  --head:#4b392e; --onhead:#f2f7f4; --acc:#5fae95; --onacc:#10241d; --acc-ink:#2f7d65;
  --btn:#4b392e; --onbtn:#f2f7f4; --brand:#4b392e;
  --card:#fcfefd; --card-ink:#2d3733; --card-muted:#66786f; --card-line:#d3e2da; --card-line2:#a9c4b8; --card-soft:#eef5f1; --card-acc:#2f7d65; --photo:#e3efe9;
  --ok:#3f9a77; --ng:#b9585a;
  --shadow:0 6px 22px #4b392e22; --panel-shadow:0 2px 10px #4b392e14; --soft-acc:#5fae9533;
  --capbg:#4b392ee6; --capink:#f6efe6;
  --sea:#d3e6e3; --land:#f3efe2; --landline:#a9b8a8; --pin:#b9585a;
  --digits:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
  --mincho:var(--digits); --body:var(--digits);
}
:root[data-tone="chestnut"]{
  color-scheme:dark;
  --pg:#43322a; --surf:#523e34; --surf2:#3b2b23; --ink:#f0f4f1; --muted:#c4b4a6; --line:#6c564a;
  --head:#5a4439; --onhead:#f3f7f4; --acc:#8ccdb4; --onacc:#102a21; --acc-ink:#8ccdb4;
  --btn:#8ccdb4; --onbtn:#102a21;
  --card:#f3f7f4; --card-ink:#2d3733; --card-soft:#e6f0ea; --photo:#dfeae4;
  --ok:#9ad9b5; --ng:#f0a0a0;
  --shadow:0 10px 28px #0006; --panel-shadow:none; --soft-acc:#8ccdb455;
}
html{background:var(--pg)}
html,body{height:100%}
body{background:var(--pg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.7;margin:0;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--pg)}
.app{max-width:520px;margin:0 auto;min-height:100%;box-sizing:border-box;padding-block:16px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--digits);font-weight:900;font-size:clamp(28px,8.6vw,46px);margin:0;letter-spacing:0;white-space:nowrap;line-height:1.15;background:var(--head);color:var(--onhead);border-radius:26px;padding:22px 14px 20px;text-align:center;text-shadow:0 4px 0 #0003;box-shadow:0 6px 0 #0002}
h1 span{color:var(--acc)}
h1 .tilt{display:inline-block;font-size:1.55em;line-height:.8;color:var(--acc);transform:rotate(-16deg) translateY(-.02em);margin:0 .08em;text-shadow:0 5px 0 #0003}
h1 small{display:block;font-size:.3em;font-weight:700;letter-spacing:.3em;color:var(--onhead);opacity:.75;text-shadow:none;margin-top:6px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:12.5px}
button{font:inherit;color:inherit;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc-ink);outline-offset:2px}
.btn{background:var(--btn);color:var(--onbtn);font-weight:800;padding:13px 18px;border-radius:12px;font-size:16px}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.panel{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--panel-shadow)}
label{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
input,select{font:inherit;font-size:16px;background:var(--surf2);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lv{background:var(--surf2);border:1.5px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;gap:2px;color:var(--ink)}
.lv b{font-size:15px}
.lv span{font-size:12px;color:var(--muted)}
.lv[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.lv[aria-pressed="true"] span{color:var(--onacc);opacity:.78}
.players{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--surf);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.chip.me{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.chip .s{font-family:var(--digits);color:var(--acc-ink);font-weight:700}
.chip .st{font-size:11px;color:var(--muted)}
.chip .st.ok{color:var(--ok)}
.invite{background:var(--acc);color:var(--onacc);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.invite button{background:var(--head);color:var(--onhead);font-weight:800;padding:8px 14px;border-radius:9px}
/* game */
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;background:var(--head);color:var(--onhead);border-radius:14px;padding:8px 10px 8px 14px}
.bar .prog{font-family:var(--digits);color:var(--onhead);font-size:15px;font-weight:700}
.bar .prog,.bar .mute{white-space:nowrap;flex:none}
#eraRange{flex:1;min-width:0;font-size:12px;line-height:1.3;opacity:.85}
.timer{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--acc);width:100%;transform-origin:left}
.card{background:var(--card);color:var(--card-ink);border:1px solid var(--card-line);border-radius:18px;padding:16px 16px 15px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.card .era{font-size:12px;letter-spacing:.16em;color:var(--brand);font-weight:800}
.card .ev{font-family:var(--mincho);font-weight:800;font-size:clamp(22px,6.4vw,30px);line-height:1.35;text-wrap:balance}
.card .en{color:var(--card-muted);font-size:14px;line-height:1.4}
.flip{animation:flip .45s ease-out}
@keyframes flip{from{transform:perspective(700px) rotateY(80deg);opacity:.2}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.flip{animation:none}}
.slots{display:flex;justify-content:center;gap:8px}
.slot{font-weight:800;width:54px;height:66px;border-radius:12px;background:var(--surf);border:2px solid var(--line);display:grid;place-items:center;font-family:var(--digits);font-size:34px}
.slot.cur{border-color:var(--acc)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{font-weight:600;background:var(--surf);border:1px solid var(--line);border-radius:14px;height:58px;font-family:var(--digits);font-size:26px;color:var(--ink)}
.key:active{background:var(--line)}
.key.fn{font-family:var(--body);font-size:15px;font-weight:700}
.key.pass{color:var(--muted)}
.waiting{text-align:center;color:var(--muted);font-size:14px;min-height:1.7em}
/* reveal */
.year{font-family:var(--digits);font-weight:800;font-variant-numeric:tabular-nums;font-size:56px;line-height:1;color:var(--brand);letter-spacing:.02em}
.year small{font-size:16px;margin-left:4px;color:var(--card-muted);font-family:var(--body)}
.expl{font-size:14.5px;line-height:1.85;color:var(--card-ink)}
.goro{background:var(--card-soft);border:1px dashed var(--card-line2);border-radius:10px;padding:6px 10px;font-size:14px}
.goro b{color:var(--brand)}
.answers{display:flex;flex-direction:column;gap:6px}
.arow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.arow .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow .v{font-family:var(--digits);font-size:18px}
.mark{font-weight:800;font-size:13px}
.mark.ok{color:var(--ok)} .mark.ng{color:var(--ng)} .mark.near{color:var(--acc-ink)}
/* result */
.banzuke{display:flex;flex-direction:column;gap:8px}
.rank{display:grid;grid-template-columns:3.2em 1fr auto;gap:10px;align-items:center;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.rank .r{font-family:var(--mincho);font-weight:800;color:var(--acc-ink)}
.rank .sc{font-family:var(--digits);font-size:22px;font-weight:700}
.rank .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.miss{display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.miss div{display:grid;grid-template-columns:3.4em 1fr;gap:8px}
.miss b{font-family:var(--digits);font-weight:700;color:var(--acc-ink)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row > *{flex:1 1 140px}
.gap{font-size:12.5px;color:var(--card-muted);margin-top:-2px}
.flow{display:flex;flex-direction:column;gap:6px;margin-top:6px;border-top:1px solid var(--card-line);padding-top:10px}
.fr{font-size:15px;line-height:1.7}
.fr.arrow{padding-left:1.3em;text-indent:-1.3em}
.fr.arrow.dot::before{content:"・";color:var(--card-acc);font-size:1em;font-weight:800}
.fr.arrow.cz::before{content:"→";font-size:1em;font-weight:800;color:var(--card-acc)}
.fr.arrow::before{content:"▶";color:var(--card-acc);font-size:.8em;display:inline-block;width:1.6em;text-indent:0}
.fk{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--brand);border:1px solid var(--card-line2);border-radius:4px;text-align:center;padding:1px 0}
.fv{min-width:0}
.bce{align-self:flex-end;font-size:14px;color:var(--muted);padding-bottom:6px}
.genres{grid-template-columns:repeat(2,1fr)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice{background:var(--surf);border:1.5px solid var(--line);border-radius:14px;min-height:56px;padding:8px;font-size:16px;font-weight:800;line-height:1.35;color:var(--ink)}
.choice.pass{grid-column:1/-1;min-height:44px;color:var(--muted);font-weight:500;background:transparent}
.choice.picked{border-color:var(--acc);box-shadow:inset 0 0 0 1.5px var(--acc)}
.choice:disabled{opacity:.6}
.choice.picked:disabled{opacity:1}
.qtext{display:flex;flex-direction:column;gap:6px;font-size:17px;line-height:1.7;font-weight:600}
.photo{width:100%;aspect-ratio:4/3;object-fit:contain;background:var(--photo);border-radius:12px;max-width:100%;display:block}
.voice{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 0 8px}
.voice .wave{display:flex;gap:4px;align-items:center;height:34px}
.voice .wave i{width:5px;border-radius:3px;background:var(--card-acc);height:8px;opacity:.5}
.voice.playing .wave i{animation:wv 1s ease-in-out infinite;opacity:.9}
.voice .wave i:nth-child(2n){animation-delay:.2s}.voice .wave i:nth-child(3n){animation-delay:.45s}
@keyframes wv{0%,100%{height:8px}50%{height:32px}}
@media (prefers-reduced-motion:reduce){.voice.playing .wave i{animation:none;height:20px}}
.playbtn{background:var(--head);color:var(--onhead);font-weight:800;border-radius:999px;padding:9px 18px;font-size:15px}
.voice .vnote{font-size:12.5px;color:var(--card-muted)}
.credit{font-size:11px;line-height:1.55;color:var(--card-muted);margin-top:6px}
.credit a{color:inherit}
.bname{font-size:34px;font-weight:800;color:var(--brand);line-height:1.2}
.bsub{font-size:13px;color:var(--card-muted)}
.arow .v.vs{font-size:14px;font-family:var(--body);font-weight:700}
.mute{background:transparent;border:1px solid #ffffff44;border-radius:999px;padding:3px 10px;font-size:12px;color:var(--onhead)}
.answers.flipin .arow{animation:aflip .5s ease-out both}
.answers.flipin .arow:nth-child(2){animation-delay:.25s}.answers.flipin .arow:nth-child(3){animation-delay:.5s}.answers.flipin .arow:nth-child(4){animation-delay:.75s}.answers.flipin .arow:nth-child(n+5){animation-delay:1s}
@keyframes aflip{from{transform:perspective(500px) rotateX(-90deg);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.answers.flipin .arow{animation:none}}
.arow .stp{font-size:20px;line-height:1;min-width:1.2em;text-align:center}
.arow .stp.pop{animation:pop .6s ease-out}
@keyframes pop{0%{transform:scale(.2)}60%{transform:scale(1.5)}100%{transform:scale(1)}}
.stamps{display:flex;justify-content:center;gap:8px}
.stamps button{background:var(--surf);border:1px solid var(--line);border-radius:999px;width:48px;height:40px;font-size:20px}
.stamps button:active{background:var(--line)}
.card.big{box-shadow:0 0 0 2px var(--acc),var(--shadow)}
.bigtag{display:inline-block;background:var(--acc);color:var(--onacc);font-size:11.5px;font-weight:800;letter-spacing:.1em;border-radius:5px;padding:1px 8px;margin-right:6px}
.mapbox{position:relative;border-radius:12px;overflow:hidden;background:var(--sea);border:1px solid var(--card-line)}
.mapbox svg{display:block;width:100%;height:auto}
.mapbox .land{fill:var(--land);stroke:var(--landline);stroke-width:.8;vector-effect:non-scaling-stroke}
.mapbox .pin{fill:var(--pin);stroke:#fff;stroke-width:2;vector-effect:non-scaling-stroke}
.mapbox .ring{fill:none;stroke:var(--pin);stroke-width:2;vector-effect:non-scaling-stroke;transform-box:fill-box;transform-origin:center;animation:ring 1.6s ease-out infinite}
@keyframes ring{from{transform:scale(.4);opacity:1}to{transform:scale(2.2);opacity:0}}
@media (prefers-reduced-motion:reduce){.mapbox .ring{animation:none}}
.mapcap{position:absolute;left:8px;bottom:6px;background:var(--capbg);color:var(--capink);font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;max-width:calc(100% - 16px)}
.links{display:flex;flex-direction:column;gap:6px;margin-top:8px;border-top:1px solid var(--card-line);padding-top:10px}
.links .lh{font-size:11.5px;font-weight:800;letter-spacing:.1em;color:var(--brand)}
.chain{display:flex;flex-direction:column;align-items:stretch;gap:0}
.node{border:1px solid var(--card-line2);background:var(--card-soft);border-radius:10px;padding:5px 10px;font-size:13.5px;line-height:1.45}
.node b{font-weight:800;color:var(--brand);margin-right:6px;font-variant-numeric:tabular-nums}
.node.me{background:var(--head);color:var(--onhead);border-color:var(--head)}
.node.me b{color:var(--acc)}
.node .soon{font-size:10.5px;color:var(--card-muted);border:1px solid var(--card-line2);border-radius:4px;padding:0 4px;margin-left:6px;white-space:nowrap}
.edge{font-size:12px;color:var(--card-muted);padding:3px 0 3px 22px;position:relative}
.edge::before{content:"";position:absolute;left:12px;top:0;bottom:0;border-left:2px solid var(--card-line2)}
.edge::after{content:"▼";position:absolute;left:7.5px;bottom:-4px;font-size:9px;color:var(--card-line2)}
.terrain{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-top:4px}
.terrain div{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10.5px;color:var(--card-muted);opacity:.55;border-radius:8px;padding:4px 0 3px}
.terrain svg{width:26px;height:20px}
.terrain .on{background:var(--soft-acc);color:var(--card-acc);font-weight:800;opacity:1}
.terrain svg *{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.vtabs{display:flex;gap:4px;margin-bottom:-2px}
.vtabs button{font-size:12px;font-weight:700;padding:3px 12px;border-radius:999px;background:transparent;border:1px solid var(--card-line2);color:var(--card-muted)}
.vtabs button[aria-pressed="true"]{background:var(--head);border-color:var(--head);color:var(--onhead)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.galitem{position:relative;padding:0;border:2px solid transparent;border-radius:10px;overflow:hidden;background:var(--photo);aspect-ratio:1/1;cursor:pointer}
.galitem.on{border-color:var(--card-acc)}
.galitem img{width:100%;height:100%;object-fit:cover;display:block}
.galitem span{position:absolute;left:0;right:0;bottom:0;background:var(--capbg);color:var(--capink);font-size:11px;line-height:1.5;padding:1px 2px;text-align:center}
.docimg{margin:0;display:flex;flex-direction:column;gap:3px}
.docimg img{width:100%;max-height:260px;object-fit:contain;background:var(--photo);border-radius:12px;display:block}
.docimg figcaption{font-size:12.5px;color:var(--card-muted)}
.rules{margin:0;padding-left:1.2em;color:var(--muted);line-height:1.8}
.habnote{font-size:13.5px;line-height:1.6}
.hard{display:flex;flex-direction:column;gap:4px;font-size:13.5px}
[hidden]{display:none!important}
</style>

<div class="app" id="app">

  <!-- ロビー -->
  <section id="lobby" style="display:flex;flex-direction:column;gap:14px">
    <h1>激<span class="tilt">突</span>！<span>暗記</span>大戦<small>年号も鳥も木も、みんなで覚える</small></h1>
    <ul class="rules">
      <li>歴史は年号、鳥と木は名前を当てる</li>
      <li>1問10秒。全員答えたら答え合わせ</li>
      <li>正解で1点。早押しの差はなし</li>
    </ul>

    <div class="invite" id="invite" hidden>
      <span id="inviteText"></span>
      <button id="joinBtn" type="button">参加する</button>
    </div>

    <div class="panel">
      <label for="nick">あなたの名前
        <input id="nick" maxlength="12" placeholder="例：本能寺の火元" autocomplete="off">
      </label>
      <div style="display:flex;flex-direction:column;gap:6px">
        <span class="small muted">ジャンル</span>
        <div class="levels genres" id="genres"></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px" id="modesBox">
        <span class="small muted" id="modesLabel">出題範囲</span>
        <div class="levels" id="modes"></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <span class="small muted">難易度（出題数）</span>
        <div class="levels" id="levels"></div>
        <p class="small muted" id="rangeNote"></p>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <span class="small muted">配色</span>
        <div class="levels genres" id="tones"></div>
      </div>
      <button class="btn" id="startBtn" type="button">対戦をはじめる</button>
    </div>

    <div class="panel">
      <span class="small muted">いまこのページを開いている人</span>
      <div class="players" id="lobbyPlayers"></div>
      <p class="small muted" id="roomNote">接続を確認しています…</p>
    </div>
  </section>

  <!-- 出題 -->
  <section id="game" hidden style="display:flex;flex-direction:column;gap:12px">
    <div class="bar"><span class="prog" id="prog"></span><span id="eraRange"></span><button class="mute" id="muteBtn" type="button" aria-pressed="true">音：オン</button><button class="mute" id="quitBtn" type="button">やめる</button></div>
    <div class="players" id="gamePlayers"></div>
    <div class="timer"><i id="timerBar"></i></div>
    <div class="card" id="card">
      <span class="era" id="cEra"></span>
      <span class="ev" id="cEv"></span>
      <span class="en" id="cEn"></span>
    </div>

    <div id="askArea" style="display:flex;flex-direction:column;gap:12px">
      <div class="slots" id="slots"></div>
      <div class="waiting" id="waitAsk"></div>
      <div class="keypad" id="keypad"></div>

const VOICE_BUF=new Map(); let voiceSrc=null, voiceEl=null;
function loadVoice(url){
  if(VOICE_BUF.has(url)) return VOICE_BUF.get(url);
  const p=fetch(url).then(r=>{ if(!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
    .then(ab=>{ const a=ac(); if(!a) throw new Error("noaudio"); return new Promise((ok,ng)=>a.decodeAudioData(ab,ok,ng)); });
  p.catch(()=>VOICE_BUF.delete(url)); VOICE_BUF.set(url,p); return p;
}
function setPlaying(on){ const v=document.getElementById("voiceBox"); if(v) v.classList.toggle("playing",on); }
function stopVoice(){ try{ if(voiceSrc) voiceSrc.stop(); }catch(e){} voiceSrc=null; if(voiceEl){ voiceEl.pause(); voiceEl=null; } setPlaying(false); }
function playVoice(c,manual){
  if(!c.m.snd || (muted && !manual)) return;
  const url=c.m.snd[0], qi=S.qi; stopVoice();
  loadVoice(url).then(buf=>{ if(S.qi!==qi||S.view!=="game") return; const a=ac(); stopVoice();
    const src=a.createBufferSource(), g=a.createGain(); g.gain.value=0.9; src.buffer=buf; src.connect(g).connect(a.destination);
    src.onended=()=>{ if(voiceSrc===src){ voiceSrc=null; setPlaying(false);} }; src.start(); voiceSrc=src; setPlaying(true);
  }).catch(()=>{ // Web Audioが使えない端末は audio 要素で
    if(S.qi!==qi) return; const au=new Audio(url); voiceEl=au; au.onended=()=>setPlaying(false); au.play().then(()=>setPlaying(true)).catch(()=>{});
  });
}

function startGame(gid, genre, mode, lv, qi, bmode, custom){
  S.gid=gid; S.genre=genre; S.mode=mode; S.lv=lv; if(bmode) S.bmode=bmode; S.custom=(Array.isArray(custom)&&custom.length)?custom:null;
  S.deck=deckFor(mode,lv,genre,gid,S.bmode,S.custom); S.hist=""; S.stamp=null; if(!S.deck.length){ S.custom=null; S.deck=deckFor(mode,lv,genre,gid,S.bmode); } S.qi=Math.min(qi||0,S.deck.length-1); S.score=0; S.log=[]; S.ready=-1; S.hist="-".repeat(S.qi);
  S.view="game"; show("game"); beginAsk();
}
function beginAsk(){
  S.phase="ask"; S.input=""; S.ans=null; S.askStart=Date.now(); S.stamp=null; stopVoice(); se("flip");
  const c=S.deck[S.qi];
  const card=$("card"); card.querySelectorAll(".reveal-x,.q-x").forEach(n=>n.remove());
  if(c.kind==="choice"){
    $("cEra").textContent=c.hk? "北海道の鳥・"+(c.season==="一年中"?"一年中見られる":c.season+"に見られる") : c.tree? "関東の木・"+(c.season==="一年中"?"一年中みどり":"見ごろは"+c.season) : "関東の鳥・"+(c.season==="一年中"?"一年中見られる":c.season+"に見られる");
    $("cEv").textContent=""; $("cEn").textContent="";
    if(c.q==="V"){
      const v=el("div","voice q-x"); v.id="voiceBox"; const w=el("div","wave"); for(let i=0;i<9;i++) w.append(el("i"));
      const b=el("button","playbtn","もう一度聞く"); b.type="button"; b.onclick=()=>playVoice(c,true);
      v.append(w,b,el("p","vnote","この声はどの鳥？")); card.insertBefore(v,$("cEv"));
      playVoice(c,false);
    } else {
      const im=document.createElement("img"); im.className="photo q-x"; im.src=imgOf(c)[0]; im.alt=c.tree?"この木はどれ？":"この鳥はどれ？"; card.insertBefore(im,$("cEv"));
    }
    preloadNext();
    S.choices=choicesFor(S.deck,S.qi,S.gid);
  } else {
    $("cEra").textContent=tagOf(c);
    $("cEv").textContent=c.name; $("cEn").textContent=c.en;
  }
  const big=isBig(); card.classList.toggle("big",big);
  if(big){ const t=el("span","bigtag","大一番・得点2倍"); $("cEra").prepend(t); }
  card.classList.remove("flip"); void card.offsetWidth; card.classList.add("flip");
  $("prog").textContent=`${S.qi+1} / ${S.deck.length}`;
  $("eraRange").textContent=`${genreLabel(S.genre,S.mode,S.bmode)}・${lvName(S.lv,S.genre)}`;
  const isC=c.kind==="choice"; $("slots").hidden=isC; $("keypad").hidden=isC; $("choices").hidden=!isC;
  if(isC) renderChoices();
  $("askArea").hidden=false; $("revealArea").hidden=true; $("waitAsk").textContent="";
  renderSlots(); renderGamePlayers(); push();
}
function renderChoices(){
  const box=$("choices"); box.textContent="";
  S.choices.forEach(n=>{const b=el("button","choice",n); b.type="button";
    if(S.ans){ b.disabled=true; if(S.ans.v===n) b.classList.add("picked"); }
    b.onclick=()=>{ if(S.view==="game"&&S.phase==="ask"&&!S.ans){ answer(n); renderChoices(); } }; box.append(b);});
  const p=el("button","choice pass","パス"); p.type="button"; p.disabled=!!S.ans; p.onclick=()=>{ if(!S.ans){answer(null); renderChoices();} }; box.append(p);
}
function renderSlots(){
  const c=S.deck[S.qi]; if(c.kind!=="year") return; const len=String(Math.abs(c.y)).length; const box=$("slots"); box.textContent="";
  if(c.y<0){const b=document.createElement("span");b.className="bce";b.textContent="紀元前";box.append(b);}
  for(let i=0;i<len;i++){const d=document.createElement("div");d.className="slot"+(i===S.input.length?" cur":"");d.textContent=S.input[i]||"";box.append(d);}
  const y=document.createElement("span");y.className="bce";y.textContent="年";box.append(y);
}
function press(k){
  if(S.view!=="game"||S.phase!=="ask"||S.ans) return;
  if(S.deck[S.qi].kind!=="year"){ if(k==="pass") answer(null); return; }
  const len=String(Math.abs(S.deck[S.qi].y)).length;
  if(k==="del"){S.input=S.input.slice(0,-1);renderSlots();return;}
  if(k==="pass"){answer(null);return;}
  if(S.input.length>=len) return;
  S.input+=k; renderSlots();
  if(S.input.length===len) setTimeout(()=>answer(S.input),180);
}
function isBig(){ return S.deck.length>=6 && S.qi>=S.deck.length-3; }
function answer(v){
  if(S.ans) return;
  const c=S.deck[S.qi];
  const ok = v!=null && (c.kind==="choice" ? v===c.name : Number(v)===Math.abs(c.y));
  const near = !ok && v!=null && c.kind==="year" && Math.abs(Number(v)-Math.abs(c.y))<=3;
  const pt=(ok?1:near?0.5:0)*(isBig()?2:1);
  S.ans={q:S.qi, v:v==null?"":String(v), ok, pt};
  S.score+=pt; S.hist+=ok?"1":near?"h":"0";
  S.log.push({c, ok, pt});
  $("waitAsk").textContent="ほかの人の回答を待っています…";
  push(); check();
}
function allAnswered(){
  return gamePeers().every(pr=> (pr.ans && pr.ans.q===S.qi) || (typeof pr.qi==="number" && pr.qi>S.qi));
}
function el(tag, cls, text){const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e;}
function reveal(){
  if(!S.ans) answer(null);
  S.phase="reveal"; S.revealAt=Date.now();
  se(S.ans&&S.ans.ok?"ok":"ng");
  const c=S.deck[S.qi], prev=S.qi>0?S.deck[S.qi-1]:null;
  const card=$("card");
  if(c.kind==="choice"){
    if(c.q==="V" && c.m.img){ const im=document.createElement("img"); im.className="photo reveal-x"; im.src=imgOf(c)[0]; im.alt=c.name; card.insertBefore(im,$("cEv")); }
    if(c.m.snd){ stopVoice(); card.querySelectorAll("#voiceBox").forEach(n=>n.remove());
      const v=el("div","voice reveal-x"); v.id="voiceBox"; const w=el("div","wave"); for(let i=0;i<9;i++) w.append(el("i"));
      const b=el("button","playbtn","もう一度聞く"); b.type="button"; b.onclick=()=>playVoice(c,true); v.append(w,b);
      card.insertBefore(v,$("cEv")); const qi=S.qi; setTimeout(()=>{ if(S.qi===qi&&S.phase==="reveal") playVoice(c,false); },700); }
    const nm=el("div","bname reveal-x",c.name); card.insertBefore(nm,$("cEv"));
    card.insertBefore(el("p","bsub reveal-x",`${c.en}　${c.sci}`),$("cEv"));
    if(c.m.imgs&&c.m.imgs.length>1){ const gal=el("div","gal reveal-x"); const main=card.querySelector(".photo");
      c.m.imgs.forEach((g,k)=>{ const f=el("button","galitem"+(k===(c.pi||0)?" on":"")); f.type="button"; const im=document.createElement("img"); im.src=g[0]; im.alt=g[4]||""; im.loading="lazy"; f.append(im, el("span",null,g[4]||""));
        f.onclick=()=>{ if(main) main.src=g[0]; gal.querySelectorAll(".galitem").forEach(n=>n.classList.toggle("on",n===f)); }; gal.append(f); });
      card.insertBefore(gal,$("cEv")); }
    card.querySelectorAll(".qtext").forEach(n=>n.remove());
    const flow=el("div","flow reveal-x");
    [c.f1,c.f2,c.f3].forEach((v,i)=>{const r=el("div","fr arrow dot"); r.textContent=v+"。"; flow.append(r);});
    card.append(flow); card.append(habitatFor(c)); card.append(creditFor(c));
    $("askArea").hidden=true; $("revealArea").hidden=false; $("waitAsk").textContent="";
    renderAnswers(); push(); return;
  }
  const yr=el("div","year reveal-x", yearText(c.y)); yr.append(el("small",null,"年"));
  card.insertBefore(yr, $("cEv"));
  if(prev){
    const gap=c.y-prev.y;
    card.insertBefore(el("p","gap reveal-x", gap===0?`前の札「${prev.name}」と同じ年`:`前の札「${prev.name}」から ${gap}年後`), $("cEv"));
  }
  const flow=el("div","flow reveal-x");
  [c.why,c.what,c.then].filter(Boolean).forEach((v,i)=>{ const r=el("div","fr"+(i?" arrow cz":"")); r.textContent=v+"。"; flow.append(r); });
  card.append(flow);
  if(c.goro){const g=el("p","goro reveal-x"); g.append(el("b",null,"語呂 "), document.createTextNode(c.goro)); card.append(g);}
  const lk=linksFor(c); if(lk) card.append(lk);
  const mp=mapFor(c), im=docFor(c);
  if(mp&&im){ const tabs=el("div","vtabs reveal-x"); const views=[["地図",mp],["資料",im]]; im.hidden=true;
    views.forEach(([n,v],i)=>{ const b=el("button",null,n); b.type="button"; b.setAttribute("aria-pressed",String(i===0));
      b.onclick=()=>{ views.forEach(([,w],j)=>{ w.hidden=j!==i; tabs.children[j].setAttribute("aria-pressed",String(j===i)); }); }; tabs.append(b); });
    card.insertBefore(tabs,yr); card.insertBefore(mp,yr); card.insertBefore(im,yr); }
  else if(mp||im) card.insertBefore(mp||im, yr);
  if(c.doc){ const cr=el("p","credit reveal-x"); cr.append(`資料：${c.doc[1]}／${c.doc[2]}／`); const a=document.createElement("a"); a.href=c.doc[3]; a.target="_blank"; a.rel="noopener"; a.textContent="Wikimedia Commons"; cr.append(a); card.append(cr); }
  $("askArea").hidden=true; $("revealArea").hidden=false; $("waitAsk").textContent="";
  renderAnswers(); push();
}
function markFor(a, y){
  if(!a || a.v==="") return ["パス","ng"];
  if(a.ok) return ["正解","ok"];
  if(typeof y!=="number") return ["はずれ","ng"];
  if(Math.abs(Number(a.v)-Math.abs(y))<=3) return ["惜しい","near"];
  return ["はずれ","ng"];
}
let ansSig="", flipQ=-1; const seenStamp={};
function stampOf(st){ return st&&st.q===S.qi&&typeof st.e==="string"&&STAMPS.includes(st.e)?st:null; }
function renderAnswers(){
  const cc=S.deck[S.qi]; const y=cc.kind==="year"?cc.y:null; const box=$("answers");
  const rows=[{name:(S.name||"名無し")+"（あなた）", ans:S.ans, st:stampOf(S.stamp)}];
  gamePeers().forEach(pr=>{const has=pr.ans&&pr.ans.q===S.qi; rows.push({name:safeName(pr), ans:has?pr.ans:null, wait:!has&&!(pr.qi>S.qi), st:stampOf(pr.stamp)});});
  const sig=S.qi+JSON.stringify(rows); if(sig===ansSig) return; ansSig=sig;
  box.textContent=""; box.classList.toggle("flipin", flipQ!==S.qi); 
  if(flipQ!==S.qi){ flipQ=S.qi; setTimeout(()=>box.classList.remove("flipin"),1600); }
  rows.forEach((r,i)=>{
    const d=el("div","arow"); d.style.gridTemplateColumns="1fr auto auto auto";
    const [t,cl]=r.wait?["時間切れ","ng"]:markFor(r.ans,y);
    const pt=r.ans&&typeof r.ans.pt==="number"&&r.ans.pt>0?` +${fmt(r.ans.pt)}`:"";
    const sp=el("span","stp",r.st?r.st.e:"");
    const id=r.name+":"+S.qi; if(r.st && seenStamp[id]!==r.st.n){ seenStamp[id]=r.st.n; sp.classList.add("pop"); }
    d.append(el("span","nm",r.name), sp, el("span","v"+(y==null?" vs":""),r.ans&&r.ans.v?r.ans.v:"—"), el("span","mark "+cl,t+pt));
    box.append(d);
  });
}
const STAMPS=["👏","😱","🤣","🔥","🤔"];
function buildStamps(){ const box=$("stamps"); STAMPS.forEach(e=>{ const b=el("button",null,e); b.type="button"; b.setAttribute("aria-label","スタンプ "+e);
  b.onclick=()=>{ if(S.phase!=="reveal") return; S.stampN++; S.stamp={q:S.qi,e,n:S.stampN}; push(); renderAnswers(); }; box.append(b); }); }
function next(){
  if(S.phase!=="reveal") return;
  S.ready=S.qi; $("nextBtn").disabled=true; $("waitNext").textContent="ほかの人を待っています…"; push(); check();
}
function allReady(){
  return gamePeers().every(pr=> (typeof pr.ready==="number" && pr.ready>=S.qi) || (typeof pr.qi==="number" && pr.qi>S.qi) || pr.view==="result");
}
function advance(){
  $("nextBtn").disabled=false; $("waitNext").textContent="";
  if(S.qi+1>=S.deck.length){ finish(); return; }
  S.qi++; beginAsk();
}
function finish(){ stopVoice(); S.view="result"; S.phase="done"; show("result"); push(); renderResult(); }
function renderResult(){
  const rows=[{name:(S.name||"名無し")+"（あなた）",score:S.score}];
  others().filter(p=>p.presence.gid===S.gid).forEach(p=>rows.push({name:safeName(p.presence),score:Number(p.presence.score)||0}));
  rows.sort((a,b)=>b.score-a.score);
  const titles=["横綱","大関","関脇","小結","前頭"];
  const box=$("banzuke"); box.textContent="";
  rows.forEach((r,i)=>{
    const d=el("div","rank");
    d.append(el("span","r",titles[Math.min(i,4)]), el("span","nm",r.name), el("span","sc",fmt(r.score)+"/"+(S.deck.length+Math.min(3,S.deck.length>=6?3:0))));
    box.append(d);
  });
  const ml=$("missList"); ml.textContent="";
  const miss=S.log.filter(l=>!l.ok);
  $("revengeBtn").hidden=!miss.length;
  const peers=others().filter(p=>p.presence.gid===S.gid).map(p=>p.presence).filter(pr=>typeof pr.hist==="string");
  const hard=peers.length? S.deck.filter((c,i)=>S.hist[i]!=="1" && peers.every(pr=>pr.hist[i]!=="1") && i<S.hist.length) : [];
  $("hardBox").hidden=!hard.length; const hl=$("hardList"); hl.textContent="";
  hard.forEach(c=>{ const d=el("div"); d.append(el("b",null,c.kind==="year"?yearText(c.y)+"　":""), document.createTextNode(c.name)); hl.append(d); });
  if(!miss.length){ml.append(el("p",null,"全問正解です。お見事。"));}
  miss.forEach(l=>{const d=el("div"); if(l.c.kind==="choice") d.append(el("b",null,l.c.name), el("span",null,l.c.f2)); else d.append(el("b",null,yearText(l.c.y)), el("span",null,l.c.name)); ml.append(d);});
}
function renderGamePlayers(){
  const box=$("gamePlayers"); box.textContent="";
  box.append(chip(S.name||"名無し",{me:true,score:fmt(S.score),st:S.phase==="ask"?(S.ans?"回答済":"考え中"):"",stOk:!!S.ans}));
  gamePeers().forEach(pr=>{
    const answered=pr.ans&&pr.ans.q===S.qi;
    const st=S.phase==="ask"?(answered||pr.qi>S.qi?"回答済":"考え中"):((pr.ready>=S.qi||pr.qi>S.qi)?"次へOK":"読んでいる");
    box.append(chip(safeName(pr),{score:fmt(Number(pr.score)||0),st,stOk:st==="回答済"||st==="次へOK"}));
  });
}
function check(){
  if(S.view==="lobby"){ renderLobby(); return; }
  if(S.view==="result"){ renderResult(); return; }
  const now=Date.now();
  if(S.phase==="ask"){
    const left=Math.max(0,ASK_MS-(now-S.askStart));
    $("timerBar").style.transform=`scaleX(${left/ASK_MS})`;
    if(left<=0 || (S.ans && allAnswered())) reveal();
  } else if(S.phase==="reveal"){
    $("timerBar").style.transform="scaleX(0)";
    renderAnswers();
    if(S.ready>=S.qi && (allReady() || now-S.revealAt>NEXT_MAX_MS)) advance();
  }
  renderGamePlayers();
}

    b.textContent=k==="pass"?"パス":k==="del"?"消す":k; b.onclick=()=>press(k); box.append(b);
  });
}

// 公開版: Supabase Realtime の presence で同じ部屋の人をつなぐ（DBの表は使わない）
function sbRoom(cfg){
  const sb=window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:false,autoRefreshToken:false}});
  const me=Math.random().toString(36).slice(2,10); let list=[], cbs=[], errCb=null, ready=false, pending=null, timer=null, lastSent=0;
  const ch=sb.channel("anki-taisen:"+cfg.room,{config:{presence:{key:me}}});
  ch.on("presence",{event:"sync"},()=>{ const st=ch.presenceState();
    list=Object.entries(st).filter(([k])=>k!==me).map(([k,arr])=>({sameTab:false,kind:"viewer",presence:(arr[arr.length-1]||{}).p}));
    cbs.forEach(f=>{try{f()}catch(e){}}); });
  const flush=()=>{ timer=null; if(!ready||!pending) return; lastSent=Date.now(); const p=pending; pending=null; ch.track({p}).catch(()=>{}); };
  const api={
    presence(p){ pending=p; if(!timer){ const wait=Math.max(0,200-(Date.now()-lastSent)); timer=setTimeout(flush,wait); } return Promise.resolve(); },
    peers(){ return list; },
    onPeers(f,e){ cbs.push(f); errCb=e; }
  };
  return new Promise(res=>{ let done=false; ch.subscribe(st=>{
    if(st==="SUBSCRIBED"){ ready=true; if(pending) flush(); if(!done){done=true;res(api);} }
    else if(st==="CHANNEL_ERROR"||st==="TIMED_OUT"||st==="CLOSED"){ if(!done){done=true;res(null);} else if(errCb) errCb(); }
  }); setTimeout(()=>{ if(!done){done=true;res(null);} },10000); });
}

(async()=>{
  try{ room = window.claude && window.claude.use ? await window.claude.use("room") : (window.ANKI_SB ? await sbRoom(window.ANKI_SB) : null); }catch(e){ room=null; }
  if(!room){ $("roomNote").textContent="いまは一人で遊べます。友人と対戦するには、このページを友人と共有して同時に開いてください。"; return; }
  $("roomNote").textContent="同じページを開いた友人がここに並びます。誰かが「対戦をはじめる」を押すと、ほかの人に参加ボタンが出ます。";
  room.onPeers(()=>check(), ()=>{ $("roomNote").textContent="接続できませんでした。一人で遊べます。"; room=null; });
  push();
})();
