<script src="https://unpkg.com/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script>
<script>
// 対戦のつなぎ役: Supabase Realtime presence（表は使わない）。publishable key は公開してよい値。
// 部屋番号は必ずある（2026-11-05 Keita決定）。?room= が無ければ開くたびにランダムな6桁を割り振り、URLに書き込む。
// 同じ部屋番号のURLを開いた人どうしが同じ部屋。部屋のURLはロビーの「この部屋のURLをシェア」で送る。
window.ANKI_SB={url:"https://rjydvhpqfhmlvpsykwzf.supabase.co",key:"sb_publishable_NAVKQxtEtS1zPFj59iXIEQ_Y_RztuSx",
  room:(function(){var q=new URLSearchParams(location.search),r=(q.get("room")||"").replace(/[^\w-]/g,"").slice(0,32);
    if(!r){r=String(100000+Math.floor(Math.random()*900000));q.set("room",r);try{history.replaceState(null,"",location.pathname+"?"+q.toString()+location.hash);}catch(e){}}
    return r;})()};
document.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest("[data-share-room]");if(!b)return;
  var url=location.origin+location.pathname+"?room="+window.ANKI_SB.room;
  if(navigator.share){navigator.share({title:"激突！暗記大戦",text:"部屋No."+window.ANKI_SB.room+" で対戦しよう",url:url}).catch(function(){});}
  else if(navigator.clipboard){navigator.clipboard.writeText(url).then(function(){b.textContent="コピーしました";setTimeout(function(){b.textContent="この部屋のURLをシェア";},2000);});}});
document.addEventListener("DOMContentLoaded",function(){var n=document.getElementById("roomNo");if(n)n.textContent=window.ANKI_SB.room;});
</script>
