*{box-sizing:border-box}
html,body{margin:0;background:var(--pg);color:var(--ink);font-family:var(--font);line-height:1.6;-webkit-text-size-adjust:100%}
main{max-width:680px;margin:0 auto;padding:16px 16px 48px}
h1{font-weight:400;font-size:26px;color:var(--head);margin:8px 0 2px}
h2{font-weight:400;font-size:18px;color:var(--head);margin:0 0 8px}
p{margin:0 0 10px}
.muted{color:var(--muted);font-size:14px}
.card{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:14px;margin:0 0 12px}
button{font-family:var(--font);font-size:16px;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;touch-action:manipulation}
button:active{transform:translateY(1px)}
button:disabled{opacity:.45;cursor:default}
button.pri{background:var(--acc);border-color:var(--acc);color:var(--selink)}
button.sel{background:var(--sel);border-color:var(--sel);color:var(--selink)}
button.on{border-color:var(--acc);color:var(--acc)}
button.small{font-size:14px;padding:4px 10px}
button.wide{width:100%;padding:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.back{border:none;background:none;color:var(--muted);padding:4px 0;font-size:14px}
.objs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.obj{text-align:left;padding:10px;font-size:15px;line-height:1.35}
.obj small{display:block;color:var(--muted);font-size:12px}
.obj.sel small{color:inherit;opacity:.8}
.doc{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0;font-size:16px;white-space:pre-wrap}
.ja{color:var(--muted);font-size:14px;margin-top:6px;white-space:pre-wrap}
.w{border-bottom:1px dotted var(--muted);cursor:pointer}
.wbox{font-size:14px;color:var(--head);min-height:20px}
.lockrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.dig{font-size:22px;letter-spacing:6px;min-width:120px;text-align:center;padding:6px 10px;border:2px solid var(--line);border-radius:8px;background:var(--soft)}
.keys{display:grid;grid-template-columns:repeat(3,56px);gap:6px}
.keys button{padding:8px 0}
.panel{display:grid;gap:10px}
.lamp{display:inline-block;width:16px;height:16px;border-radius:50%;background:#555;vertical-align:-3px;margin-right:6px;border:2px solid var(--line)}
.lamp.on{background:#5fd46a}
.msg{font-size:14px;color:var(--head);margin-top:6px}
.res-ok{color:var(--ok)}
.res-ng{color:var(--ng)}
.notes{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--paper);margin-bottom:8px}
.note{padding:4px 0;border-bottom:1px dashed var(--line);font-size:15px}
.note:last-child{border-bottom:none}
.note .who{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chips button{font-size:13px;padding:3px 8px}
input[type=text]{width:100%;font-family:var(--font);font-size:16px;padding:10px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.stat{font-size:13px;color:var(--muted)}
.prog{font-size:14px;color:var(--muted)}
.big{font-size:30px;color:var(--head)}
.clock{display:block;margin:6px auto}
.npc{background:var(--soft);border-radius:10px;padding:8px 10px;margin:8px 0;min-height:40px}

let VOICES=[];
function loadVoices(){if(!window.speechSynthesis)return;VOICES=speechSynthesis.getVoices().filter(v=>/^en[-_]US/i.test(v.lang));if(!VOICES.length)VOICES=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang))}
if(window.speechSynthesis){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function speak(text,opt={}){return new Promise(res=>{
  if(!window.speechSynthesis){res();return}
  try{speechSynthesis.cancel()}catch(e){}
  const u=new SpeechSynthesisUtterance(text);u.lang="en-US";
  if(VOICES.length)u.voice=VOICES[(opt.voice||0)%VOICES.length];
  u.rate=opt.rate||.9;u.pitch=opt.pitch||1;
  let done=false;const fin=()=>{if(!done){done=true;res()}};
  u.onend=fin;u.onerror=fin;setTimeout(fin,6000+text.length*110);
  try{speechSynthesis.speak(u)}catch(e){fin()}
})}

const me=lsGet("eigo-escape-me")||rid();lsSet("eigo-escape-me",me);
let MODE=null,ROOM=null,G=null,L=null,ch=null,sbc=null,PEERS={},online=false;
function newG(){return{solved:{},notes:[],jp:{},hints:{},start:0,end:0,vm2:0}}
function gKey(){return "eigo-escape:"+(MODE==="solo"?"solo":ROOM)}
function saveAll(){lsSet(gKey(),{G,L})}
function sum(o){return Object.values(o||{}).reduce((a,b)=>a+b,0)}
function merge(o){
  if(!o)return;
  Object.keys(o.solved||{}).forEach(k=>{if(o.solved[k])G.solved[k]=1});
  const ids=new Set(G.notes.map(n=>n.id));(o.notes||[]).forEach(n=>{if(n&&n.id&&!ids.has(n.id)&&typeof n.text==="string")G.notes.push({id:n.id,from:n.from,text:String(n.text).slice(0,300),t:n.t})});
  G.notes.sort((a,b)=>a.t-b.t);
  ["jp","hints"].forEach(k=>Object.keys(o[k]||{}).forEach(p=>{G[k][p]=Math.max(G[k][p]||0,+o[k][p]||0)}));
  if(o.start&&(!G.start||o.start<G.start))G.start=o.start;
  if(o.end&&(!G.end||o.end<G.end))G.end=o.end;
  if(o.vm2)G.vm2=1;
}
function push(ask){saveAll();if(ch&&online)ch.send({type:"broadcast",event:"st",payload:{g:G,ask:!!ask}}).catch(()=>{})}
function connect(){
  if(!window.supabase){return}
  sbc=window.supabase.createClient(SB.url,SB.key);
  ch=sbc.channel("eigo-escape:"+ROOM,{config:{presence:{key:me},broadcast:{self:false}}});
  ch.on("broadcast",{event:"st"},m=>{const d=m&&m.payload;if(!d)return;const before=JSON.stringify(G);merge(d.g);saveAll();if(d.ask)push(false);if(JSON.stringify(G)!==before)render()});
  ch.on("presence",{event:"sync"},()=>{const st=ch.presenceState();PEERS={};Object.keys(st).forEach(k=>{if(k!==me)PEERS[k]=(st[k][0]||{}).role||""});render()});

function startDuo(room){
  MODE="duo";ROOM=room;
  const q=new URLSearchParams(location.search);q.set("room",room);history.replaceState(null,"",location.pathname+"?"+q.toString());
  const s=lsGet(gKey());G=s&&s.G?s.G:newG();L=s&&s.L?s.L:{role:null,view:null,panel:null,word:""};
  if(!L.panel)L.panel={dial:"3",sw:"DOWN",green:false,msg:""};
  if(L.role&&!G.start)G.start=Date.now();

}
function startSolo(){
  MODE="solo";ROOM=null;

let quitAt=0;function armQuit(){if(Date.now()-quitAt<3000)return true;quitAt=Date.now();$("#bk").textContent="‹ もう一度押すとやめる";return false}
function badge(R,id){
  if(R==="A"&&id==="phone"&&G.solved.p3&&!G.vm2)return " ・新着";

}
function hintLevel(p){L.hint=L.hint||{};return L.hint[p]||0}
function showHint(){
  const p=curPuzzle();if(!p)return;
  L.hint=L.hint||{};const lv=Math.min(3,(L.hint[p]||0)+1);
  if(lv>(L.hint[p]||0)){L.hint[p]=lv;G.hints[me]=(G.hints[me]||0)+1;push(false)}
  const H=HINTS[p][L.role];
  $("#hintbox").innerHTML=`<div class="card">${H.slice(0,lv).map((h,i)=>`<p>${i<2?tw(h):esc(h)}</p>`).join("")}<div class="wbox" id="hw"></div>${lv<3?`<button class="small" id="more">もっとヒント（${lv+1}/3）</button>`:""}</div>`;

function docHTML(t,jaId){return `<div class="doc">${tw(t.en)}</div><div class="wbox" id="wb"></div><button class="small" data-ja="${jaId}">訳</button><div class="ja" id="${jaId}" hidden>${esc(t.ja)}</div>`}
function bindDoc(root){bindWords(root,"#wb");root.querySelectorAll("[data-ja]").forEach(b=>b.onclick=()=>{const j=$("#"+b.dataset.ja);j.hidden=!j.hidden;b.classList.toggle("on",!j.hidden)})}

  }else if(R==="B"&&id==="closet"){

function lockDigits(name,n){return `<div class="lockrow"><span class="dig" id="${name}-d">${"_".repeat(n)}</span></div><div class="keys">${[1,2,3,4,5,6,7,8,9].map(k=>`<button data-k="${k}" data-lock="${name}">${k}</button>`).join("")}<button data-k="C" data-lock="${name}">C</button><button data-k="0" data-lock="${name}">0</button><button data-k="E" data-lock="${name}" class="pri">OK</button></div><div class="msg" id="${name}-m"></div>`}
function lockColors(){const c=L.colors||[null,null,null];return `${[0,1,2].map(i=>`<div class="lab muted">${i+1}つ目</div><div class="chips">${COLORS.map(k=>`<button data-col="${i}" data-v="${k}" class="${c[i]===k?"sel":""}">${k}</button>`).join("")}</div>`).join("")}<button class="pri" id="tryc" style="margin-top:8px">開ける</button><div class="msg" id="col-m"></div>`}
function panelHTML(){
  const P=L.panel;const pow=G.solved.p3;
  if(pow)return `<div class="card" style="margin-top:8px"><p class="res-ok">ブレーカー盤：電源は復旧している。</p></div>`;
  return `<div class="card panel" style="margin-top:8px"><h2>breaker panel</h2>

}
// ブレーカー盤の動き（2人でもひとりでも同じ）
function panelAct(a,v){
  const P=L.panel;let out={en:"",ja:""};
  const reset=(en,ja)=>{P.dial="3";P.sw="DOWN";P.green=false;out={en:en+" BEEP! The breaker trips. Everything goes back to the start.",ja:ja+" ピーッ！ブレーカーが落ちて、全部最初に戻った。"}};
  if(a==="dial"){P.dial=v;out={en:`The dial is on ${v}.`,ja:`ダイヤルは ${v}。`}}
  else if(a==="sw"){
    if(P.sw==="UP"){P.sw="DOWN";P.green=false;out={en:"The main switch is down.",ja:"メインスイッチを下げた。"}}
    else if(P.dial==="OFF"){P.sw="UP";P.green=true;out={en:"The main switch is up. The green light comes on.",ja:"メインスイッチを上げた。緑のランプが点いた。"}}
    else reset("The dial was not on OFF.","ダイヤルがOFFになっていなかった。");
  }else if(a==="red"){
    if(P.green&&P.dial==="2"){G.solved.p3=1;out={en:"The lights come back on! The power is back.",ja:"明かりが戻った！電源が復旧した。"};push(false)}
    else if(!P.green)reset("The green light was not on.","緑のランプが点いていなかった。");
    else reset(`The dial was on ${P.dial}, not 2.`,`ダイヤルが2ではなく${P.dial}だった。`);
  }
  P.msg=out.en;saveAll();return out;
}
const entry={};
function bindLocks(box,R){
  box.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{
    const name=b.dataset.lock,k=b.dataset.k,n=4;entry[name]=entry[name]||"";
    if(k==="C")entry[name]="";else if(k==="E"){
      const v=entry[name];
      if(name==="safe"&&v===ANS.p2){G.solved.p2=1;push(false);roomView();return}
      if(name==="door"&&v===ANS.p4){G.solved.p4=1;G.end=Date.now();push(false);render();return}
      $(`#${name}-m`).innerHTML=`<span class="res-ng">ブーッ。開かない。</span>`;entry[name]="";
    }else if(entry[name].length<n)entry[name]+=k;
    $(`#${name}-d`).textContent=(entry[name]+"____").slice(0,n);
  });
  box.querySelectorAll("[data-col]").forEach(b=>b.onclick=()=>{L.colors=L.colors||[null,null,null];L.colors[+b.dataset.col]=b.dataset.v;saveAll();detail(R,L.view)});
  if($("#tryc"))$("#tryc").onclick=()=>{const c=L.colors||[];if(c.join()===ANS.p1.join()){G.solved.p1=1;push(false);roomView()}else $("#col-m").innerHTML=`<span class="res-ng">カチッ…開かない。</span>`};
  box.querySelectorAll("[data-dial]").forEach(b=>b.onclick=()=>{panelAct("dial",b.dataset.dial);detail(R,"closet")});
  if($("#sw"))$("#sw").onclick=()=>{panelAct("sw");detail(R,"closet")};
  if($("#red"))$("#red").onclick=()=>{panelAct("red");G.solved.p3?roomView():detail(R,"closet")};
}

    ${P.p2&&!P.p3?`<div class="muted" style="margin:10px 0 4px">頼む（ブレーカー盤）</div><div class="chips">${["OFF","1","2","3"].map(v=>`<button data-nd="${v}">Turn the dial to ${v}.</button>`).join("")}<button id="nsw">Flip the main switch.</button><button id="nred">Press the red button.</button><button id="ngr">Is the green light on?</button></div>`:""}
  </div>`;
  bindWords(c,"#nw");
  $("#nag").onclick=()=>speak(n.en,{rate:.92,pitch:1.15,voice:1});
  $("#nsb").onclick=()=>{L.nsub=!L.nsub;saveAll();npcPanel()};
  $("#nj").onclick=()=>{const j=$("#nja");j.hidden=!j.hidden;$("#nj").classList.toggle("on",!j.hidden)};
  c.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{npcAsk(b.dataset.q);npcPanel()});
  c.querySelectorAll("[data-nc]").forEach(b=>b.onclick=()=>{L.ncol=L.ncol||[null,null,null];L.ncol[+b.dataset.nc]=b.dataset.v;saveAll();npcPanel()});
  if($("#ntry"))$("#ntry").onclick=()=>{const k=L.ncol||[];if(k.some(x=>!x)){npcSay("Sorry, which three colors?","ごめん、3つの色はどれ？");npcPanel();return}
    if(k.join()===ANS.p1.join()){G.solved.p1=1;saveAll();npcSay(`${k.join(", ")}... It opened! There's a minibar price list inside.`,"開いた！中にミニバーの料金表があるわ。");roomView()}
    else{npcSay(`Okay, ${k[0]}, ${k[1]}, and ${k[2]}... No, it didn't open.`,"…だめ、開かない。");npcPanel()}};
  const pa=(a,v)=>{const o=panelAct(a,v);npcSay("Okay. "+o.en,o.ja);G.solved.p3?roomView():npcPanel()};
  c.querySelectorAll("[data-nd]").forEach(b=>b.onclick=()=>pa("dial",b.dataset.nd));
  if($("#nsw"))$("#nsw").onclick=()=>pa("sw");
  if($("#nred"))$("#nred").onclick=()=>pa("red");
  if($("#ngr"))$("#ngr").onclick=()=>{npcSay(L.panel.green?"Yes, it's on.":"No, it's off.",L.panel.green?"うん、点いてる。":"ううん、消えてる。");npcPanel()};
}

// ---------- クリア ----------
function clear(){
  const sec=Math.max(0,Math.round((G.end-G.start)/1000)),mm=Math.floor(sec/60),ss=sec%60;
  app.innerHTML=`
  <div class="top"><span class="prog">Stage 1 クリア</span><span class="prog">${MODE==="duo"?"個室 "+ROOM:"ひとり"}</span></div>
  <div class="card">
    <div class="big">ESCAPED!</div>
    <p>ドアが開いた。廊下に出ると、${MODE==="duo"?"隣の部屋の相方も出てきた":"402号室のリベラさんも出てきた"}。</p>
    <p>クリア時間 <b>${mm}分${ss}秒</b>｜ヒント ${sum(G.hints)} 回｜日本語びん ${sum(G.jp)}</p>
  </div>
  <div class="card"><h2>このステージの単語と言い回し</h2>${VOCAB.map(v=>`<div class="note"><button class="small" data-say="${esc(v[0])}">▶</button> ${esc(v[0])}　<span class="muted">${esc(v[1])}</span></div>`).join("")}</div>
  ${MODE==="duo"&&G.notes.length?`<div class="card"><h2>ふたりのメモ</h2><div class="notes">${G.notes.map(n=>`<div class="note"><div class="who">${n.from==="A"?"Room 401":"Room 402"}</div>${esc(n.text)}</div>`).join("")}</div></div>`:""}
  <div class="row">${MODE==="duo"?`<button class="pri" id="swap">部屋を入れ替えてもう一度</button>`:`<button class="pri" id="again">もう一度</button>`}<button id="home">タイトルへ</button></div>`;
  app.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>speak(b.dataset.say,{rate:.85}));
  $("#home").onclick=()=>{location.href=location.pathname};
  if($("#again"))$("#again").onclick=()=>{lsSet(gKey(),null);G=null;startSolo()};
  if($("#swap"))$("#swap").onclick=()=>{const r=String(100000+Math.floor(Math.random()*900000));
    G.notes.push({id:rid(),from:L.role,text:"NEXT ROOM: "+r,t:Date.now()});push(false);
    lsSet("eigo-escape:"+r,{G:newG(),L:{role:L.role==="A"?"B":"A",view:null,panel:{dial:"3",sw:"DOWN",green:false,msg:""}}});
    setTimeout(()=>{location.href=location.pathname+"?room="+r},500)};
  if(MODE==="duo"){const nx=G.notes.slice().reverse().find(n=>/^NEXT ROOM: \d{6}$/.test(n.text)&&n.from!==L.role);if(nx){const r=nx.text.slice(-6);const b=document.createElement("p");b.className="muted";b.style.marginTop="10px";b.innerHTML=`相方が入れ替えの部屋 ${r} を作りました。<button class="small" id="gonext">そこへ移る</button>`;app.appendChild(b);$("#gonext").onclick=()=>{lsSet("eigo-escape:"+r,{G:newG(),L:{role:L.role==="A"?"B":"A",view:null,panel:{dial:"3",sw:"DOWN",green:false,msg:""}}});location.href=location.pathname+"?room="+r}}}
}

title();
</script>
</body>
</html>
