<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<title>英語脱出</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<script src="https://unpkg.com/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script>
<style>
:root{--pg:#eef1ec;--card:#fff;--ink:#30362f;--muted:#6f7869;--line:#d3dacb;--head:#344f3d;--acc:#4f6f57;--soft:#e3eadf;--sel:#4f6f57;--selink:#fff;--ok:#3f7a4a;--ng:#8a5a5a;--paper:#fbf8ef;
  --font:"DotGothic16",-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
@media (prefers-color-scheme:dark){:root{--pg:#1c2622;--card:#27332e;--ink:#ebf1ea;--muted:#aebaa9;--line:#46564c;--head:#cde2c6;--acc:#a3c09a;--soft:#314139;--sel:#a3c09a;--selink:#1c2622;--ok:#9fd3a6;--ng:#e0b0b0;--paper:#2f3a33}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--pg);color:var(--ink);font-family:var(--font);line-height:1.6;-webkit-text-size-adjust:100%}
main{max-width:680px;margin:0 auto;padding:16px 16px 48px}
h1{font-weight:400;font-size:26px;color:var(--head);margin:8px 0 2px}
h2{font-weight:400;font-size:18px;color:var(--head);margin:0 0 8px}
h3{font-weight:400;font-size:15px;color:var(--muted);margin:12px 0 2px}
p{margin:0 0 10px}
.muted{color:var(--muted);font-size:14px}
.card{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:14px;margin:0 0 12px}
button{font-family:var(--font);font-size:16px;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;touch-action:manipulation}
button:active{transform:translateY(1px)}
button:disabled{opacity:.45;cursor:default}
button.pri{background:var(--acc);border-color:var(--acc);color:var(--selink)}
button.sel{background:var(--sel);border-color:var(--sel);color:var(--selink)}
button.on{border-color:var(--acc);color:var(--acc)}
button.small{font-size:14px;padding:4px 10px}
button.wide{width:100%;padding:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.back{border:none;background:none;color:var(--muted);padding:4px 0;font-size:14px}
.objs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.obj{text-align:left;padding:10px;font-size:15px;line-height:1.35}
.obj small{display:block;color:var(--muted);font-size:12px}
.obj.sel small{color:inherit;opacity:.8}
.doc{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0 4px;font-size:16px;white-space:pre-wrap}
.doc.torn{border-bottom:none;border-radius:8px 8px 0 0;padding-bottom:18px;clip-path:polygon(0 0,100% 0,100% 100%,94% calc(100% - 9px),88% 100%,81% calc(100% - 7px),74% 100%,66% calc(100% - 10px),58% 100%,50% calc(100% - 6px),42% 100%,34% calc(100% - 9px),26% 100%,18% calc(100% - 7px),10% 100%,4% calc(100% - 8px),0 100%)}
.tear{border-top:2px dashed var(--line);margin:8px -12px;position:relative}
.tear span{position:absolute;right:8px;top:-11px;background:var(--paper);font-size:11px;color:var(--muted);padding:0 4px}
.tornnote{font-size:12px;color:var(--muted);margin-bottom:6px}
.ja{color:var(--muted);font-size:14px;margin-top:6px;white-space:pre-wrap}
.w{border-bottom:1px dotted var(--muted);cursor:pointer}
.wbox{font-size:14px;color:var(--head);min-height:20px}
.lockrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.dig{font-size:22px;letter-spacing:6px;min-width:120px;text-align:center;padding:6px 10px;border:2px solid var(--line);border-radius:8px;background:var(--soft)}
.keys{display:grid;grid-template-columns:repeat(3,56px);gap:6px}
.keys button{padding:8px 0}
.dial{display:flex;align-items:center;gap:6px;margin:6px 0}
.dial .lab{min-width:84px;font-size:14px;color:var(--muted)}
.dial .val{font-size:22px;min-width:44px;text-align:center;border:2px solid var(--line);border-radius:8px;background:var(--soft);padding:2px 6px}
.msg{font-size:14px;color:var(--head);margin-top:6px}
.res-ok{color:var(--ok)}
.res-ng{color:var(--ng)}
.notes{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--paper);margin-bottom:8px}
.note{padding:4px 0;border-bottom:1px dashed var(--line);font-size:15px}
.note:last-child{border-bottom:none}
.note .who{font-size:12px;color:var(--muted)}
.note.sys{color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chips button{font-size:13px;padding:3px 8px}
input[type=text]{width:100%;font-family:var(--font);font-size:16px;padding:10px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.stat{font-size:13px;color:var(--muted)}
.prog{font-size:14px;color:var(--muted)}
.big{font-size:30px;color:var(--head)}
.inv{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.key{display:inline-flex;align-items:center;gap:6px;border:2px dashed var(--line);border-radius:10px;padding:4px 8px;font-size:14px}
.tut .step{font-size:13px;color:var(--muted);margin-bottom:4px}
.tut ol{margin:0 0 10px;padding-left:20px}
.tut li{margin-bottom:6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px;margin:8px 0;font-size:13px}
.cal div{min-height:38px;padding:2px 3px;border:1px solid var(--line);border-radius:3px;line-height:1.15}
.cal .hd{min-height:0;border:none;text-align:center;color:var(--muted);font-size:11px}
.cal .bl{border:none}
.cal i{display:block;font-style:normal;font-size:9px;color:var(--head);margin-top:2px}
.cal .ttl{grid-column:1/-1;border:none;min-height:0;text-align:center;color:var(--head);font-size:15px;letter-spacing:2px}
table.shelf{border-collapse:collapse;width:100%;font-size:15px}
table.shelf td{border-bottom:1px dashed var(--line);padding:3px 6px}
table.shelf td:first-child{width:56px;color:var(--muted)}
</style>
</head>
<body>
<main id="app"></main>
<script>
"use strict";
/* 英語脱出 ステージ1「The Letter Rooms」。2人用。
   シナリオ・謎・英文の正本は Claude Doc「英語脱出 ステージ1 シナリオと謎解き設計（改訂版）」。設計書は README.md。
   2人のつなぎ役は Supabase Realtime の broadcast と presence（DBの表は使わない）。publishable key は公開してよい値。 */
const SB={url:"https://rjydvhpqfhmlvpsykwzf.supabase.co",key:"sb_publishable_NAVKQxtEtS1zPFj59iXIEQ_Y_RztuSx"};
const VER="s1v2"; // 旧版（タオル・ミニバー）の保存データ・チャンネルと混ざらないように

// ---------- 小道具 ----------
const $=s=>document.querySelector(s);
const app=$("#app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rid=()=>Math.random().toString(36).slice(2,10);
function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let uid=0;const nid=()=>"x"+(++uid);

// ---------- 音声（ここだけで鳴らす。後で良い音声に差し替えられる） ----------
let VOICES=[];
function loadVoices(){if(!window.speechSynthesis)return;const all=speechSynthesis.getVoices();VOICES=all.filter(v=>/^en[-_](US|GB)/i.test(v.lang));if(!VOICES.length)VOICES=all.filter(v=>/^en/i.test(v.lang))}
if(window.speechSynthesis){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
const MALE=/\b(male|david|guy|daniel|alex|fred|aaron|arthur|tom|mark|james|ryan|christopher|eric|roger|brian|george|oliver|rishi|reed|ralph)\b/i;
const FEMALE=/\b(female|samantha|zira|aria|jenny|karen|moira|tessa|victoria|susan|allison|ava|serena|kate|libby|sonia|emma|michelle|joanna|salli|kimberly|martha|fiona|catherine)\b/i;
function pickVoice(kind){
  if(!VOICES.length)return null;
  const re=kind==="m"?MALE:FEMALE;
  return VOICES.find(v=>re.test(v.name)&&/US/i.test(v.lang))||VOICES.find(v=>re.test(v.name))||null;
}
const SPK={mia:{kind:"f",rate:.9,pitch:1.1},james:{kind:"m",rate:.86,pitch:.85},plain:{kind:"",rate:.85,pitch:1}};
let spkTok=0;
// 長い文は端末によって途中で切れるので、文ごとに順に読む
function speak(text,who){
  const sp=SPK[who]||SPK.plain;const tok=++spkTok;
  if(!window.speechSynthesis)return;
  try{speechSynthesis.cancel()}catch(e){}
  const parts=String(text).replace(/\n+/g," ").match(/[^.!?]+[.!?]+["”]?|[^.!?]+$/g)||[text];
  const v=sp.kind?pickVoice(sp.kind):null;
  // 男性の声が無い端末では高さを下げて区別する
  const pitch=sp.kind==="m"&&!v?.7:sp.pitch;
  let i=0;
  const next=()=>{
    if(tok!==spkTok||i>=parts.length)return;
    const u=new SpeechSynthesisUtterance(parts[i++].trim());u.lang="en-US";
    if(v)u.voice=v;else if(VOICES.length)u.voice=VOICES[0];
    u.rate=sp.rate;u.pitch=pitch;
    let done=false;const fin=()=>{if(!done){done=true;setTimeout(next,120)}};
    u.onend=fin;u.onerror=fin;setTimeout(fin,5000+u.text.length*120);
    try{speechSynthesis.speak(u)}catch(e){fin()}
  };
  next();
}
function hush(){spkTok++;try{window.speechSynthesis&&speechSynthesis.cancel()}catch(e){}}

// ---------- 辞書（文書の単語をタップすると意味が出る） ----------
const DICT={storm:"嵐",power:"電気・電源",electronic:"電子の",locks:"錠",lock:"錠",emergency:"非常の",keypad:"数字キー",battery:"電池",runs:"（機械が）動く",code:"暗証番号",owner:"持ち主・オーナー",chose:"選んだ（choose の過去）",lines:"線（phone lines＝電話線）",down:"（線が）切れて",opened:"開いた",month:"月",connecting:"つながっている",slide:"滑らせる",sliding:"滑らせている",thin:"薄い",downstairs:"下の階に",autumn:"秋",strangers:"見知らぬ人たち",passed:"渡した（pass の過去）",received:"受け取った",locked:"鍵のかかった",finish:"終える",free:"無料の",breakfast:"朝食",lighthouse:"灯台",radio:"無線",station:"局",enough:"十分な",teach:"教える",practice:"練習する",typewriter:"タイプライター",deal:"取り決め・約束",type:"（タイプライターで）打つ",noise:"音・騒音",hour:"時（何時の）",harbor:"港",postcard:"絵はがき",dark:"暗い",lamp:"明かり・ランプ",quarter:"4分の1（15分）",asleep:"眠って",quietly:"静かに",weather:"天気",reports:"報告・予報",report:"報告・予報",tide:"潮",romantic:"ロマンチックな",exactly:"ちょうど",wall:"壁",beautiful:"美しい",miss:"恋しく思う",footsteps:"足音",drop:"落とす",drops:"落とす",dropped:"落とした",folder:"楽譜ばさみ・フォルダー",diary:"日記",neighbor:"隣人",neighbors:"隣人たち",awake:"目が覚めて",count:"数える",steps:"歩数・足音",stairs:"階段",seventeen:"17",single:"ひとつの（every single day＝毎日欠かさず）",sound:"音",question:"問い",tape:"テープ",special:"特別な",south:"南",calm:"穏やかな",moon:"月",rises:"昇る",logbook:"業務日誌",numbers:"数",over:"（無線で）以上",company:"会社",north:"北",goodbyes:"別れ",worse:"もっと下手な",knock:"ノックする",finally:"ついに",understand:"わかる",front:"正面の（front hall＝玄関ホール）",hall:"ホール",hears:"聞こえる",borrowed:"借りた",wedding:"結婚式",photo:"写真",rain:"雨",hitting:"打っている",slowly:"ゆっくり",calendar:"カレンダー",concert:"演奏会",last:"最後の",sheet:"1枚（の紙）",visibility:"視界",force:"風力",finished:"終わった",dish:"皿",keys:"鍵（複数）",key:"鍵",tag:"札",fits:"合う",gap:"隙間",narrow:"細い",carved:"彫った",edge:"縁",letters:"手紙・文字",letter:"手紙",secret:"秘密",grandparents:"祖父母",candles:"ろうそく",years:"年",story:"物語",card:"カード",trunk:"トランク",shelf:"棚",piano:"ピアノ",bench:"（ピアノの）椅子",plaque:"銘板・案内板",brass:"真ちゅう",framed:"額に入った",note:"メモ",notes:"メモ",guest:"客",guests:"客たち",room:"部屋",rooms:"部屋",before:"〜より前に",after:"〜より後に",midnight:"真夜中",morning:"朝",evening:"夕方・夜",spell:"つづりを言う",date:"日付",wrote:"書いた（write の過去）",line:"行",sorry:"すまなく思う",cut:"切った",working:"動いている",still:"まだ",keep:"保つ",keeps:"保つ",window:"窓",light:"光・明かり",across:"〜を横切って",sea:"海",turns:"回る",wind:"風",sky:"空",home:"故郷・家",face:"顔",never:"一度も〜ない",swan:"白鳥",mood:"気分",waltz:"ワルツ",sonata:"ソナタ",through:"〜を通して",hear:"聞こえる",heard:"聞こえた（hear の過去）",watch:"見る・見守る",watched:"見ていた",town:"町",always:"いつも",then:"それから",very:"とても",ends:"終わる",sending:"送る",bad:"下手な",again:"もう一度",saturday:"土曜日",thursday:"木曜日",wednesday:"水曜日",tuesday:"火曜日",monday:"月曜日",friday:"金曜日",sunday:"日曜日",september:"9月",october:"10月",june:"6月",ninth:"9日・9番目",grandson:"孫",tea:"紅茶",meet:"会う",lobby:"ロビー",sent:"送った",open:"開ける・開いている",anything:"何か",dial:"ダイヤル",dials:"ダイヤル",set:"合わせる",hint:"ヒント",until:"〜まで",unfinished:"書きかけの",music:"音楽",teacher:"先生",school:"学校",number:"番号・数",nothing:"何も〜ない",sleep:"睡眠",stop:"やめる",playing:"弾くこと",play:"弾く",slow:"ゆっくりした",shows:"写している",where:"どこ",whatever:"何でも",wakes:"起こす",everything:"すべて"};
function tw(text){return esc(text).replace(/[A-Za-z]+/g,w=>DICT[w.toLowerCase()]?`<span class="w" data-w="${w.toLowerCase()}">${w}</span>`:w)}
function bindWords(root,box){root.querySelectorAll(".w").forEach(s=>s.onclick=()=>{const b=$(box);if(b)b.textContent=`${s.dataset.w}：${DICT[s.dataset.w]}`})}

// ---------- ステージ1の英文（Claude Doc の「英語の本文」が正。答えに関わる語は変えない） ----------
const T={
 vm:{en:"Hello, this is Mia at the front desk. I'm very sorry. The storm has cut the power, and the electronic locks on your doors are not working. There is an emergency keypad next to each door. It runs on a battery, so it still works. But I don't know the code. Mr. Hale, the owner, chose it many years ago, and the phone lines outside the hotel are down, so I can't call him. He always says the same thing: \"The code is the day the door opened. Month first, then day.\" You are in Rooms 401 and 402. We call them the Letter Rooms. The story of Mr. and Mrs. Hale is in those two rooms. If you read it, you will find the day. One more thing. There is a connecting door between your rooms. It is locked, but you can slide thin things under it, like notes. Good luck. I'll be downstairs.",
  ja:"もしもし、フロントのミアです。本当に申し訳ありません。嵐で停電して、お部屋のドアの電子錠が動いていません。各ドアの横に非常用のキーパッドがあります。電池で動くので、まだ使えます。でも、私は番号を知りません。オーナーのヘイルさんが何年も前に決めたもので、ホテルの外の電話線が切れているので、電話もできません。ヘイルさんはいつも同じことを言います。「番号はドアが開いた日。月が先、日が後」。お二人は401号室と402号室にいます。私たちは「手紙の部屋」と呼んでいます。ヘイル夫妻の物語が、その二つの部屋にあります。それを読めば、その日がわかります。もうひとつ。お二人の部屋の間には連絡用ドアがあります。鍵がかかっていますが、メモのような薄い物なら下から滑らせて渡せます。幸運を。私は下の階にいます。"},
 plaque:{en:"THE LETTER ROOMS\n\nIn the autumn of 1976, two strangers lived in these two rooms. They never saw each other. They only passed notes under the connecting door.\n\nTheir letters are still here. Each room keeps the letters that its guest RECEIVED.\n\nSome letters are locked away. The cards will help you.\n\nGuests who finish the story get a free breakfast.",
  ja:"手紙の部屋\n\n1976年の秋、見知らぬ二人がこの二つの部屋に住んでいた。二人は一度も顔を合わせなかった。連絡用ドアの下からメモを渡し合っただけだった。\n\n二人の手紙は今もここにある。それぞれの部屋には、その部屋の客が「受け取った」手紙が置いてある。\n\n鍵のかかった手紙もある。カードが助けてくれる。\n\n物語を読み終えたお客様には、朝食を無料でご用意します。"},
 J1:{en:"Monday, September 6\n\nTo the guest in Room 401,\n\nPlease stop playing the piano at six in the morning. I work all night at the lighthouse radio station, and I go to bed at five. One hour of sleep is not enough.\n\nRoom 402",
  ja:"9月6日 月曜日\n\n401号室の方へ\n\n朝6時にピアノを弾くのをやめてください。私は灯台の無線局で夜通し働いていて、5時に寝ます。1時間の睡眠では足りません。\n\n402号室"},
 E1:{en:"Tuesday, September 7\n\nTo Room 402,\n\nI am sorry about the piano. I teach music at the school, and early morning is my only time to practice. But your typewriter wakes me up at midnight!\n\nLet's make a deal. I will not play before eight. You will not type after eleven.\n\nRoom 401\n\nP.S. What do you type every night?",
  ja:"9月7日 火曜日\n\n402号室の方へ\n\nピアノのことはごめんなさい。私は学校で音楽を教えていて、朝早くしか練習する時間がないのです。でも、あなたのタイプライターで、私は真夜中に目が覚めます！\n\n取り決めをしましょう。私は8時より前には弾きません。あなたは11時より後には打たない。\n\n401号室\n\n追伸　毎晩、何を打っているの？"},
 card1:{en:"CARD 1: THE DEAL\n\nThey made a deal about noise. Set her hour first, then his hour.",ja:"カード1：取り決め\n\n二人は音について取り決めをした。まず彼女の時刻、次に彼の時刻を合わせよ。"},
 postFront:{en:"A postcard of a white lighthouse above the harbor.",ja:"港を見下ろす白い灯台の絵はがき。"},
 postcard:{en:"For the piano teacher.\n\nFrom the top of the lighthouse, I watch the town go dark, window by window. Your lamp is always the last. It goes out at a quarter to twelve. Then I know you are asleep, and I type very quietly.\n\nJ.",
  ja:"ピアノの先生へ。\n\n灯台のてっぺんから、町が窓ひとつずつ暗くなっていくのを見ています。あなたの明かりはいつも最後です。12時15分前に消えます。それで、あなたが眠ったとわかって、私はとても静かにタイプを打つのです。\n\nJ."},
 card2:{en:"CARD 2: THE LAST LIGHT\n\nEvery night he watched the town go dark. What time did the last light go out? (Four numbers.)",ja:"カード2：最後の明かり\n\n彼は毎晩、町が暗くなるのを見ていた。最後の明かりが消えたのは何時か？（数字4つ）"},
 J2:{en:"Tuesday, September 14\n\nDear 401,\n\nIt's a deal. I type weather reports for the ships: wind, rain, and tide. It is not very romantic.\n\nThis morning, at eight exactly, I heard you play something slow through the wall. It was beautiful. What was it?\n\nI am sliding a postcard under the door. It shows where I work.\n\nJ.",
  ja:"9月14日 火曜日\n\n401さんへ\n\n取り決め成立です。私は船のための天気予報を打っています。風、雨、潮。あまりロマンチックではありません。\n\n今朝ちょうど8時に、壁越しにあなたがゆっくりした曲を弾くのが聞こえました。美しかった。あれは何という曲？\n\nドアの下から絵はがきを滑らせます。私の職場が写っています。\n\nJ."},
 E2:{en:"Tuesday, September 21\n\nDear J.,\n\nIt was \"Clair de Lune.\" I play it when I miss home. Thank you for the postcard. It is on my piano now.\n\nI have never seen your face, but I know your footsteps. You come home when the sky is still dark, and you always drop your keys at your door.\n\nE.",

// ---------- 状態 ----------
// G: 2人で共有（解いた謎・鍵・メモ・ヒント回数など）。L: 自分だけ（どちらの部屋か、見ている物、錠の入力途中など）
const me=lsGet("eigo-escape-me")||rid();lsSet("eigo-escape-me",me);
let ROOM=null,G=null,L=null,ch=null,sbc=null,PEERS={},online=false;
function newG(){return{solved:{},k:{},cd:0,notes:[],jp:{},hints:{},start:0,end:0}}
function newL(role){return{role:role||null,view:null,draft:"",hint:{},dial:[1,1]}}
function gKey(r){return "eigo-escape:"+VER+":"+(r||ROOM)}
function saveAll(){lsSet(gKey(),{G,L})}
function sum(o){return Object.values(o||{}).reduce((a,b)=>a+b,0)}
function merge(o){
  if(!o)return;
  PZ.forEach(p=>{if(o.solved&&o.solved[p])G.solved[p]=1});
  Object.keys(KEYS).forEach(k=>{const v=+((o.k||{})[k])||0;if(v>(G.k[k]||0))G.k[k]=Math.min(3,v)});
  if(o.cd)G.cd=1;
  const ids=new Set(G.notes.map(n=>n.id));(o.notes||[]).forEach(n=>{if(n&&n.id&&!ids.has(n.id)&&typeof n.text==="string")G.notes.push({id:n.id,from:n.from,text:String(n.text).slice(0,300),t:+n.t||0})});
  G.notes.sort((a,b)=>a.t-b.t);
  ["jp","hints"].forEach(k=>Object.keys(o[k]||{}).forEach(p=>{G[k][p]=Math.max(G[k][p]||0,+o[k][p]||0)}));
  if(o.start&&(!G.start||o.start<G.start))G.start=o.start;
  if(o.end&&(!G.end||o.end<G.end))G.end=o.end;
}
function push(ask){saveAll();if(ch&&online)ch.send({type:"broadcast",event:"st",payload:{g:G,ask:!!ask}}).catch(()=>{})}
function connect(){
  if(!window.supabase)return;
  sbc=window.supabase.createClient(SB.url,SB.key);
  ch=sbc.channel("eigo-escape:"+VER+":"+ROOM,{config:{presence:{key:me},broadcast:{self:false}}});
  ch.on("broadcast",{event:"st"},m=>{const d=m&&m.payload;if(!d)return;const before=JSON.stringify(G);merge(d.g);saveAll();if(d.ask)push(false);if(JSON.stringify(G)!==before)render(true)});
  ch.on("presence",{event:"sync"},()=>{const st=ch.presenceState();PEERS={};Object.keys(st).forEach(k=>{if(k!==me)PEERS[k]=(st[k][0]||{}).role||""});render(true)});
  ch.subscribe(s=>{if(s==="SUBSCRIBED"){online=true;ch.track({role:L.role||""}).catch(()=>{});push(true);render(true)}else if(s==="CLOSED"||s==="CHANNEL_ERROR"||s==="TIMED_OUT"){online=false;render(true)}});
}
function sysNote(text){G.notes.push({id:rid(),from:"sys",text,t:Date.now()})}

function startDuo(room){
  ROOM=room;
  const q=new URLSearchParams(location.search);q.set("room",room);history.replaceState(null,"",location.pathname+"?"+q.toString());
  const s=lsGet(gKey());G=s&&s.G?s.G:newG();L=s&&s.L?Object.assign(newL(),s.L):newL();
  G.k=G.k||{};
  connect();render();
}

// ---------- 遊び方（部屋に入った最初と「遊び方」ボタンで出す。3枚） ----------
function tutCards(R){
  const first=R==="A"?"401のあなたは、まず <b>writing box</b>（手紙箱）と <b>piano</b>（ピアノ）を見てみましょう。":R==="B"?"402のあなたは、まず <b>framed note</b>（額のメモ）と <b>sea trunk</b>（トランク）を見てみましょう。":"";
  return [
   ["目的",`<ol><li>嵐で停電し、401号室と402号室に閉じ込められました。ふたりは別々の部屋にいて、相方の部屋は見えません。</li><li>廊下のドアのキーパッドに<b>4桁の番号</b>を入れれば脱出です。番号は「ドアが開いた日」。</li><li>まず <b>phone</b>（電話）で留守電を聞きましょう。状況が英語で説明されます。</li></ol>`],
   ["調べる・開ける",`<ol><li>上に並んだボタン（piano、writing box など）を押すと、その物を調べられます。もう一度押すと閉じます。</li><li>手紙やカードを読みます。わからない単語は<b>点線の単語をタップ</b>で意味が出ます。「訳」で和訳も出せます。</li><li>錠には番号やダイヤルを入れます。間違えても罰はありません。</li></ol>`],
   ["相方と伝え合う",`<ol><li><b>答えの手がかりは、いつも相方の部屋にあります。</b>自分の部屋だけでは開きません。</li><li>画面の下の「ドアの下のメモ」に英語で書いて聞き合います。お助けフレーズ（Can you read it to me? など）を押すと入ります。</li><li>謎を解くと鍵が出ることがあります。「持ち物」の<b>ドアの下から滑らせる</b>で相方に渡します。</li><li>詰まったら<b>ヒント</b>。3段目は日本語で答えまで出ます。</li></ol>${first?`<p>${first}</p>`:""}`]
  ];
}
function showTut(i,after){
  const C=tutCards(L&&L.role),c=C[i];
  app.innerHTML=`<div class="top"><span class="prog">遊び方</span><span class="prog">${i+1} / ${C.length}</span></div>
  <div class="card tut"><h2>${c[0]}</h2>${c[1]}
  <div class="row" style="margin-top:8px">${i>0?`<button id="tp">‹ 前へ</button>`:""}${i<C.length-1?`<button class="pri" id="tn">次へ ›</button>`:`<button class="pri" id="tn">はじめる</button>`}<button class="small" id="ts">とばす</button></div></div>`;
  if($("#tp"))$("#tp").onclick=()=>showTut(i-1,after);
  $("#tn").onclick=()=>i<C.length-1?showTut(i+1,after):after();
  $("#ts").onclick=after;
  window.scrollTo(0,0);
}

let inTut=false;
function render(remote){
  if(!G)return title();
  if(inTut&&!G.end)return;
  if(G.end)return clear();
  if(!L.role)return pickRole();

function keyLine(k,R){
  const s=G.k[k]||0;

}
function useKeyHTML(R,target){
  const mine=Object.keys(KEYS).filter(k=>holder(k)===R);

  return `<div class="row">${mine.map(k=>`<button data-use="${k}" data-tg="${target}">🗝 ${esc(KEYS[k].tag)} を使う</button>`).join("")}</div><div class="msg" id="usem"></div>`;

const entry={};
function digitLock(p,n){
  const e=entry[p]||"";

}
function dialLock(){
  const d=L.dial||[1,1];

function solve(p){

  if(p==="p2"&&!G.k.bench)G.k.bench=1;

  if(p==="p5"){G.end=Date.now();if(G.cd&&!G.notes.some(n=>n.from==="EJ"))G.notes.push({id:"ej",from:"EJ",text:T.ej.en,t:Date.now()})}

function bindLocks(box,R){

  });

  <div class="top"><span class="prog">Stage 1 クリア</span><span class="prog">個室 ${ROOM}</span></div>
  <div class="card">
    <div class="big">ESCAPED!</div>
    <p>キーパッドが緑に光り、ドアが開いた。廊下に出ると、隣の部屋から相方も出てきた。電話が鳴る。</p>
    ${audioHTML("end","フロントのミアの声",true)}
    <p style="margin-top:10px">クリア時間 <b>${mm}分${ss}秒</b>｜ヒント ${sum(G.hints)} 回｜日本語びん ${sum(G.jp)}</p>
  </div>
  ${G.cd?`<div class="card"><h2>ドアの下から、もう1枚</h2><p class="muted">ふたりのどちらも書いていないメモが届いた。</p>${docHTML(T.ej)}</div>`:""}
  <div class="card"><h2>物語を日付順に読み返す</h2>${story.map(s=>`<h3>${esc(s[1])}</h3>${s[0]==="J3"?tornHTML(T.J3a,T.J3b,true,"破れていた手紙"):s[0]==="E3"?tornHTML(T.E3a,T.E3b,true,"破れていた手紙"):docHTML(T[s[0]])}`).join("")}
    <p class="muted" style="margin-top:10px">1976年10月9日（土）夜9時、連絡用ドアが開き、二人は初めて顔を合わせた。二人はのちに結婚し、このホテルを買い取った。</p></div>
  <div class="card"><h2>このステージの単語と言い回し</h2>${VOCAB.map(v=>`<div class="note"><button class="small" data-say="${esc(v[0])}">▶</button> ${esc(v[0])}　<span class="muted">${esc(v[1])}</span></div>`).join("")}</div>
  ${notes.length?`<div class="card"><h2>ふたりのメモ</h2><div class="notes">${notes.map(n=>`<div class="note${n.from==="sys"?" sys":""}"><div class="who">${n.from==="A"?"Room 401":n.from==="B"?"Room 402":""}</div>${esc(n.text)}</div>`).join("")}</div></div>`:""}
  <div class="wbox" id="wb"></div>
  <div class="row"><button class="pri" id="swap">部屋を入れ替えてもう一度</button><button id="home">タイトルへ</button></div>`;
  bindDoc(app);bindAudio(app);
  app.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>speak(b.dataset.say,"plain"));
  $("#home").onclick=()=>{location.href=location.pathname};
  const other=L.role==="A"?"B":"A";
  $("#swap").onclick=()=>{const r=String(100000+Math.floor(Math.random()*900000));
    G.notes.push({id:rid(),from:L.role,text:"NEXT ROOM: "+r,t:Date.now()});push(false);
    lsSet(gKey(r),{G:newG(),L:newL(other)});
    setTimeout(()=>{location.href=location.pathname+"?room="+r},500)};
  const nx=G.notes.slice().reverse().find(n=>/^NEXT ROOM: \d{6}$/.test(n.text)&&n.from!==L.role);
  if(nx){const r=nx.text.slice(-6);const b=document.createElement("p");b.className="muted";b.style.marginTop="10px";b.innerHTML=`相方が入れ替えの部屋 ${r} を作りました。<button class="small" id="gonext">そこへ移る</button>`;app.appendChild(b);$("#gonext").onclick=()=>{lsSet(gKey(r),{G:newG(),L:newL(other)});location.href=location.pathname+"?room="+r}}
}

title();
</script>
</body>
</html>
