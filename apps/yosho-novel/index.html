{t:"I had seen little of Holmes lately. My marriage had drifted us away from each other.",ja:"このところ、私はホームズとほとんど会っていなかった。私の結婚が、ふたりを遠ざけていたのだ。"},
{t:"My own complete happiness, and the home-centred interests which rise up around the man who first finds himself master of his own establishment, were sufficient to absorb all my attention,",ja:"私自身の満ち足りた幸せと、初めて一家の主となった男のまわりに湧き上がる家庭中心の関心事で、私の注意はすっかり奪われていた。"},
{t:"while Holmes, who loathed every form of society with his whole Bohemian soul, remained in our lodgings in Baker Street, buried among his old books,",ja:"一方ホームズは、ボヘミアン気質の魂のすべてであらゆる社交を嫌い、ベイカー街の私たちの下宿にとどまって、古い本に埋もれていた。"},
{t:"and alternating from week to week between cocaine and ambition, the drowsiness of the drug, and the fierce energy of his own keen nature.",ja:"そして週ごとに、コカインと野心のあいだ、薬のもたらすまどろみと、鋭い気性の激しい活力とのあいだを行き来していた。",n:"当時コカインは合法で、薬として売られていた"},
{t:"He was still, as ever, deeply attracted by the study of crime, and occupied his immense faculties and extraordinary powers of observation",ja:"彼は相変わらず犯罪の研究に強く惹かれ、その並外れた才能と驚くべき観察力を、"},
{t:"in following out those clues, and clearing up those mysteries which had been abandoned as hopeless by the official police.",ja:"警察が見込みなしとして投げ出した手がかりをたどり、謎を解き明かすことに注いでいた。"},
{t:"From time to time I heard some vague account of his doings: of his summons to Odessa in the case of the Trepoff murder,",ja:"ときおり彼の活動について漠然とした話が耳に入った。トレポフ殺人事件でオデッサに呼ばれたこと、",m:{blink:"Odessa"}},
{t:"of his clearing up of the singular tragedy of the Atkinson brothers at Trincomalee, and finally of the mission which he had accomplished so delicately and successfully for the reigning family of Holland.",ja:"トリンコマリーでのアトキンソン兄弟の奇妙な悲劇を解決したこと、そして最後に、オランダ王家のために見事に、慎重に成し遂げた任務のこと。",m:{blink:"Holland"}},
{t:"Beyond these signs of his activity, however, which I merely shared with all the readers of the daily press, I knew little of my former friend and companion.",ja:"けれども、日刊新聞の読者なら誰でも知っているこうした活躍の知らせのほかは、かつての友であり相棒だった男について、私はほとんど何も知らなかった。"},
{scene:{y:1888,w:"3月20日",era:"ヴィクトリア朝ロンドン",e:"窓に映る影",m:{c:"Baker Street",r:60,pins:["Baker Street"],blink:"Baker Street",clear:1}}},
{t:"One night—it was on the twentieth of March, 1888—I was returning from a journey to a patient (for I had now returned to civil practice), when my way led me through Baker Street.",ja:"ある晩、1888年3月20日のことだった。私は患者のもとへ往診した帰りで（そのころ私は開業医に戻っていた）、道がベイカー街を通っていた。"},
{t:"As I passed the well-remembered door, which must always be associated in my mind with my wooing, and with the dark incidents of the Study in Scarlet,",ja:"よく覚えているあの扉の前を通りかかったとき、それは私の心の中で、妻への求婚と、あの『緋色の研究』の暗い事件にいつまでも結びついている扉なのだが、"},
{t:"I was seized with a keen desire to see Holmes again, and to know how he was employing his extraordinary powers.",ja:"私はもう一度ホームズに会い、彼があの並外れた力を今どう使っているのか知りたいという強い思いにとらわれた。"},
{t:"His rooms were brilliantly lit, and, even as I looked up, I saw his tall, spare figure pass twice in a dark silhouette against the blind.",ja:"彼の部屋には明々と灯りがついていた。見上げたちょうどそのとき、背の高いやせた姿が、黒い影となって日よけに二度映って横切った。"},
{t:"He was pacing the room swiftly, eagerly, with his head sunk upon his chest and his hands clasped behind him.",ja:"彼は頭を胸に垂れ、両手を後ろで組んで、すばやく、熱心に部屋の中を歩き回っていた。"},
{t:"To me, who knew his every mood and habit, his attitude and manner told their own story. He was at work again.",ja:"彼の気分も癖もすべて知っている私には、その姿勢と様子だけで事情がわかった。彼はまた仕事にかかっているのだ。"},
{t:"He had risen out of his drug-created dreams and was hot upon the scent of some new problem.",ja:"薬の作る夢から抜け出し、何か新しい問題の匂いを熱心に追っているのだ。"},
{t:"I rang the bell and was shown up to the chamber which had formerly been in part my own.",ja:"私は呼び鈴を鳴らし、かつては半分私の部屋でもあった部屋へと案内された。"},
{scene:{y:1888,w:"3月20日",era:"ヴィクトリア朝ロンドン",e:"見ているが、観察していない",m:{c:"Baker Street",r:60,pins:["Baker Street"],blink:"Baker Street"}}},
{t:"His manner was not effusive. It seldom was; but he was glad, I think, to see me.",ja:"彼の態度は大げさなものではなかった。めったにそうなることはない。だが、私に会えて喜んでいたと思う。"},
{t:"With hardly a word spoken, but with a kindly eye, he waved me to an armchair, threw across his case of cigars, and indicated a spirit case and a gasogene in the corner.",ja:"ほとんど口はきかなかったが、優しい目で私に肘掛け椅子をすすめ、葉巻の箱を放ってよこし、隅の酒の入れ物とソーダ水製造器を指し示した。"},
{t:"Then he stood before the fire and looked me over in his singular introspective fashion.",ja:"それから暖炉の前に立ち、彼独特の、内側をのぞき込むようなやり方で私をじろじろと見た。"},
{sp:"holmes",t:"“Wedlock suits you,” he remarked. “I think, Watson, that you have put on seven and a half pounds since I saw you.”",ja:"「結婚は君に合っているようだね」と彼は言った。「ワトソン、前に会ったときから7ポンド半（約3.4キロ）太ったね」"},
{sp:"watson",t:"“Seven!” I answered.",ja:"「7ポンドだよ！」と私は答えた。"},
{sp:"holmes",t:"“Indeed, I should have thought a little more. Just a trifle more, I fancy, Watson. And in practice again, I observe. You did not tell me that you intended to go into harness.”",ja:"「いや、もう少し多いと思ったがね。ほんの少しだけ多いと思うよ、ワトソン。それに、また開業しているね。仕事に戻るつもりだとは聞いていなかったが」"},
{sp:"watson",t:"“Then, how do you know?”",ja:"「じゃあ、どうしてわかるんだ？」"},
{sp:"holmes",t:"“I see it, I deduce it. How do I know that you have been getting yourself very wet lately, and that you have a most clumsy and careless servant girl?”",ja:"「見て、推理するのさ。君が最近ずぶ濡れになったことや、とても不器用でそそっかしいお手伝いの娘を雇っていることが、なぜ僕にわかると思う？」"},
{choice:"ホームズは何を見て、ワトソンが「最近ずぶ濡れになった」と見抜いたのだろう？",dd:1,a:0,
 o:[{t:"Cuts on the inside of his left shoe",ja:"左の靴の内側の切り傷",h:1},{t:"Mud on the bottom of his trousers",ja:"ズボンのすその泥"},{t:"A cough and a red nose",ja:"せきと赤い鼻"}],
 fb:"答え合わせは、このあとのホームズの説明で。"},
{sp:"watson",t:"“My dear Holmes,” said I, “this is too much. You would certainly have been burned, had you lived a few centuries ago.",ja:"「おいおいホームズ」と私は言った。「それはやりすぎだ。何百年か前に生まれていたら、間違いなく魔女として火あぶりにされていたぞ。"},
{sp:"watson",t:"It is true that I had a country walk on Thursday and came home in a dreadful mess, but as I have changed my clothes I can’t imagine how you deduce it.",ja:"たしかに木曜日に田舎を歩いて、ひどい格好で帰ってきた。でも服は着替えたんだから、どうして推理できたのか見当もつかない。"},
{sp:"watson",t:"As to Mary Jane, she is incorrigible, and my wife has given her notice, but there, again, I fail to see how you work it out.”",ja:"メアリー・ジェーンのほうは、どうしようもない子で、妻が辞めてもらうことにした。でも、それもどうやって割り出したのかわからないよ」"},
{t:"He chuckled to himself and rubbed his long, nervous hands together.",ja:"彼はひとりでくすくす笑い、長い神経質そうな両手をこすり合わせた。"},
{sp:"holmes",t:"“It is simplicity itself,” said he; “my eyes tell me that on the inside of your left shoe, just where the firelight strikes it, the leather is scored by six almost parallel cuts.",ja:"「簡単そのものさ」と彼は言った。「君の左の靴の内側、ちょうど暖炉の光が当たっているところで、革にほとんど平行な6本の切り傷がついているのが見える。"},
{sp:"holmes",t:"Obviously they have been caused by someone who has very carelessly scraped round the edges of the sole in order to remove crusted mud from it.",ja:"明らかに、こびりついた泥を落とそうとして、誰かが靴底のふちをひどくぞんざいにこそげたせいだ。"},
{sp:"holmes",t:"Hence, you see, my double deduction that you had been out in vile weather, and that you had a particularly malignant boot-slitting specimen of the London slavey.",ja:"だから、わかるだろう、二重の推理になる。君がひどい天気の中を出歩いたこと、そして靴を切り裂くほどたちの悪いロンドンの下働き娘を雇っていることだ。"},
{sp:"holmes",t:"As to your practice, if a gentleman walks into my rooms smelling of iodoform, with a black mark of nitrate of silver upon his right forefinger,",ja:"開業のほうはこうだ。ヨードホルムのにおいをさせ、右の人さし指に硝酸銀の黒いしみをつけ、"},
{sp:"holmes",t:"and a bulge on the right side of his top-hat to show where he has secreted his stethoscope, I must be dull, indeed, if I do not pronounce him to be an active member of the medical profession.”",ja:"シルクハットの右側に聴診器を隠したふくらみがある紳士が部屋に入ってきたら、現役の医者だと言い当てられないようでは、僕はよほどの鈍物ということになる」"},
{t:"I could not help laughing at the ease with which he explained his process of deduction.",ja:"彼が推理の筋道をいとも簡単に説明するので、私は笑わずにいられなかった。"},
{sp:"watson",t:"“When I hear you give your reasons,” I remarked, “the thing always appears to me to be so ridiculously simple that I could easily do it myself,",ja:"「君が理由を話すのを聞くと」と私は言った。「いつもばかばかしいほど簡単に思えて、自分にも楽にできそうな気がする。"},
{sp:"watson",t:"though at each successive instance of your reasoning I am baffled until you explain your process. And yet I believe that my eyes are as good as yours.”",ja:"それなのに、君が推理するたびに、説明してもらうまで私はさっぱりわからない。目は君と同じくらいいいはずなんだがね」"},
{sp:"holmes",t:"“Quite so,” he answered, lighting a cigarette, and throwing himself down into an armchair. “You see, but you do not observe. The distinction is clear.",ja:"「そのとおり」と彼は紙巻きたばこに火をつけ、肘掛け椅子にどさりと座りながら答えた。「君は見ているが、観察していない。その違いははっきりしている。"},
{sp:"holmes",t:"For example, you have frequently seen the steps which lead up from the hall to this room.”",ja:"たとえば、玄関からこの部屋へ上がる階段を、君は何度も見ているね」"},
{sp:"watson",t:"“Frequently.”",ja:"「何度もね」"},
{sp:"holmes",t:"“How often?”",ja:"「何回くらい？」"},
{sp:"watson",t:"“Well, some hundreds of times.”",ja:"「そうだな、何百回か」"},
{sp:"holmes",t:"“Then how many are there?”",ja:"「では、何段ある？」"},
{sp:"watson",t:"“How many? I don’t know.”",ja:"「何段？知らないな」"},
{sp:"holmes",t:"“Quite so! You have not observed. And yet you have seen. That is just my point. Now, I know that there are seventeen steps, because I have both seen and observed.",ja:"「そのとおり！君は観察していない。それでいて見てはいる。そこが肝心なところだ。僕は17段あると知っている。見て、しかも観察したからね。"},
{t:"“You see, but you do not 〔？〕.”",recall:"observe",q:"ホームズの決めぜりふ。「見ているが、〇〇していない」",o:["observe","deduce","notice"]},
{scene:{y:1888,w:"3月20日",era:"ヴィクトリア朝ロンドン",e:"差出人のない手紙",m:{c:"Baker Street",r:60,pins:["Baker Street"],blink:"Baker Street"}}},
{sp:"holmes",t:"By the way, since you are interested in these little problems, and since you are good enough to chronicle one or two of my trifling experiences, you may be interested in this.”",ja:"ところで、君はこういうちょっとした問題に興味があるし、僕のささいな経験を一つ二つ記録してくれるほど親切だから、これにも興味がわくかもしれない」"},
{t:"He threw over a sheet of thick, pink-tinted notepaper which had been lying open upon the table.",ja:"彼はテーブルの上に広げて置いてあった、厚手で薄いピンク色の便せんを一枚、こちらへ放ってよこした。"},
{sp:"holmes",t:"“It came by the last post,” said he. “Read it aloud.”",ja:"「最後の配達で届いたんだ」と彼は言った。「声に出して読んでくれたまえ」"},
{t:"The note was undated, and without either signature or address.",ja:"その手紙には日付がなく、署名も住所もなかった。"},
{sp:"note",t:"“There will call upon you to-night, at a quarter to eight o’clock,” it said, “a gentleman who desires to consult you upon a matter of the very deepest moment.",ja:"「今夜8時15分前に」と手紙にはあった。「きわめて重大な件でご相談したいという紳士が、あなたを訪ねます。"},
{sp:"note",t:"Your recent services to one of the royal houses of Europe have shown that you are one who may safely be trusted with matters which are of an importance which can hardly be exaggerated.",ja:"最近あなたがヨーロッパのある王家のために尽くされたことから、どれほど大げさに言っても言い足りないほど重要な事柄を、安心して任せられる方だとわかりました。"},
{sp:"note",t:"This account of you we have from all quarters received. Be in your chamber then at that hour, and do not take it amiss if your visitor wear a mask.”",ja:"あなたについてのこの評判は、あらゆる方面から届いております。その時刻にはお部屋にいてください。訪問者が仮面をつけていても、悪く思わないでいただきたい」"},
{sp:"watson",t:"“This is indeed a mystery,” I remarked. “What do you imagine that it means?”",ja:"「これは本当に謎だね」と私は言った。「どういう意味だと思う？」"},
{sp:"holmes",t:"“I have no data yet. It is a capital mistake to theorise before one has data.",ja:"「まだデータがない。データを持たないうちに理屈を立てるのは、大きな間違いだ。"},
{sp:"holmes",t:"Insensibly one begins to twist facts to suit theories, instead of theories to suit facts. But the note itself. What do you deduce from it?”",ja:"知らず知らずのうちに、事実に合うように理屈を立てるのではなく、理屈に合うように事実をねじ曲げはじめてしまうからね。それより手紙そのものだ。君はここから何を推理する？」"},
{t:"I carefully examined the writing, and the paper upon which it was written.",ja:"私は筆跡と、それが書かれた紙を注意深く調べた。"},
{sp:"watson",t:"“The man who wrote it was presumably well to do,” I remarked, endeavouring to imitate my companion’s processes.",ja:"「これを書いた男は、おそらく裕福だね」と私は、相棒のやり方をまねようと努めながら言った。"},
{sp:"watson",t:"“Such paper could not be bought under half a crown a packet. It is peculiarly strong and stiff.”",ja:"「こんな紙は、ひと包み半クラウン以下では買えない。妙に丈夫で、ぱりっとしている」"},
{sp:"holmes",t:"“Peculiar—that is the very word,” said Holmes. “It is not an English paper at all. Hold it up to the light.”",ja:"「妙に、まさにその言葉だ」とホームズは言った。「これはそもそもイギリスの紙じゃない。光にかざしてごらん」"},
{t:"I did so, and saw a large “E” with a small “g,” a “P,” and a large “G” with a small “t” woven into the texture of the paper.",ja:"そうしてみると、紙の地に、大文字の「E」と小文字の「g」、「P」、そして大文字の「G」と小文字の「t」が漉き込まれているのが見えた。"},
{sp:"holmes",t:"“What do you make of that?” asked Holmes.",ja:"「それをどう見る？」とホームズがたずねた。"},
{sp:"watson",t:"“The name of the maker, no doubt; or his monogram, rather.”",ja:"「製造元の名前だろうね。というより、その頭文字の組み合わせ（モノグラム）か」"},
{sp:"holmes",t:"“Not at all. The ‘G’ with the small ‘t’ stands for ‘Gesellschaft,’ which is the German for ‘Company.’ It is a customary contraction like our ‘Co.’",ja:"「まるで違う。小さな t のついた G は Gesellschaft、ドイツ語で「会社」のことだ。われわれの Co. と同じ、よくある略し方さ。"},
{sp:"holmes",t:"‘P,’ of course, stands for ‘Papier.’ Now for the ‘Eg.’ Let us glance at our Continental Gazetteer.”",ja:"P はもちろん Papier（紙）。さて Eg だ。大陸地名辞典をのぞいてみよう」"},
{t:"He took down a heavy brown volume from his shelves.",ja:"彼は棚から重い茶色の本を下ろした。"},
{sp:"holmes",t:"“Eglow, Eglonitz—here we are, Egria. It is in a German-speaking country—in Bohemia, not far from Carlsbad.",ja:"「エグロー、エグロニッツ……あった、エグリアだ。ドイツ語を話す国、ボヘミアにある。カールスバートからほど遠くない。"},
{sp:"holmes",t:"‘Remarkable as being the scene of the death of Wallenstein, and for its numerous glass-factories and paper-mills.’ Ha, ha, my boy, what do you make of that?”",ja:"『ヴァレンシュタインが死んだ土地として、また多くのガラス工場と製紙工場で知られる』。はっはっ、君、これをどう見る？」",n:"ヴァレンシュタインは三十年戦争の将軍。1634年にエーガー（チェコ語でヘプ）で暗殺された。Egria はこの町をもとにした架空の地名とされる"},
{t:"His eyes sparkled, and he sent up a great blue triumphant cloud from his cigarette.",ja:"彼の目は輝き、たばこから青い煙を得意げにもくもくと吐き上げた。"},
{sp:"watson",t:"“The paper was made in Bohemia,” I said.",ja:"「この紙はボヘミアで作られたんだ」と私は言った。"},
{choice:"では、この手紙を書いたのはどこの国の人だろう？ ヒントは手紙の一文「This account of you we have from all quarters received.」",dd:1,a:0,
 o:[{t:"A German",ja:"ドイツ人",h:1},{t:"A Frenchman",ja:"フランス人"},{t:"A Russian",ja:"ロシア人"}],
 fb:"動詞を文の最後に回すのはドイツ語の語順。ホームズの説明を聞いてみよう。"},
{sp:"holmes",t:"“Precisely. And the man who wrote the note is a German. Do you note the peculiar construction of the sentence—‘This account of you we have from all quarters received.’",ja:"「そのとおり。そして手紙を書いた男はドイツ人だ。この文の妙な組み立てに気づいたかい？『あなたについてのこの評判を、我々はあらゆる方面から受け取った』。"},
{sp:"holmes",t:"A Frenchman or Russian could not have written that. It is the German who is so uncourteous to his verbs.",ja:"フランス人やロシア人にはこうは書けない。動詞にこれほど無作法なのは、ドイツ人だけさ。",n:"ドイツ語では、文の終わりに動詞を置くことがある（received が最後に来ている）"},
{sp:"holmes",t:"It only remains, therefore, to discover what is wanted by this German who writes upon Bohemian paper and prefers wearing a mask to showing his face.",ja:"だから残るのは、ボヘミアの紙に手紙を書き、顔を見せるより仮面をつけたがるこのドイツ人が、何を望んでいるのかを突き止めることだけだ。"},
{sp:"holmes",t:"And here he comes, if I am not mistaken, to resolve all our doubts.”",ja:"そして、僕の思い違いでなければ、我々の疑問をすべて解きにご本人のお出ましだ」"},
{t:"As he spoke there was the sharp sound of horses’ hoofs and grating wheels against the curb, followed by a sharp pull at the bell. Holmes whistled.",ja:"彼がそう言ったとき、馬のひづめの鋭い音と、縁石にこすれる車輪のきしみが聞こえ、続いて呼び鈴が強く引かれた。ホームズは口笛を吹いた。"},
{sp:"holmes",t:"“A pair, by the sound,” said he. “Yes,” he continued, glancing out of the window. “A nice little brougham and a pair of beauties.",ja:"「音からすると二頭立てだ」と彼は言った。「そうだ」と窓の外をちらりと見て続けた。「しゃれた小型の箱馬車に、見事な馬が二頭。"},
{sp:"holmes",t:"A hundred and fifty guineas apiece. There’s money in this case, Watson, if there is nothing else.”",ja:"一頭150ギニーはするね。ワトソン、この事件、ほかに何もなくても金にはなるよ」"},
{sp:"watson",t:"“I think that I had better go, Holmes.”",ja:"「ホームズ、私は帰ったほうがよさそうだ」"},
{sp:"holmes",t:"“Not a bit, Doctor. Stay where you are. I am lost without my Boswell. And this promises to be interesting. It would be a pity to miss it.”",ja:"「とんでもない、ドクター。そのままいてくれ。僕のボズウェルがいないと困るんだ。それにこれは面白くなりそうだ。見逃したらもったいないよ」",n:"ボズウェルは、文学者ジョンソン博士の伝記を書いた友人。「記録係」のたとえ"},
{sp:"watson",t:"“But your client—”",ja:"「でも、君の依頼人が……」"},
{sp:"holmes",t:"“Never mind him. I may want your help, and so may he. Here he comes. Sit down in that armchair, Doctor, and give us your best attention.”",ja:"「彼のことは気にしなくていい。僕には君の助けが要るかもしれないし、彼もそうかもしれない。来たぞ。その肘掛け椅子に座って、ドクター、しっかり聞いていてくれたまえ」"},
{scene:{y:1888,w:"3月20日",era:"ヴィクトリア朝ロンドン",e:"仮面の客",m:{c:"Baker Street",r:60,pins:["Baker Street"],blink:"Baker Street"}}},
{t:"A slow and heavy step, which had been heard upon the stairs and in the passage, paused immediately outside the door. Then there was a loud and authoritative tap.",ja:"階段から廊下へと聞こえていたゆっくりとした重い足音が、扉のすぐ外で止まった。それから、大きく威厳のあるノックが響いた。"},
{sp:"holmes",t:"“Come in!” said Holmes.",ja:"「どうぞ！」とホームズが言った。"},
{t:"A man entered who could hardly have been less than six feet six inches in height, with the chest and limbs of a Hercules.",ja:"入ってきた男は、身の丈6フィート6インチ（約198センチ）を下らず、ヘラクレスのような胸と手足をしていた。"},
{t:"His dress was rich with a richness which would, in England, be looked upon as akin to bad taste.",ja:"その服装は豪華だったが、イギリスでは悪趣味に近いと見なされるような豪華さだった。"},
{t:"Heavy bands of astrakhan were slashed across the sleeves and fronts of his double-breasted coat,",ja:"ダブルの上着の袖と前身ごろには、アストラカンの毛皮の太い帯が斜めに渡され、"},
{t:"while the deep blue cloak which was thrown over his shoulders was lined with flame-coloured silk and secured at the neck with a brooch which consisted of a single flaming beryl.",ja:"肩にかけた濃い青のマントは炎の色の絹で裏打ちされ、首元を燃えるような緑柱石ひとつのブローチで留めていた。"},
{t:"Boots which extended halfway up his calves, and which were trimmed at the tops with rich brown fur, completed the impression of barbaric opulence which was suggested by his whole appearance.",ja:"ふくらはぎの半ばまである長靴は、上端が豊かな茶色の毛皮で縁取られ、全身から感じられる野蛮なまでの贅沢さという印象を仕上げていた。"},
{t:"He carried a broad-brimmed hat in his hand, while he wore across the upper part of his face, extending down past the cheekbones, a black vizard mask,",ja:"手につばの広い帽子を持ち、顔の上半分には頬骨の下まで届く黒い仮面をつけていた。"},
{t:"which he had apparently adjusted that very moment, for his hand was still raised to it as he entered.",ja:"仮面はたった今つけ直したばかりらしく、入ってきたとき、彼の手はまだそれに添えられていた。"},
{t:"From the lower part of the face he appeared to be a man of strong character, with a thick, hanging lip, and a long, straight chin suggestive of resolution pushed to the length of obstinacy.",ja:"顔の下半分から見ると、意志の強い男のようだった。厚く垂れた唇と、長くまっすぐなあごは、頑固さにまで行きつくほどの決断力を思わせた。"},
{sp:"kramm",t:"“You had my note?” he asked with a deep harsh voice and a strongly marked German accent. “I told you that I would call.”",ja:"「私の手紙は届いたか？」と彼は、低くしわがれた声と、はっきりしたドイツ語なまりでたずねた。「訪ねると伝えておいたはずだ」"},
{t:"He looked from one to the other of us, as if uncertain which to address.",ja:"彼は、どちらに話しかければよいのか迷うように、私たちふたりを見比べた。"},
{sp:"holmes",t:"“Pray take a seat,” said Holmes. “This is my friend and colleague, Dr. Watson, who is occasionally good enough to help me in my cases. Whom have I the honour to address?”",ja:"「どうぞおかけください」とホームズは言った。「こちらは友人で仕事仲間のワトソン博士。ときどき事件を手伝ってくれます。どなたとお話しする光栄に浴しているのでしょう？」"},
{sp:"kramm",t:"“You may address me as the Count Von Kramm, a Bohemian nobleman.",ja:"「ボヘミアの貴族、フォン・クラム伯爵と呼んでもらえばよい。"},
{sp:"kramm",t:"I understand that this gentleman, your friend, is a man of honour and discretion, whom I may trust with a matter of the most extreme importance. If not, I should much prefer to communicate with you alone.”",ja:"こちらの紳士、君の友人は、名誉を重んじ口の堅い人で、きわめて重要な件を任せてよい方だと理解している。そうでないなら、君とだけ話したいのだが」"},
{choice:"ワトソンの心の声。客は「君とだけ話したい」と言っている。",a:0,
 o:[{t:"“I’ll leave you two alone.”",ja:"「ふたりにしてあげよう」",h:1},{t:"“I’m staying. Holmes needs me.”",ja:"「残るよ。ホームズには私が要るんだ」",ifr:["ワトソンは腕を組んで、どっかりと座り直した。客の口元がこわばる。","「ならば、この話はなかったことにしよう」。伯爵は帽子をつかみ、重い足音で階段を下りていった。","依頼人のほうから断られる。ホームズの仕事は「秘密を守れる人」と信じてもらえて初めて始まるのだ。"]}],
 fb:"ワトソンは席を立とうとした。だが、そこでホームズが動く。"},
{t:"I rose to go, but Holmes caught me by the wrist and pushed me back into my chair.",ja:"私は帰ろうと立ち上がったが、ホームズが私の手首をつかんで椅子に押し戻した。"},
{sp:"holmes",t:"“It is both, or none,” said he. “You may say before this gentleman anything which you may say to me.”",ja:"「ふたりともか、どちらもなしかです」と彼は言った。「私に話せることは、何でもこの紳士の前で話していただいて構いません」"},
{t:"The Count shrugged his broad shoulders.",ja:"伯爵は広い肩をすくめた。"},
{sp:"kramm",t:"“Then I must begin,” said he, “by binding you both to absolute secrecy for two years; at the end of that time the matter will be of no importance.",ja:"「では、まず」と彼は言った。「おふたりに2年間、絶対に秘密を守ると約束してもらわねばならん。2年たてば、この件はもう問題にならない。"},
{sp:"kramm",t:"At present it is not too much to say that it is of such weight it may have an influence upon European history.”",ja:"今のところは、ヨーロッパの歴史を動かしかねないほど重大だと言っても言いすぎではないのだ」"},
{sp:"holmes",t:"“I promise,” said Holmes.",ja:"「約束します」とホームズは言った。"},
{sp:"watson",t:"“And I.”",ja:"「私も」"},
{sp:"kramm",t:"“You will excuse this mask,” continued our strange visitor. “The august person who employs me wishes his agent to be unknown to you,",ja:"「この仮面は許してほしい」と奇妙な客は続けた。「私を使っている高貴なお方は、使いの者の正体を君たちに知られたくないとお望みでね。"},
{sp:"kramm",t:"and I may confess at once that the title by which I have just called myself is not exactly my own.”",ja:"それに、今名乗った肩書きも、実は私のものではないと、すぐに白状しておこう」"},
{sp:"holmes",t:"“I was aware of it,” said Holmes dryly.",ja:"「存じておりました」とホームズはそっけなく言った。"},
{sp:"kramm",t:"“The circumstances are of great delicacy, and every precaution has to be taken to quench what might grow to be an immense scandal and seriously compromise one of the reigning families of Europe.",ja:"「事情はきわめて微妙で、大醜聞に育ちかねない火種を消し止め、ヨーロッパのある王家の名誉がひどく傷つかないよう、あらゆる用心をせねばならない。"},
{sp:"kramm",t:"To speak plainly, the matter implicates the great House of Ormstein, hereditary kings of Bohemia.”",ja:"はっきり言えば、この件には代々のボヘミア王、名門オルムシュタイン家が関わっている」"},
{sp:"holmes",t:"“I was also aware of that,” murmured Holmes, settling himself down in his armchair and closing his eyes.",ja:"「それも存じておりました」とホームズは、肘掛け椅子に深く身を沈めて目を閉じながら、つぶやいた。"},
{t:"Our visitor glanced with some apparent surprise at the languid, lounging figure of the man who had been no doubt depicted to him as the most incisive reasoner and most energetic agent in Europe.",ja:"客は、いくらか驚いた様子で、けだるそうにだらりと座っている男をちらりと見た。ヨーロッパでいちばん鋭い推理家で、いちばん精力的な探偵だと聞かされてきたに違いない男を。"},
{t:"Holmes slowly reopened his eyes and looked impatiently at his gigantic client.",ja:"ホームズはゆっくりと目を開け、巨大な依頼人をじれったそうに見た。"},
{choice:"仮面の客の正体は？",dd:1,a:0,
 o:[{t:"The King of Bohemia himself",ja:"ボヘミア王その人",h:1},{t:"A count who serves the King",ja:"王に仕える伯爵"},{t:"A German spy",ja:"ドイツのスパイ"}],
 fb:"ホームズは最初から見抜いていた。"},
{sp:"holmes",t:"“If your Majesty would condescend to state your case,” he remarked, “I should be better able to advise you.”",ja:"「陛下が恐れ多くもご自身の件をお話しくださるなら」と彼は言った。「もっとよいご助言ができるのですが」"},
{t:"The man sprang from his chair and paced up and down the room in uncontrollable agitation.",ja:"男は椅子から跳び上がり、抑えきれないほど動揺して、部屋の中を行ったり来たりした。"},
{t:"Then, with a gesture of desperation, he tore the mask from his face and hurled it upon the ground.",ja:"それから、やけになったような身ぶりで、顔から仮面をむしり取り、床に叩きつけた。"},
{sp:"king",t:"“You are right,” he cried; “I am the King. Why should I attempt to conceal it?”",ja:"「そのとおりだ」と彼は叫んだ。「私は王だ。なぜ隠そうなどとしたのだろう？」"},
{sp:"holmes",t:"“Why, indeed?” murmured Holmes.",ja:"「まったく、なぜでしょうね」とホームズはつぶやいた。"},
{sp:"holmes",t:"“Your Majesty had not spoken before I was aware that I was addressing Wilhelm Gottsreich Sigismond von Ormstein, Grand Duke of Cassel-Felstein, and hereditary King of Bohemia.”",ja:"「陛下がお話しになる前から、私はわかっておりました。お相手が、カッセル＝フェルシュタイン大公にしてボヘミアの世襲の王、ヴィルヘルム・ゴッツライヒ・ジギスモント・フォン・オルムシュタインであると」"},
{sp:"king",t:"“But you can understand,” said our strange visitor, sitting down once more and passing his hand over his high white forehead,",ja:"「だが、わかってもらえるだろう」と奇妙な客は、もう一度腰を下ろし、高く白い額に手をやりながら言った。"},
{sp:"king",t:"“you can understand that I am not accustomed to doing such business in my own person.",ja:"「こうした用事を自分でじかにするのには慣れていないのだ。"},
{sp:"king",t:"Yet the matter was so delicate that I could not confide it to an agent without putting myself in his power. I have come incognito from Prague for the purpose of consulting you.”",ja:"だが事が事だけに、使いの者に打ち明ければ、その者に弱みを握られることになる。それで君に相談するため、身分を隠してプラハからやってきたのだ」"},
{sp:"holmes",t:"“Then, pray consult,” said Holmes, shutting his eyes once more.",ja:"「では、どうぞご相談を」とホームズは言い、また目を閉じた。"},
{scene:{y:1888,w:"3月20日",era:"ヴィクトリア朝ロンドン",e:"一枚の写真",m:{c:"Baker Street",r:60,pins:["Baker Street"],blink:"Baker Street"}}},
{sp:"king",t:"“The facts are briefly these: Some five years ago, during a lengthy visit to Warsaw, I made the acquaintance of the well-known adventuress, Irene Adler. The name is no doubt familiar to you.”",ja:"「事実を手短に言おう。5年ほど前、ワルシャワに長く滞在していたとき、私はあの名高い女山師、アイリーン・アドラーと知り合った。名前はもちろん知っているだろう」"},
{sp:"holmes",t:"“Kindly look her up in my index, Doctor,” murmured Holmes without opening his eyes.",ja:"「ドクター、僕の索引で彼女を引いてくれたまえ」とホームズは目を開けずにつぶやいた。"},
{t:"For many years he had adopted a system of docketing all paragraphs concerning men and things, so that it was difficult to name a subject or a person on which he could not at once furnish information.",ja:"彼は長年、人や物事についての記事をすべて分類して整理する仕組みを使っていたので、彼がすぐに情報を出せない話題や人物を挙げるのは難しいほどだった。"},
{t:"In this case I found her biography sandwiched in between that of a Hebrew rabbi and that of a staff-commander who had written a monograph upon the deep-sea fishes.",ja:"このときは、彼女の経歴は、ユダヤ教のラビの経歴と、深海魚についての論文を書いた海軍中佐の経歴とのあいだにはさまっていた。"},
{sp:"holmes",t:"“Let me see!” said Holmes. “Hum! Born in New Jersey in the year 1858. Contralto—hum! La Scala, hum! Prima donna Imperial Opera of Warsaw—yes!",ja:"「どれどれ！」とホームズは言った。「ふむ！1858年ニュージャージー生まれ。コントラルト、ふむ！スカラ座、ふむ！ワルシャワ帝室歌劇場のプリマドンナ、なるほど！"},
{sp:"holmes",t:"Retired from operatic stage—ha! Living in London—quite so!",ja:"オペラの舞台から引退、ほう！ロンドン在住、そのとおり！"},
{sp:"holmes",t:"Your Majesty, as I understand, became entangled with this young person, wrote her some compromising letters, and is now desirous of getting those letters back.”",ja:"陛下は、私の理解では、この若い女性と深い仲になり、身の破滅になりかねない手紙を何通か書いて、今はその手紙を取り戻したいとお望みなのですね」"},
{sp:"king",t:"“Precisely so. But how—”",ja:"「まさにそのとおりだ。だが、どうして……」"},
{sp:"holmes",t:"“Was there a secret marriage?”",ja:"「秘密の結婚は？」"},
{sp:"king",t:"“None.”",ja:"「ない」"},
{sp:"holmes",t:"“No legal papers or certificates?”",ja:"「法的な書類や証明書は？」"},
{sp:"king",t:"“None.”",ja:"「ない」"},
{sp:"holmes",t:"“Then I fail to follow your Majesty. If this young person should produce her letters for blackmailing or other purposes, how is she to prove their authenticity?”",ja:"「では、陛下のおっしゃることがわかりかねます。その女性がゆすりなどのために手紙を持ち出したとして、それが本物だとどう証明するのです？」"},
{sp:"king",t:"“There is the writing.”",ja:"「筆跡がある」"},
{sp:"holmes",t:"“Pooh, pooh! Forgery.”",ja:"「ふん、ふん！偽造ですよ」"},
{sp:"king",t:"“My private note-paper.”",ja:"「私専用の便せんだ」"},
{sp:"holmes",t:"“Stolen.”",ja:"「盗まれたもの」"},
{sp:"king",t:"“My own seal.”",ja:"「私の印章がある」"},
{sp:"holmes",t:"“Imitated.”",ja:"「まねたもの」"},
{sp:"king",t:"“My photograph.”",ja:"「私の写真だ」"},
{sp:"holmes",t:"“Bought.”",ja:"「買ったもの」"},
{sp:"king",t:"“We were both in the photograph.”",ja:"「ふたりで一緒に写っているのだ」"},
{sp:"holmes",t:"“Oh, dear! That is very bad! Your Majesty has indeed committed an indiscretion.”",ja:"「おやおや！それはまずい！陛下はまことに軽率なことをなさいました」"},
{sp:"king",t:"“I was mad—insane.”",ja:"「どうかしていた、正気ではなかったのだ」"},
{sp:"holmes",t:"“You have compromised yourself seriously.”",ja:"「ご自身の立場をひどく危うくなさいましたね」"},
{sp:"king",t:"“I was only Crown Prince then. I was young. I am but thirty now.”",ja:"「当時はまだ皇太子だった。若かったのだ。今でもまだ30歳だ」"},
{sp:"holmes",t:"“It must be recovered.”",ja:"「取り戻さねばなりません」"},
{sp:"king",t:"“We have tried and failed.”",ja:"「やってみたが、だめだった」"},
{sp:"holmes",t:"“Your Majesty must pay. It must be bought.”",ja:"「陛下がお金を払うのです。買い取らねば」"},
{sp:"king",t:"“She will not sell.”",ja:"「彼女は売らない」"},
{sp:"holmes",t:"“Stolen, then.”",ja:"「では、盗むまで」"},
{sp:"king",t:"“Five attempts have been made. Twice burglars in my pay ransacked her house. Once we diverted her luggage when she travelled. Twice she has been waylaid. There has been no result.”",ja:"「5回試みた。2回は私が雇った泥棒が彼女の家を荒らした。1回は旅行中の荷物を横取りした。2回は待ち伏せして襲った。何も出てこなかった」"},
{sp:"holmes",t:"“No sign of it?”",ja:"「影も形も？」"},
{sp:"king",t:"“Absolutely none.”",ja:"「まったくない」"},
{sp:"holmes",t:"Holmes laughed. “It is quite a pretty little problem,” said he.",ja:"ホームズは笑った。「これはなかなかしゃれた問題ですね」と彼は言った。"},
{sp:"king",t:"“But a very serious one to me,” returned the King reproachfully.",ja:"「だが私にとっては非常に深刻なのだ」と王はとがめるように返した。"},
{sp:"holmes",t:"“Very, indeed. And what does she propose to do with the photograph?”",ja:"「ごもっともです。それで、彼女はその写真をどうするつもりなのです？」"},
{sp:"king",t:"“To ruin me.”",ja:"「私を破滅させるのだ」"},
{sp:"holmes",t:"“But how?”",ja:"「どうやって？」"},
{sp:"king",t:"“I am about to be married.”",ja:"「私は結婚を控えている」"},
{sp:"holmes",t:"“So I have heard.”",ja:"「そう伺っています」"},
{sp:"king",t:"“To Clotilde Lothman von Saxe-Meningen, second daughter of the King of Scandinavia. You may know the strict principles of her family.",ja:"「相手はスカンジナビア王の次女、クロティルデ・ロートマン・フォン・ザクセ＝メニンゲンだ。あの家のしきたりの厳しさは知っているだろう。"},
{sp:"king",t:"She is herself the very soul of delicacy. A shadow of a doubt as to my conduct would bring the matter to an end.”",ja:"彼女自身、繊細さそのもののような人だ。私の行いにほんのわずかでも疑いの影がさせば、縁談はおしまいだ」"},
{sp:"holmes",t:"“And Irene Adler?”",ja:"「それでアイリーン・アドラーは？」"},
{sp:"king",t:"“Threatens to send them the photograph. And she will do it. I know that she will do it. You do not know her, but she has a soul of steel.",ja:"「先方に写真を送ると脅している。そして彼女は本当にやる。やると私にはわかる。君は彼女を知らないが、あれは鋼の魂の持ち主だ。"},
{sp:"king",t:"She has the face of the most beautiful of women, and the mind of the most resolute of men. Rather than I should marry another woman, there are no lengths to which she would not go—none.”",ja:"最も美しい女の顔と、最も意志の固い男の頭脳を持っている。私がほかの女と結婚するくらいなら、彼女はどんなことでもやってのけるだろう。どんなことでもだ」"},
{sp:"holmes",t:"“You are sure that she has not sent it yet?”",ja:"「まだ送っていないのは確かですか？」"},
{sp:"king",t:"“I am sure.”",ja:"「確かだ」"},
{sp:"holmes",t:"“And why?”",ja:"「なぜです？」"},
{sp:"king",t:"“Because she has said that she would send it on the day when the betrothal was publicly proclaimed. That will be next Monday.”",ja:"「婚約が公に発表される日に送ると言っているからだ。それが来週の月曜日だ」"},
{sp:"holmes",t:"“Oh, then we have three days yet,” said Holmes with a yawn.",ja:"「おや、それならまだ3日ありますね」とホームズはあくびをしながら言った。"},
{sp:"holmes",t:"“That is very fortunate, as I have one or two matters of importance to look into just at present. Your Majesty will, of course, stay in London for the present?”",ja:"「ちょうどよかった。今は調べなければならない大事な件が一つ二つありますので。陛下はもちろん、しばらくロンドンにご滞在ですね？」"},
{sp:"king",t:"“Certainly. You will find me at the Langham under the name of the Count Von Kramm.”",ja:"「もちろんだ。ランガム・ホテルに、フォン・クラム伯爵の名で泊まっている」",m:{c:"Langham Hotel",r:80,pins:["Baker Street","Langham Hotel"],blink:"Langham Hotel"}},
{sp:"holmes",t:"“Then I shall drop you a line to let you know how we progress.”",ja:"「では、進み具合をお知らせする手紙を差し上げます」"},
{sp:"king",t:"“Pray do so. I shall be all anxiety.”",ja:"「そうしてくれ。心配でたまらないだろうから」"},
{sp:"holmes",t:"“Then, as to money?”",ja:"「それで、お金のことですが？」"},
{sp:"king",t:"“You have carte blanche.”",ja:"「いくらでも好きに使ってよい」"},
{sp:"holmes",t:"“Absolutely?”",ja:"「本当に、いくらでも？」"},
{sp:"king",t:"“I tell you that I would give one of the provinces of my kingdom to have that photograph.”",ja:"「あの写真が手に入るなら、王国の州を一つくれてやってもよいと言っているのだ」"},
{sp:"holmes",t:"“And for present expenses?”",ja:"「当座の費用は？」"},
{t:"The King took a heavy chamois leather bag from under his cloak and laid it on the table.",ja:"王はマントの下から重いセーム革の袋を取り出し、テーブルに置いた。"},
{sp:"king",t:"“There are three hundred pounds in gold and seven hundred in notes,” he said.",ja:"「金貨で300ポンド、紙幣で700ポンド入っている」と彼は言った。",n:"合わせて1000ポンド。当時の医者の年収の数倍にあたる大金"},
{t:"Holmes scribbled a receipt upon a sheet of his note-book and handed it to him.",ja:"ホームズは手帳の一枚に受取書を走り書きして、王に渡した。"},
{sp:"holmes",t:"“And Mademoiselle’s address?” he asked.",ja:"「それで、マドモアゼルの住所は？」と彼はたずねた。"},
{sp:"king",t:"“Is Briony Lodge, Serpentine Avenue, St. John’s Wood.”",ja:"「セント・ジョンズ・ウッド、サーペンタイン通りのブライオニー荘だ」",m:{c:"Briony Lodge",r:90,pins:["Baker Street","Langham Hotel","Briony Lodge"],blink:"Briony Lodge"}},
{t:"Holmes took a note of it.",ja:"ホームズはそれを書き留めた。"},
{sp:"holmes",t:"“One other question,” said he. “Was the photograph a cabinet?”",ja:"「もう一つだけ」と彼は言った。「写真はキャビネ判でしたか？」"},
{sp:"king",t:"“It was.”",ja:"「そうだ」"},
{sp:"holmes",t:"“Then, good-night, your Majesty, and I trust that we shall soon have some good news for you.",ja:"「では、おやすみなさいませ、陛下。じきによい知らせをお届けできると思います。"},
{sp:"holmes",t:"And good-night, Watson,” he added, as the wheels of the royal brougham rolled down the street.",ja:"おやすみ、ワトソン」と、王の箱馬車の車輪が通りを遠ざかっていくのを聞きながら、彼は付け加えた。"},
{sp:"holmes",t:"“If you will be good enough to call to-morrow afternoon at three o’clock I should like to chat this little matter over with you.”",ja:"「明日の午後3時に寄ってもらえるなら、このちょっとした件について君と話がしたいんだが」"},
{end:1}
];
