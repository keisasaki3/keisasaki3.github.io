<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SUPER歴史ノベル</title>
<link rel="icon" type="image/png" sizes="32x32" href="app-icons/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="app-icons/favicon-16.png"><link rel="apple-touch-icon" href="app-icons/apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-title" content="SUPER歴史">
<meta name="claude:viewport-fit-sides" content="cover">
<script src="https://unpkg.com/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hn.css?v=%%V_CSS%%">

<div class="app">
  <header>
    <div class="when"><span class="y" id="hY">1156</span><span class="w" id="hW"></span><span class="sep"></span><span class="era" id="hEra">平安時代末</span><span class="ev" id="hEv"></span></div>
    <nav class="menu">
      <button id="bGl" hidden>用語帳</button>
      <button id="bRoom" hidden>参加者</button>
      <button id="bSnd" aria-label="音" aria-haspopup="true" aria-expanded="false"></button>
      <button id="bCfg" aria-label="設定" aria-haspopup="true" aria-expanded="false"></button>
      <button id="bEnd">終了</button>
    </nav>
    <div class="prog"><i id="prog"></i></div>
    <div id="sndPop" class="snd-pop" hidden>
      <label class="snd-row"><span>音量</span><input id="sndVol" type="range" min="0" max="100" step="5" aria-label="音量"><b id="sndVolN"></b></label>
      <button id="sndMute" type="button"></button>
    </div>
    <div id="cfgPop" class="snd-pop" hidden>
      <div class="cfg-row"><span>文字の大きさ</span><div class="seg" role="radiogroup" aria-label="文字の大きさ"><button data-fs="s" role="radio">小</button><button data-fs="m" role="radio">中</button><button data-fs="l" role="radio">大</button></div></div>
    </div>
  </header>
  <div class="mapwrap" id="mapwrap">
    <svg id="map" aria-label="出来事の場所を示す地図"><rect width="100%" height="100%" fill="var(--sea)"/><g id="landG"><clipPath id="landClip"><path id="landP" class="land" d="%%MAP%%"/></clipPath><use href="#landP"/><g id="terrG" clip-path="url(#landClip)"></g></g><g id="ovG"></g></svg>
    <div class="talk" id="talk" hidden></div>
    <div class="gayaLayer" id="gayaLayer"></div>
    <div class="card" id="card"></div>
    <div class="pics" id="pics"></div>
  </div>
  <div class="novel" id="novel">
    <div class="page" id="page"><div class="col">
      <div id="past"></div>
      <div id="cur"><div class="who" id="who" hidden></div><div id="content"></div><div class="choices" id="choices"></div><div id="fbx"></div></div>
    </div></div>
    <div class="gayaPal" id="gayaPal" hidden></div>
    <div class="look-note" id="lookNote" hidden>資料を見てるプレイヤーがいるよ。ちょっと待ってね</div>
    <div class="ctrl"><button class="back" id="bk" hidden>◀ 戻る</button><button class="gyb" id="bGaya" aria-label="ガヤを飛ばす">ガヤ</button><button class="gyb rep" id="bRep" hidden>報告する</button><div class="next" id="nx" hidden>タップで次へ</div></div>
  </div>
</div>
<div id="sheetRoot"></div>
<div id="ovRoot"></div>
