<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SUPER歴史ノベル</title>
<link rel="icon" type="image/png" sizes="32x32" href="app-icons/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="app-icons/favicon-16.png"><link rel="apple-touch-icon" href="app-icons/apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-title" content="SUPER歴史">
<meta name="claude:viewport-fit-sides" content="cover">
<script src="https://unpkg.com/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: three panes stacked. Header (year/era + menu), map stage (camera follows the script), novel pane (text + choices). */
:root{
  --bg:#ffffff; --sea:#e8edf1; --land:#ffffff; --coast:#7d858e; --ink:#1b1d21; --muted:#6a7079; --line:#e1e4e8;
  --accent:#a3282a; --if:#6a55a8; --grid:rgba(60,80,100,.13); --ok:#2e7d4a; --halo:rgba(255,255,255,.92); --sheet:#ffffff; --veil:rgba(20,22,26,.35);
  --f:system-ui,-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141619; --sea:#191d22; --land:#262a30; --coast:#59616b; --ink:#e8e9eb; --muted:#9aa0a8; --line:#2b3037; --grid:rgba(200,215,230,.08);
  --accent:#e8726a; --if:#b3a1dc; --ok:#6cc08a; --halo:rgba(22,24,27,.9); --sheet:#1e2125; --veil:rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141619; --sea:#191d22; --land:#262a30; --coast:#59616b; --ink:#e8e9eb; --muted:#9aa0a8; --line:#2b3037; --grid:rgba(200,215,230,.08);
  --accent:#e8726a; --if:#b3a1dc; --ok:#6cc08a; --halo:rgba(22,24,27,.9); --sheet:#1e2125; --veil:rgba(0,0,0,.5); color-scheme:dark}
html,body{height:100%}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.8;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column}
/* header */
header{position:relative;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding-block:8px 9px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.when{flex:1;min-width:0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;line-height:1.3}
.when .y{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
.when .w{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.when .sep{width:1px;height:14px;background:var(--line);align-self:center}
.when .era{font-size:14px;font-weight:700}
.when .ev{font-size:13px;color:var(--muted)}
.prog{position:absolute;left:0;right:0;bottom:-1px;height:2px}
.prog i{display:block;height:100%;width:0;background:var(--ink);transition:width .6s ease}
@media (max-width:520px){.when .sep{display:none}.when .ev{flex-basis:100%}}
.menu{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.menu button{font-size:12.5px;padding:5px 9px;border:0;border-radius:4px;color:var(--muted);white-space:nowrap}
.menu button:hover{color:var(--ink);background:var(--sea)}
.menu button.on{color:var(--ink);font-weight:700}
#bSnd{display:inline-flex;align-items:center;justify-content:center;min-width:36px}
#bSnd svg{width:18px;height:18px;display:block}
.snd-pop{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(100% + 6px);z-index:40;background:var(--sheet);color:var(--ink);border:2px solid var(--ink);border-radius:12px;padding:12px 14px;display:grid;gap:10px;min-width:230px;box-shadow:0 6px 0 rgba(0,0,0,.12)}
.snd-row{display:grid;grid-template-columns:auto 1fr 2.6em;align-items:center;gap:10px;font-size:13px;font-weight:700}
.snd-row input{width:100%;accent-color:var(--ink)}
.snd-row b{text-align:right;font-variant-numeric:tabular-nums}
#sndMute{font:inherit;font-size:13px;font-weight:700;padding:8px 10px;border:2px solid var(--ink);border-radius:999px;background:transparent;color:var(--ink);cursor:pointer}
/* map */
.mapwrap{position:relative;flex:1;min-height:0;background:var(--sea);overflow:hidden;cursor:pointer}
#map{position:absolute;inset:0;width:100%;height:100%;display:block}
.land{fill:var(--land);stroke:var(--coast);stroke-width:.9;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.pin circle.dot{fill:var(--ink);stroke:var(--halo);stroke-width:2}
.pin text,.arw text{font-family:var(--f);font-size:12.5px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--halo);stroke-width:4px;stroke-linejoin:round}
.pin.cur circle.dot{fill:var(--accent)}
.pin.cur text{fill:var(--accent);font-size:14px;font-weight:800}
.ring{fill:none;stroke:var(--accent);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ring 1.6s ease-out infinite}
@keyframes ring{from{transform:scale(.5);opacity:1}to{transform:scale(2.6);opacity:0}}
.arw path.ln{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.arw path.hd{stroke:none}
.arw.s path.ln{stroke:var(--accent)} .arw.s path.hd{fill:var(--accent)} .arw.s text{fill:var(--accent)}
.arw.o path.ln{stroke:var(--muted);stroke-width:2.2} .arw.o path.hd{fill:var(--muted)} .arw.o text{fill:var(--muted)}
.arw.if path.ln{stroke:var(--if);stroke-dasharray:7 6} .arw.if path.hd{fill:var(--if)} .arw.if text{fill:var(--if)}
[hidden]{display:none!important}
.grat line{stroke:var(--grid);stroke-width:1}
.grat text{font-family:var(--f);font-size:10px;fill:var(--muted);opacity:.8;font-variant-numeric:tabular-nums}
.scale path{fill:none;stroke:var(--ink);stroke-width:1.2}
.scale text{font-size:10.5px;fill:var(--ink);opacity:1}
/* speaker: portrait + name + line + source */
.sp{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.face{width:72px;height:88px;border-radius:6px;object-fit:cover;object-position:50% 18%;background:var(--line);display:block}
.face.sil{display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:var(--muted);background:transparent;border:1px solid var(--line)}
.spb{display:flex;flex-direction:column;gap:4px;min-width:0}
.spn{font-size:13.5px;font-weight:700;letter-spacing:.1em;padding-bottom:3px;border-bottom:1px solid var(--line);align-self:flex-start;padding-right:18px}
.src{font-size:11.5px;line-height:1.6;color:var(--muted);margin-top:2px}
.nar{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.txt.nar{display:block}/* 本文の地の文は1つの流れ（用語ボタンが格子のマスに分かれる不具合 2026-11-05） */
.fc{width:40px;height:48px;border-radius:4px;object-fit:cover;object-position:50% 18%;background:var(--line);display:block;margin-top:6px}
.fc.sil{display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--muted);border:1px solid var(--line);background:transparent}
.past .face{width:44px;height:54px}.past .src{display:none}
@media (min-width:900px){.face{width:88px;height:108px}}
/* speech window over the map */
.talk{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);z-index:4;width:min(600px,calc(100% - 24px));display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;pointer-events:none}
.talk.on{animation:tk .25s ease}
@keyframes tk{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translateX(-50%)}}
.tk-f{display:flex;flex-direction:column;gap:5px;align-items:stretch}
.tk-f .face{border:2px solid var(--ink);border-radius:4px;background:var(--bg)}
.tk-f .face.sil{border:2px solid var(--ink);background:var(--bg)}
.tk-n{background:var(--bg);border:1px solid var(--ink);border-radius:3px;font-size:12.5px;font-weight:700;text-align:center;padding:1px 4px;letter-spacing:.08em;white-space:nowrap}
.tk-b{background:var(--bg);border:2px solid var(--ink);border-radius:6px;padding:10px 14px;min-height:76px}
.tk-b .txt{white-space:pre-line;font-size:16.5px;line-height:1.85;font-weight:600}
.said .spn{font-weight:700;margin-right:.3em;border:0;padding:0;font-size:inherit;letter-spacing:0}
@media (min-width:900px){.tk-b .txt{font-size:18px}}
/* place pictures on the map */
.pics{position:absolute;right:10px;bottom:8px;z-index:3;opacity:0;transition:opacity .4s;pointer-events:none}
.pics.on{opacity:1;pointer-events:auto}
.pc{display:flex;align-items:center;gap:7px;height:32px;padding:3px 10px 3px 3px;background:var(--bg);border:1px solid var(--line);border-radius:6px;font-size:12px;color:var(--ink)}
.pc img{width:34px;height:24px;object-fit:cover;border-radius:3px;display:block}
.lb{position:fixed;inset:0;z-index:40;background:rgba(12,13,15,.88);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px))}
.lb-in{width:min(920px,100%);max-height:100%;display:flex;flex-direction:column;gap:10px;color:#eceef0}
.lb figure{margin:0;display:flex;flex-direction:column;gap:8px;min-height:0}
.lb img{max-width:100%;max-height:68vh;object-fit:contain;align-self:center;border-radius:4px}
.lb figcaption{display:grid;gap:2px;font-size:13.5px;line-height:1.6}
.lb figcaption span{color:#c9ccd1}
.lb figcaption small{color:#9aa0a8;font-size:11.5px}
.lb-nav{display:flex;align-items:center;gap:14px;font-size:13px;color:#c9ccd1}
.lb-nav button{min-width:44px;min-height:44px;border:1px solid rgba(255,255,255,.25);border-radius:8px;font-size:18px;color:#eceef0}
.lb-nav .lbx{margin-left:auto;font-size:13.5px;padding:0 16px}
.cred{font-size:12px;color:var(--muted);line-height:1.7}
.cred summary{cursor:pointer;font-size:13px}
.cred ul{padding-left:1.2em;margin:8px 0}
.cred p{margin:4px 0 0}
.maptag{position:absolute;left:12px;bottom:10px;font-size:11px;color:var(--muted);pointer-events:none}
/* novel */
.novel{flex:0 0 42%;min-height:0;display:flex;flex-direction:column;border-top:1px solid var(--line);background:var(--bg);cursor:pointer}
@media (min-width:900px){.novel{flex-basis:36%}}
.page{flex:1;min-height:0;overflow-y:auto;padding-block:14px 6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
#past{display:flex;flex-direction:column;gap:14px}
#past:empty{display:none}
.past{opacity:.45;display:flex;flex-direction:column;gap:8px}
.past .txt,.past .fb,.past .ifr,.past .ifr p{animation:none}
#cur{display:flex;flex-direction:column;gap:10px}
.who{align-self:flex-start;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.08em;display:flex;align-items:center;gap:8px}
.who::before{content:"";width:16px;height:1px;background:currentColor}
.txt{font-size:17px;line-height:1.95;letter-spacing:.01em}
.txt.quote{font-size:19px;font-weight:600}
.fb{font-size:15px;line-height:1.85;animation:in .3s ease}
.note{display:block;font-size:12.5px;color:var(--muted);margin-top:4px}
@keyframes in{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.term{color:inherit;border-bottom:1.5px dotted var(--ink);padding:0 1px;line-height:1.4;font:inherit;letter-spacing:inherit;display:inline;cursor:pointer;border-radius:0}
.term.imp{font-weight:800}
.kind{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.1em}
.t-face .face{width:72px;height:88px;margin-top:6px}
.tpics{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:12px}
.tpics button{display:grid;gap:4px;text-align:left;font-size:12.5px;color:var(--muted)}
.tpics img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.pin.tap{cursor:pointer}.pin .hit{fill:transparent;stroke:none}
.look-note{margin:0 auto 6px;max-width:720px;text-align:center;font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;background:var(--sea);color:var(--ink)}
#bCfg{display:inline-flex;align-items:center;justify-content:center;min-width:36px}#bCfg svg{width:18px;height:18px;display:block}
.cfg-row{display:grid;gap:8px;font-size:13px;font-weight:700}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:2px solid var(--ink);border-radius:999px;overflow:hidden}
.seg button{padding:7px 0;font-weight:700}.seg button[aria-checked="true"]{background:var(--ink);color:var(--bg)}
html[data-fs="s"] .txt{font-size:15px}html[data-fs="s"] .txt.quote{font-size:16.5px}html[data-fs="s"] .tk-b .txt{font-size:14.5px}
html[data-fs="l"] .txt{font-size:20.5px}html[data-fs="l"] .txt.quote{font-size:22.5px}html[data-fs="l"] .tk-b .txt{font-size:19.5px}
.rep-ta{width:100%;box-sizing:border-box;min-height:110px;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--sheet);color:var(--ink)}
.rep-q{border-left:3px solid var(--line);padding:4px 10px;color:var(--muted);font-size:14px;white-space:pre-line}
.term.dug{border-bottom-style:solid;border-bottom-color:var(--muted)}
.blank{display:inline-block;min-width:4.5em;text-align:center;border:1px solid var(--ink);border-radius:4px;padding:0 6px;line-height:1.5;margin:0 2px}
.blank.ok{border-color:var(--ok);color:var(--ok)}.blank.ng{border-color:var(--accent);color:var(--accent)}
.choices{display:grid;gap:6px}
.opt{display:flex;gap:12px;align-items:baseline;text-align:left;padding:10px 14px 10px 12px;border:1px solid var(--line);border-radius:4px;font-size:15px;line-height:1.6;background:var(--bg);transition:border-color .15s,background .15s}
.opt .num{flex:none;font-size:12px;color:var(--muted);width:1.2em}
.opt:hover:not([disabled]){background:var(--sea)}
.opt:hover{border-color:var(--ink)}
.opt.ok{border-color:var(--ok);color:var(--ok)}
.opt.ng{border-color:var(--accent);color:var(--accent)}
.opt.ifp{border-color:var(--if);color:var(--if)}
.opt[disabled]{cursor:default}
.opt[disabled]:not(.ok):not(.ng):not(.ifp){opacity:.4}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:0 7px;border-radius:4px;margin-right:6px;vertical-align:1px;border:1px solid currentColor}
.tag.ok{color:var(--ok)} .tag.ng{color:var(--accent)} .tag.rt{color:var(--if)}
.ifr{border-left:2px dashed var(--if);padding:2px 0 2px 12px;display:grid;gap:6px;animation:in .3s ease}
.ifh{font-size:11.5px;font-weight:700;color:var(--if);letter-spacing:.12em}
.ifr p{margin:0;font-size:15.5px;line-height:1.85;animation:in .3s ease}
.said{font-size:15px}
#fbx{display:grid;gap:10px}
.ctrl{display:flex;justify-content:space-between;align-items:center;max-width:720px;width:100%;margin:0 auto;padding-block:4px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;min-height:38px}
.back{font-size:13px;color:var(--muted);padding:4px 6px}
.back:hover{color:var(--ink)}
.next{font-size:12.5px;color:var(--muted);margin-left:auto}
.next::after{content:"";display:inline-block;width:0;height:0;margin-left:8px;border-left:5px solid transparent;border-right:5px solid transparent;border-top:7px solid var(--accent);animation:bob .9s infinite}
@keyframes bob{50%{transform:translateY(2px)}}
/* sheet */
.veil{position:fixed;inset:0;background:var(--veil);z-index:40;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;z-index:41;background:var(--sheet);border:1px solid var(--line);display:flex;flex-direction:column;animation:up .25s ease;
  left:0;right:0;bottom:0;max-height:78%;border-radius:14px 14px 0 0;padding:16px max(18px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
@media (min-width:760px){.sheet{left:auto;top:0;bottom:0;width:400px;max-height:none;border-radius:0;animation:side .25s ease;padding:20px 22px calc(20px + env(safe-area-inset-bottom,0px))}}
@keyframes up{from{transform:translateY(30px);opacity:0}}
@keyframes side{from{transform:translateX(30px);opacity:0}}
.crumb{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 6px;align-items:center}
.crumb button{color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.sh-body{overflow-y:auto;min-height:0;flex:1;margin-top:10px}
.sh-body h2{font-size:22px;margin:0;line-height:1.4;text-wrap:balance}
.rd{font-size:13px;color:var(--muted)}
.yr{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 6px;margin-left:8px;font-variant-numeric:tabular-nums}
.sh-body p{font-size:15.5px;line-height:1.95;margin:12px 0}
.hint{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.close{margin-top:12px;padding:10px;border:1px solid var(--ink);border-radius:8px;font-weight:600}
.glist{display:grid;gap:4px;margin-top:8px}
.glist button{display:flex;justify-content:space-between;gap:8px;text-align:left;padding:8px 10px;border-radius:6px;border:1px solid var(--line)}
.glist small{color:var(--muted)}
.score{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.score b{color:var(--ink);font-variant-numeric:tabular-nums}
/* overlays */
.ov{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;padding:calc(32px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ov-in{max-width:560px;margin:0 auto;display:grid;gap:18px}
.ov h1{font-size:clamp(28px,6vw,38px);line-height:1.3;margin:0;text-wrap:balance}
.ov .sub{color:var(--muted);font-size:13px;letter-spacing:.12em}
.ov h3{font-size:14px;margin:6px 0 0;letter-spacing:.06em}
.how{display:grid;gap:8px}
.how div{display:grid;grid-template-columns:5.5em 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px;line-height:1.75}
.how b{font-size:13px}
.go{padding:13px;border-radius:10px;background:var(--ink);color:var(--bg);font-weight:800;font-size:16px;letter-spacing:.1em}
.ghost{padding:11px;border-radius:10px;border:1px solid var(--line);color:var(--muted)}
.muted{color:var(--muted);font-size:13.5px;margin:0}
.ord{display:grid;gap:8px}
.ord button{display:flex;gap:12px;align-items:center;text-align:left;padding:11px 14px;border:1px solid var(--line);border-radius:8px;font-size:15px;line-height:1.6}
.ord button .n{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.ord button.done{border-color:var(--ink)}.ord button.done .n{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ord button.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{border:1px solid var(--line);border-radius:8px;padding:12px;text-align:center}
.stats b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.stats small{color:var(--muted);font-size:12px}
.ov.sel{background:linear-gradient(90deg,var(--bg) 0,var(--bg) 34%,color-mix(in srgb,var(--bg) 70%,transparent) 60%,transparent 100%);display:flex;align-items:center}
@media (max-width:640px){.ov.sel{background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 92%,transparent),color-mix(in srgb,var(--bg) 80%,transparent))}}

.eras .era{width:100%;display:grid;grid-template-columns:5.5em 7.5em 1fr;align-items:baseline;gap:10px;text-align:left;padding:9px 0;border-bottom:1px solid var(--line)}
.eras .era .en{font-size:20px;font-weight:700;letter-spacing:.06em}
.eras .era .ey{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.eras .era .et{font-size:12.5px;color:var(--muted);justify-self:end}
.eras .era.off .en{color:var(--muted);font-weight:500}

.eras .era.on .en{font-size:26px}

.lnk{font-size:13px;color:var(--ink);text-decoration:underline;text-underline-offset:3px}

/* ---------- play skin (original): ink-outlined cards with an offset shadow, vermilion seal accents, scene title cards, banner pins ---------- */
:root{--h:"Dela Gothic One",var(--f);--u:"Zen Maru Gothic",var(--f);--shadow:var(--ink);--paper:var(--bg);--genji:#ffffff;--heike:#c8372d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--shadow:#000;--genji:#e8e9eb;--heike:#e0574b}}
:root[data-theme="dark"]{--shadow:#000;--genji:#e8e9eb;--heike:#e0574b}
.app{background:var(--sea);padding:8px;gap:8px;box-sizing:border-box}
header,.novel{background:var(--paper);border:2px solid var(--ink);border-radius:14px;box-shadow:3px 3px 0 var(--shadow)}
.mapwrap{border:2px solid var(--ink);border-radius:14px;box-shadow:3px 3px 0 var(--shadow)}
.novel{border-top:2px solid var(--ink)}
header{padding-block:8px 12px}
.when .y{font-family:var(--h);font-weight:400;font-size:26px;letter-spacing:.02em}
.when .y:not(:empty)::after{content:"年";font-size:13px;margin-left:2px}
.when .era{font-family:var(--u);font-weight:700}
.when .era:not(:empty){background:var(--accent);color:#fff;border-radius:4px;padding:1px 8px;font-size:12.5px}
.when .ev,.when .w{font-family:var(--u)}
.menu button{font-family:var(--u);font-weight:700;border:2px solid var(--ink);border-radius:999px;color:var(--ink);padding:3px 11px;background:var(--paper)}
.menu button:hover{background:var(--ink);color:var(--paper)}
/* stage dots instead of a bar */
.prog{left:16px;right:16px;bottom:5px;height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.prog i{background:var(--accent);border-radius:4px}
/* talk window */
.tk-b{border:2px solid var(--ink);border-radius:14px;box-shadow:3px 3px 0 var(--shadow);padding:12px 16px;position:relative}
.tk-b::before{content:"";position:absolute;left:-9px;top:22px;width:14px;height:14px;background:var(--paper);border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg)}
.tk-b .txt{font-weight:500}
.tk-f .face{border:2px solid var(--ink);border-radius:12px;box-shadow:3px 3px 0 var(--shadow)}
.tk-f .face.sil{border-radius:12px;font-family:var(--h);font-weight:400}
.tk-n{font-family:var(--u);font-weight:700;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:2px 8px}
.talk.on .tk-f{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.said .spn{color:var(--accent)}
.next,.back{font-family:var(--u);font-weight:700}
.pc{font-family:var(--u);font-weight:700;border:2px solid var(--ink);border-radius:999px;box-shadow:2px 2px 0 var(--shadow);padding:3px 12px 3px 3px}
.pc img{border-radius:999px;width:26px;height:26px}
.pin text,.arw text{font-family:var(--u);font-weight:700}
/* banner pin: flag over the highlighted place */
.flag .pole{stroke:var(--ink);stroke-width:1.6}
.flag .cloth{stroke:var(--ink);stroke-width:1.4;transform-box:fill-box;transform-origin:left center;animation:wave 1.4s ease-in-out infinite}
.flag.w .cloth{fill:var(--genji)}.flag.r .cloth{fill:var(--heike)}.flag.k .cloth{fill:#7a5cc0}
@keyframes wave{50%{transform:skewY(-6deg) scaleX(.92)}}
/* scene title card */
.card{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);z-index:5;display:flex;justify-content:center;pointer-events:none}
.card-in{background:var(--paper);border:2px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--shadow);padding:14px 26px 16px;text-align:center;animation:card 2.4s ease forwards}
.card-in .cy{font-family:var(--h);font-size:40px;line-height:1.1}
.card-in .cy small{font-size:16px;margin-left:3px}
.card-in .cw{font-family:var(--u);font-size:13px;color:var(--muted);margin-top:2px}
.card-in .ce{font-family:var(--u);font-weight:700;font-size:17px;margin-top:8px;display:inline-block;background:var(--accent);color:#fff;border-radius:6px;padding:2px 12px}
@keyframes card{0%{opacity:0;transform:translateY(14px) scale(.96)}12%{opacity:1;transform:none}78%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-8px)}}
/* era select as stage select */
.ov.sel{background:color-mix(in srgb,var(--sea) 84%,transparent)!important}
html.title-mode header,html.title-mode .novel{display:none}
.sel .sub{font-family:var(--h);font-size:22px;letter-spacing:.12em;color:var(--ink)}
.sel-in .eras{gap:10px;max-width:440px}
.sel .app-name{margin:0;font-family:var(--h);font-size:30px;line-height:1.2;letter-spacing:.04em;color:var(--ink)}
.sel .app-name b{color:var(--accent);font-weight:900;letter-spacing:.06em}
.eras .era{background:var(--paper);border:2px solid var(--ink)!important;border-radius:12px;padding:8px 14px!important;box-shadow:3px 3px 0 var(--shadow);grid-template-columns:2.4em 1fr auto!important;box-sizing:border-box;width:100%}
.eras .era .no{font-family:var(--h);font-size:13px;width:1.8em;height:1.8em;border-radius:50%;display:grid;place-items:center;border:2px solid var(--ink)}
.eras .era .en{font-family:var(--u);font-size:19px!important;white-space:nowrap}
.eras .era.on{transition:transform .15s}
.eras .era.on:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--shadow)}
.eras .era.on .no{background:var(--accent);border-color:var(--accent);color:#fff}
.eras .era.on .et{font-family:var(--u);background:var(--accent);color:#fff!important;border-radius:999px;padding:1px 10px}
.eras .era.off{opacity:1;box-shadow:none;border-color:var(--line)!important;color:var(--muted)}
.eras .era.off .no{border-color:var(--line)}
.eras .era.off .en{color:var(--muted)}
.eras .era.off .ey{display:none}
@media (max-width:640px){.tk-b{padding:9px 12px}.tk-b .txt{font-size:15px;line-height:1.75}.tk-f .face{width:64px;height:78px}.card-in .cy{font-size:32px}}

.gy small{font-size:10.5px;color:var(--muted);margin-left:6px;font-weight:500}

.gyb{font-family:var(--u);font-weight:700;font-size:12.5px;border:2px solid var(--ink);border-radius:999px;padding:2px 14px;background:var(--paper);box-shadow:2px 2px 0 var(--shadow)}

<script>
const G={
"奥州藤原氏":{r:"おうしゅうふじわらし",y:"1087〜1189",d:"平泉（いまの岩手県）を拠点に、東北地方を約100年治めた一族。清衡・基衡・秀衡・泰衡の4代。金と馬で栄え、中尊寺金色堂を建てた。{源義経}をかくまったが、1189年に{源頼朝}に滅ぼされた。"},
"院政":{r:"いんせい",y:"1086〜",d:"天皇が位をゆずって{上皇}となり、そのまま政治の実権を握るしくみ。1086年に白河上皇が始めた。それまで藤原氏が動かしていた{摂関政治}を押さえる形で広がった。上皇と天皇、貴族どうしの対立が{保元の乱}の火種になる。"},
"上皇":{r:"じょうこう",d:"位をゆずった元の天皇。出家すると法皇と呼ばれる（{後白河法皇}など）。"},
"摂関政治":{r:"せっかんせいじ",y:"10〜11世紀",d:"藤原氏が娘を天皇の后にし、摂政・関白として政治を動かしたしくみ。11世紀前半の藤原道長・頼通のころが全盛期。のちに{平清盛}もよく似た手を使う。"},
"武士":{r:"ぶし",d:"武芸を仕事とし、地方で土地を開いたり守ったりした人々。一族や家来で武士団をつくった。都の争いに用心棒として呼ばれるうちに力をつけた。代表格が平氏と源氏。"},
"保元の乱":{r:"ほうげんのらん",y:"1156",d:"崇徳上皇と後白河天皇の対立に、貴族や武士が分かれて戦った争い。後白河天皇の側が勝った。{平清盛}と源義朝はどちらも勝った側。都の争いを武士の力が決めた最初の大事件。"},
"平治の乱":{r:"へいじのらん",y:"1159",d:"{保元の乱}のあとの主導権争い。{平清盛}が源義朝を破り、平氏の時代が始まる。義朝の子の{源頼朝}は伊豆へ流された。"},
"平清盛":{t:"人",r:"たいらのきよもり",y:"1118〜1181",d:"平氏の棟梁。{保元の乱}と{平治の乱}に勝ち、武士として初めて{太政大臣}になった。娘の徳子を高倉天皇の后にし、孫を安徳天皇に立てた。{日宋貿易}にも力を入れた。"},
"太政大臣":{r:"だいじょうだいじん",d:"朝廷の最高の官職。ふつうは上級貴族がつく地位で、武士でなったのは{平清盛}が初めて（1167年）。"},
"日宋貿易":{r:"にっそうぼうえき",d:"中国の宋との貿易。{平清盛}は大輪田泊（いまの神戸港のあたり）を整え、宋銭や陶磁器などを輸入して平氏の富にした。"},
"後白河法皇":{t:"人",r:"ごしらかわほうおう",y:"1127〜1192",d:"{保元の乱}に勝った天皇で、のちに{上皇}として{院政}を行った。平氏や源氏と組んだり対立したりしながら、30年以上も政治の中心にいた。1179年には{平清盛}に幽閉されている。"},
"源頼朝":{t:"人",r:"みなもとのよりとも",y:"1147〜1199",d:"源義朝の子。{平治の乱}のあと伊豆に流され、1180年に挙兵した。{鎌倉}を本拠に関東の武士をまとめ、{守護}と{地頭}を置き、1192年に{征夷大将軍}になった。"},
"以仁王":{t:"人",r:"もちひとおう",d:"{後白河法皇}の皇子。1180年、全国の源氏に平氏を討てと呼びかける命令（令旨）を出した。本人はすぐに討たれたが、この呼びかけが{源頼朝}らの挙兵につながった。"},
"鎌倉":{t:"地",r:"かまくら",d:"三方を山、一方を海に囲まれた守りやすい土地で、源氏ゆかりの地。{源頼朝}がここを本拠にし、{鎌倉幕府}の名前の由来になった。"},
"侍所":{r:"さむらいどころ",y:"1180",d:"{御家人}をまとめ、軍事と警察を受けもつ役所。{源頼朝}が鎌倉に入ってすぐに置いた。のちに政治を扱う政所、裁判を扱う問注所も整えられた。"},
"源義経":{t:"人",r:"みなもとのよしつね",y:"1159〜1189",d:"{源頼朝}の弟。一ノ谷、屋島、{壇ノ浦の戦い}で平氏を破った。のちに頼朝と対立し、奥州で討たれた。"},
"壇ノ浦の戦い":{r:"だんのうらのたたかい",y:"1185",d:"いまの山口県下関の海で行われた源平最後の戦い。平氏は滅び、幼い安徳天皇も海に沈んだ。"},
"守護":{r:"しゅご",y:"1185〜",d:"国ごとに置かれ、軍事と警察を受けもった役職。{御家人}から任命された。"},
"地頭":{r:"じとう",y:"1185〜",d:"{荘園}や公領ごとに置かれ、土地の管理と年貢の取り立てを受けもった役職。{御家人}が任命された。武士が土地を実際に握る足場になった。"},
"荘園":{r:"しょうえん",d:"貴族や寺社が持つ私有地。地方の武士は土地を守るため、有力者に土地を寄進して保護を受けることも多かった。{地頭}はこの荘園にも入りこんでいく。"},
"御恩と奉公":{r:"ごおんとほうこう",d:"将軍と{御家人}の主従関係。御恩は、先祖からの土地を保証すること（本領安堵）と、手柄に新しい土地を与えること（新恩給与）。奉公は、戦いのときに命がけで戦うこと（「いざ鎌倉」）。土地を仲立ちにした約束なので、与える土地がなくなると揺らぐ。"},
"御家人":{r:"ごけにん",d:"将軍と主従関係を結んだ武士。{御恩と奉公}で将軍とつながる。"},
"征夷大将軍":{r:"せいいたいしょうぐん",d:"もとは東北の蝦夷を討つ軍の指揮官の位。{源頼朝}が1192年に任じられてから、武士の政府のトップを指す位になった。"},
"鎌倉幕府":{r:"かまくらばくふ",y:"1185〜1333",d:"{源頼朝}が{鎌倉}に開いた武士の政府。始まりは、{守護}と{地頭}を置いた1185年とみる考え方がいまは有力。1333年に滅びる。"},
"北条政子":{t:"人",r:"ほうじょうまさこ",y:"1157〜1225",d:"{源頼朝}の妻。頼朝の死後も「尼将軍」と呼ばれて幕府を支えた。{承久の乱}では御家人を前に頼朝の御恩を説いたと伝わる。"},
"執権":{r:"しっけん",d:"将軍を補佐し、幕府の政治をとりしきる地位。北条時政が初代で、以後は北条氏が代々受け継いだ。実質的な幕府のトップ。"},

/* 本文の語: {語} と、辞書にある語（2文字以上）の各行で最初の1回を押せるようにする。

const AUTO_RE=new RegExp(Object.keys(G).filter(k=>k.length>=2).sort((a,b)=>b.length-a.length).join("|"),"g");

function md(t,see,self){
  const src=String(t),parts=[],used=new Set(self?[self]:[]);let last=0;
  src.replace(/\{([^}|]+)(?:\|([^}]+))?\}/g,(m,a,b,off)=>{parts.push([src.slice(last,off),null]);parts.push([a,b||a]);last=off+m.length;return m;});
  parts.push([src.slice(last),null]);
  const mark=k=>{used.add(k);if(see&&!st.seen.includes(k))st.seen.push(k);};
  return parts.map(([x,k])=>{
    if(k){if(!G[k]||k===self)return esc(x);mark(k);return termBtn(esc(x),k);}
    return esc(x).replace(AUTO_RE,w=>{if(used.has(w))return w;mark(w);return termBtn(w,w);});
  }).join("").replace("〔？〕",'<span class="blank" id="blank">？</span>');
}

let typer=null;
function typeIn(el,done){
  if(typer)typer.finish(true);
  $("nx").hidden=true;
  const fin=()=>{if(!st.wait&&st.v==="play")$("nx").hidden=false;done&&done();toBottom();};
  if(!el||matchMedia("(prefers-reduced-motion:reduce)").matches){fin();return;}
  const nodes=[];const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode())nodes.push(n);
  const full=nodes.map(x=>x.nodeValue);nodes.forEach(x=>x.nodeValue="");
  let ni=0,ci=0,cnt=0;
  const id=setInterval(()=>{
    if(ni>=nodes.length){t.finish();return;}
    ci++;nodes[ni].nodeValue=full[ni].slice(0,ci);cnt++;
    const ch=full[ni][ci-1];if(cnt%2===0&&ch&&!/[\s、。「」]/.test(ch))tone(1150,.02,.012,"square");
    if(ci>=full[ni].length){ni++;ci=0;}
    if(cnt%8===0)toBottom();
  },42);
  const t={finish(silent){clearInterval(id);nodes.forEach((x,i)=>x.nodeValue=full[i]);typer=null;fin();}};
  typer=t;
}
function lockOpts(){document.querySelectorAll("#choices .opt").forEach(b=>b.disabled=true);}
function choiceHTML(s,j,sub){
  const o=s.o[j];

  const n=o.ifr.length;let h=`<div class="ifr"><div class="ifh">IFルート</div>${o.ifr.slice(0,Math.min(sub+1,n)).map(l=>`<p>${md(l,true)}</p>`).join("")}</div>`;
  if(sub>=n)h+=`<div class="fb"><span class="tag rt">本筋へ</span>史実で選ばれたのは${esc(s.o[s.a].t)}。${md(s.fb,true)}</div>`;
  return h;
}
function drawChoice(s){
  const j=st.ans[st.i],o=s.o[j],bs=document.querySelectorAll("#choices .opt");
  bs.forEach(b=>b.classList.remove("ok","ifp"));
  if(o.h)bs[j].classList.add("ok");else{bs[j].classList.add("ifp");if(st.sub>=o.ifr.length)bs[s.a].classList.add("ok");}

function answerChoice(s,j,sub,quiet){

}
function answerRecall(s,j,quiet){
  if(!st.wait)return;lockOpts();st.ans[st.i]=j;const o=s.o[j];const bs=document.querySelectorAll("#choices .opt");
  const hit=o===s.recall;st.rec[1]++;if(hit)st.rec[0]++;else if(!st.miss.includes(s.recall))st.miss.push(s.recall);
  bs.forEach(x=>{if(x.dataset.t===s.recall)x.classList.add("ok");});
  if(!hit)bs[j].classList.add("ng");

  const bl=$("blank");bl.className="blank "+(hit?"ok":"ng");bl.innerHTML=`<button class="term" data-k="${esc(s.recall)}">${esc(s.recall)}</button>`;

function advance(){if(typer&&!st.sheet){typer.finish();return;}
  if(isFollower()||st.wait||st.sheet||st.v!=="play")return;
  const s=S[st.i];
  if(s&&s.choice&&st.ans[st.i]!=null){const o=s.o[st.ans[st.i]];if(!o.h&&st.sub<o.ifr.length){st.sub++;drawChoice(s);SE.page();push();toBottom();return;}}
  st.i++;SE.page();run();}
function prevIndex(){let j=st.i-1;while(j>=0&&S[j].scene)j--;return j;}
function goTo(i,ans,sub){
  rebuild(i,ans);run();

  if(cur&&ans[st.i]!=null&&(cur.choice||cur.recall)){st.wait=true;if(cur.choice)answerChoice(cur,ans[st.i],sub,true);else answerRecall(cur,ans[st.i],true);}
}
function back(){
  if(isFollower()||st.sheet)return;

  const j=prevIndex();if(j<0)return;

function rebuild(i,ans){
  const keepDug=st.dug;resetProgress();st.dug=keepDug;st.ans={};
  for(let k=0;k<i&&k<S.length;k++){const s=S[k];
    if(s.scene)continue;

let gayaN=0,gayaLast=0;const gayaSeen={};
function gayaFly(text,who){
  const box=$("gayaLayer");if(!box)return;
  const el=document.createElement("div");el.className="gy";
  el.style.left=(8+Math.random()*70)+"%";el.style.setProperty("--rot",(Math.random()*10-5).toFixed(1)+"deg");
  el.innerHTML=`${esc(text)}${who?`<small>${esc(who)}</small>`:""}`;
  box.appendChild(el);setTimeout(()=>el.remove(),2600);
  tone(700+Math.random()*300,.09,.04,"triangle");
}
function sendGaya(text){const now=Date.now();if(now-gayaLast<350)return;gayaLast=now;
  gayaFly(text,room&&others().length?"あなた":"");
  if(room){gayaN++;setPres({g:{t:text,n:gayaN,at:now}});}}
$("bGaya").addEventListener("click",e=>{e.stopPropagation();const p=$("gayaPal");p.hidden=!p.hidden;$("bGaya").classList.toggle("on",!p.hidden);});
$("gayaPal").innerHTML=GAYA.map(g=>`<button data-g="${esc(g)}">${esc(g)}</button>`).join("");
$("gayaPal").addEventListener("click",e=>{e.stopPropagation();const b=e.target.closest("[data-g]");if(b)sendGaya(b.dataset.g);});
/* ガヤ・音の枠が開いているときの外側クリックは「枠を閉じる」だけにして、本文を進めない（2026-11-05 経太さん） */

/* ---------- reading together (room) ---------- */
let room=null,user=null,peers=[],names={};let myPres={};
function setPres(patch){Object.assign(myPres,patch);if(room)room.presence(Object.assign({},myPres)).catch(()=>{});}
function others(){return peers.filter(p=>!p.sameTab&&p.kind==="viewer");}
function hostPeer(){
  return peers.filter(p=>p.presence&&p.presence.host&&p.presence.s&&typeof p.presence.ep==="number")
    .sort((a,b)=>b.presence.ep-a.presence.ep)[0]||null;
}
function nameOf(p){return p.sameTab?"あなた":(p.by&&names[p.by])||p.name||"だれか";}
function snapshot(){return {v:st.v,i:st.i,sub:st.sub||0,ans:st.ans,perm:st.perm,nd:st.nd,om:st.om};}
let pushT=null;
function push(){
  if(!room||st.role!=="host")return;
  clearTimeout(pushT);pushT=setTimeout(()=>{const sn=snapshot();setPres({host:true,ep:st.ep,s:sn});if(SBR.on&&sn.v==="play")SBR.save(sn);},60);
}
function applyHost(s){
  const key=JSON.stringify(s);if(key===st.lastS)return;st.lastS=key;
  if(s.v==="title"){resetProgress();showTitle();return;}
  $("ovRoot").innerHTML="";
  goTo(s.i,s.ans||{},s.sub||0);

}
function roomAction(a){
  if(!room)return;
  if(a==="host"){st.role="host";st.ep=Date.now();setPres({host:true,ep:st.ep,s:snapshot()});}
  else if(a==="solo"){st.role="solo";st.lastS="";setPres({host:null,ep:null,s:null});}
  else if(a==="follow"){st.role="follow";st.lastS="";const h=hostPeer();if(h)applyHost(h.presence.s);}
  updateRoomUI();if(st.sheet==="room")renderSheet();
  if(st.v==="title")renderTitleRoom();else if(st.v==="play"){nxText();$("bk").hidden=isFollower()||prevIndex()<0;document.querySelectorAll("#choices .opt").forEach(b=>{if(st.wait)b.disabled=isFollower();});}
}
function roomSheet(){
  const h=hostPeer();
  const list=peers.filter(p=>p.kind==="viewer").map(p=>`<button><span>${esc(nameOf(p))}${p.guest?" <small>ゲスト</small>":""}</span><span>${h&&p.peer===h.peer?"ホスト":""}</span></button>`).join("");
  let act="";
  if(st.role==="host")act=`<p class="muted">あなたがホストです。あなたの操作で全員の画面が進みます。</p><button class="ghost" data-room="solo">ホストをやめる</button>`;
  else if(st.role==="follow")act=`<p class="muted">${esc(h?nameOf(h):"ホスト")}さんの画面に合わせています。深掘りと用語帳は自分だけで開けます。</p><button class="ghost" data-room="solo">合わせるのをやめて ひとりで読む</button><button class="ghost" data-room="host">自分がホストになる</button>`;
  else act=`${h?`<button class="go" data-room="follow">${esc(nameOf(h))}さんに合わせて読む</button>`:""}<button class="ghost" data-room="host">ホストになって一緒に読む</button>`;
  return `<div class="crumb"><span>参加者</span></div><div class="sh-body"><h2>いま開いている人 ${peers.filter(p=>p.kind==="viewer").length}</h2>
  <div class="glist">${list}</div><div style="display:grid;gap:8px;margin-top:14px">${act}</div>
  ${SBR.code?`<p class="muted" style="margin-top:12px">同じ部屋番号のURLを開いた人と一緒に読めます。部屋No.<b>${esc(SBR.code)}</b></p><div style="display:grid;gap:8px"><label class="muted" style="display:grid;gap:4px">あなたの名前<input data-myname maxlength="12" placeholder="ゲスト" value="${esc(SBR.me_&&SBR.me_.name!=="ゲスト"?SBR.me_.name:"")}" style="font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--sheet);color:var(--ink)"></label><input readonly value="${esc(SBR.link())}" onclick="this.select()" style="font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--sheet);color:var(--ink)"><button class="go" data-share="1">この部屋のURLをシェア</button></div>`:`<p class="muted" style="margin-top:12px">招待は、このページの共有メニューからできます。</p>`}</div>`;
}
function updateRoomUI(){
  const b=$("bRoom");if(!room){b.hidden=true;return;}
  b.hidden=false;const n=peers.filter(p=>p.kind==="viewer").length||1;
  b.textContent=SBR.on?`部屋No.${SBR.code}・${n}人${st.role==="host"?"・ホスト":st.role==="follow"?"・同期中":""}`:st.role==="host"?`参加者 ${n}・ホスト`:st.role==="follow"?`参加者 ${n}・同期中`:`参加者 ${n}`;
  b.classList.toggle("on",st.role!=="solo");
}
async function resolveNames(){
  if(!user)return;const ids=[...new Set(peers.map(p=>p.by).filter(Boolean))];if(!ids.length)return;
  try{const ps=await user.profiles(ids);ids.forEach(id=>{names[id]=(ps[id]&&ps[id].name)||"";});}catch(e){}
}
function bindRoom(){
  updateRoomUI();
  room.onPeers(async ch=>{
    peers=[...ch.peers];
    for(const p of peers){const g=p.presence&&p.presence.g;if(!g||p.sameTab)continue;const k=p.peer;if(gayaSeen[k]===undefined){gayaSeen[k]=g.n;if(Date.now()-g.at<3000)gayaFly(g.t,nameOf(p));continue;}if(g.n!==gayaSeen[k]){gayaSeen[k]=g.n;if(Date.now()-g.at<8000)gayaFly(g.t,nameOf(p));}}
    if(ch.joined.length)await resolveNames();
    const h=hostPeer();
    if(st.role==="host"&&h&&!h.sameTab)roomAction("solo");
    if(!SBR.on&&st.role==="solo"&&h&&!h.sameTab&&!st.autoAsked&&st.v==="title"){st.autoAsked=true;roomAction("follow");}
    if(st.role==="follow"&&h&&!h.sameTab)applyHost(h.presence.s);
    if(st.role==="host"&&ch.joined.length)push();
    updateRoomUI();if(st.sheet==="room"&&!(document.activeElement&&document.activeElement.matches("[data-myname]")))renderSheet();
    if(st.v==="title")renderTitleRoom();
    drawLook();
  },()=>{room=null;updateRoomUI();});
}
/* ポータル版の「一緒に読む」: Supabase Realtime（表は使わない）。?room=部屋番号 が同じ人どうしが同じ部屋。番号が無ければ6桁を割り振る。 */
const SBR={on:false,code:"",
  link(){return location.origin+location.pathname+"?room="+this.code;},
  /* 部屋ごとの読み進めた位置（本番DB history_novel_rooms を関数 hn_room_* 経由で。ホストが「終了」を押したときだけ消す） */
  saved:null,db:null,saveT:null,
  dbc(){return this.db||(this.db=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false,autoRefreshToken:false,storageKey:"hn-db"}}));},
  async load(){try{const {data}=await this.dbc().rpc("hn_room_get",{p_room:this.code});this.saved=data||null;}catch(e){}},
  save(sn){this.saved=sn;clearTimeout(this.saveT);this.saveT=setTimeout(()=>{this.dbc().rpc("hn_room_set",{p_room:this.code,p_state:sn}).then(()=>{},()=>{});},800);},
  clear(){this.saved=null;clearTimeout(this.saveT);this.dbc().rpc("hn_room_clear",{p_room:this.code}).then(()=>{},()=>{});},
  async me(){
    let id=null,name="";
    try{name=(localStorage.getItem("hn-name")||localStorage.getItem("nb-name")||"").slice(0,12);}catch(e){}
    try{const a=window.supabase.createClient(SB_URL,SB_KEY);const {data}=await a.auth.getSession();const u=data&&data.session&&data.session.user;
      if(u){id=u.id;const r=await a.from("profiles").select("display_name").eq("user_id",u.id).maybeSingle();const n=((r.data&&r.data.display_name)||"").trim().slice(0,12);if(n&&n!=="名無し")name=n;}}catch(e){}
    return {id,name:name||"ゲスト"};
  },
  async join(code){
    this.code=code;const me=this.me_=await this.me();
    const sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false,autoRefreshToken:false,storageKey:"hn-rt"},realtime:{heartbeatIntervalMs:15000}});
    const key=Math.random().toString(36).slice(2,10);
    const ch=sb.channel("history-novel:"+code,{config:{presence:{key},broadcast:{self:false}}});
    let cb=null,prev=new Set(),pres={},ready=false,seq=0;const over={};
    const emit=()=>{const s=ch.presenceState(),list=[];
      for(const k in s){const m=s[k][s[k].length-1]||{},o=over[k],pp=(o&&o.q>=(m.q||0))?o.p:(m.p||{});list.push({peer:k,kind:"viewer",sameTab:k===key,by:m.by||null,name:m.name||"",guest:!m.by&&m.name!=="ゲスト",presence:pp});}
      const joined=list.filter(p=>!prev.has(p.peer));prev=new Set(list.map(p=>p.peer));if(cb)cb({peers:list,joined});};
    ch.on("presence",{event:"sync"},emit);
    ch.on("broadcast",{event:"p"},({payload})=>{if(!payload||!payload.k)return;const o=over[payload.k];if(o&&o.q>payload.q)return;over[payload.k]={q:payload.q,p:payload.p||{}};emit();});
    const track=()=>ch.track({by:me.id,name:me.name,p:{host:pres.host||null,ep:pres.ep||null},q:0});
    ch.subscribe(stt=>{if(stt==="SUBSCRIBED"){ready=true;track().catch(()=>{});}});
    this.retrack=()=>{if(ready){lastT=Date.now();track().catch(()=>{});}};
    let lastT=0,tT=null;
    /* presence は「誰がいてホストは誰か」だけ（送りすぎると切断される）。画面の状態は broadcast で配る */
    let tracked="";const slowTrack=()=>{clearTimeout(tT);const sig=JSON.stringify([pres.host||null,pres.ep||null]);if(sig===tracked)return;const w=1500-(Date.now()-lastT);if(w<=0){lastT=Date.now();tracked=sig;track().catch(()=>{tracked="";});}else tT=setTimeout(slowTrack,w);};
    room={presence(p){pres=p;seq=Date.now()*1000+(seq%1000+1);if(!ready)return Promise.resolve();ch.send({type:"broadcast",event:"p",payload:{k:key,q:seq,p}}).catch(()=>{});slowTrack();return Promise.resolve();},onPeers(f){cb=f;}};
    bindRoom();
  }
};

document.addEventListener("change",e=>{const t=e.target;if(!t.matches||!t.matches("[data-myname]")||!SBR.me_)return;const v=t.value.trim().slice(0,12);SBR.me_.name=v||"ゲスト";try{localStorage.setItem("hn-name",v);}catch(x){}SBR.retrack();},true);

(async()=>{
  if(window.claude&&window.claude.use){
