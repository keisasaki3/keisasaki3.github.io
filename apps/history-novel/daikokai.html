"明":{r:"みん",y:"1368〜1644",d:"中国の王朝。モンゴル人の元を北へ追い払って建てられた。都ははじめ{南京}、のち北京。{永楽帝}のときに{鄭和}の大艦隊を送り出したが、そのあとは{海禁}で海外との行き来を絞った。日本の室町幕府とは勘合貿易を行った。"},
"永楽帝":{t:"人",r:"えいらくてい",y:"1360〜1424",d:"{明}の3代皇帝。おいから帝位を奪い、都を北京に移した。モンゴルへ自ら遠征し、南の海には{鄭和}の艦隊を送って、各地の国々に{朝貢}をうながした。"},
"鄭和":{t:"人",r:"ていわ",y:"1371〜1433ごろ",d:"{明}の武将。イスラーム教徒の家に生まれ、宦官として{永楽帝}に仕えた。1405年から1433年まで7回、大艦隊を率いて東南アジア・インド・ペルシア湾・アフリカ東岸をめぐった。航海はもうけのためではなく、皇帝の威光を示すためだった。"},
"朝貢":{r:"ちょうこう",d:"周りの国の王が中国の皇帝に使いを送り、品物をささげること。皇帝はそれ以上の返礼の品を与え、王の位を認めた。中国を中心とした国どうしのつきあい方で、貿易の役目も果たした。日本の足利義満も{明}に朝貢した。"},
"海禁":{r:"かいきん",d:"{明}が民間の人々の海外渡航や外国との貿易を禁じた政策。外国との取り引きは{朝貢}の形に限った。16世紀に密貿易（倭寇）が広がり、のちにゆるめられた。"},
"オイラト":{r:"おいらと",y:"15世紀",d:"モンゴル高原の西にいた遊牧民の部族連合。1449年、明の皇帝（正統帝）を土木堡で捕らえた（土木の変）。明が北の守りに力を注いだ理由のひとつ。"},
"ポルトガル":{t:"地",r:"ぽるとがる",d:"イベリア半島の西の端の国。15世紀の人口は100万人ほど。陸は隣国にふさがれ、海に出るしかなかった。{エンリケ航海王子}のもとでアフリカ西岸を南へ進み、{ヴァスコ・ダ・ガマ}がインドへの航路を開いた。{ゴア}・{マラッカ}などの港を押さえる「点と線」の海の帝国をつくった。"},
"スペイン":{t:"地",r:"すぺいん",d:"イベリア半島の大部分を占める国。1479年にカスティリャとアラゴンが一つになって生まれた。1492年に{レコンキスタ}を終え、同じ年に{コロンブス}を送り出した。アメリカ大陸の大部分と{フィリピン|マニラ}を支配し、{ポトシ}の{銀|銀}で栄えた。"},
"リスボン":{t:"地",r:"りすぼん",d:"{ポルトガル}の都。テージョ川の河口にある港町。{ヴァスコ・ダ・ガマ}の船隊もここから出た。インドからの香辛料が集まり、16世紀にはヨーロッパ有数の商業都市になった。"},
"セウタ":{t:"地",r:"せうた",y:"1415",d:"アフリカ北端、ジブラルタル海峡に面した港町。1415年に{ポルトガル}が攻め取り、ヨーロッパの国がアフリカに持った最初の拠点の一つになった。サハラの向こうから金が運ばれてくる町だった。"},
"エンリケ航海王子":{t:"人",r:"えんりけこうかいおうじ",y:"1394〜1460",d:"{ポルトガル}の王子。自分では航海に出なかったが、毎年のように船を送り、アフリカ西岸の探検を進めさせた。航海者・地図職人を集め、{カラベル船}の改良も後押しした。「航海王子」は後の時代についたあだ名。"},
"香辛料":{r:"こうしんりょう",d:"コショウ・クローブ・ナツメグ・シナモンなど。肉の味つけや薬として、ヨーロッパで高く売れた。コショウはインド南部、クローブやナツメグは{モルッカ諸島}など限られた島でしかとれず、多くの商人の手を通るうちに値段が何倍にもなった。"},
"イスラーム商人":{r:"いすらーむしょうにん",d:"アラビア・ペルシア・インドなどのイスラーム教徒の商人たち。ダウ船で季節風に乗り、インド洋の港を結ぶ大きな貿易の網を築いていた。{香辛料}も彼らの手を通って地中海に運ばれた。"},
"ヴェネツィア":{t:"地",r:"う゛ぇねつぃあ",d:"イタリア北東部の海の上の都市国家。{アレクサンドリア}などで東方の品を買い、ヨーロッパに売って栄えた。インド航路が開くと、その地位は少しずつ下がっていった。"},
"アレクサンドリア":{t:"地",r:"あれくさんどりあ",d:"エジプトの地中海岸の港町。紅海を通って運ばれたインドの{香辛料}が、ここで{ヴェネツィア}などの商人に売られた。"},
"ボジャドール岬":{t:"地",r:"ぼじゃどーるみさき",y:"1434",d:"アフリカ西岸、いまの西サハラにある岬。浅瀬と強い流れで、その先は「暗黒の海」と恐れられた。1434年、{ジル・エアネス}が初めて回って戻ってきた。"},
"ジル・エアネス":{t:"人",r:"じる・えあねす",y:"15世紀",d:"{ポルトガル}の航海者。{エンリケ航海王子}の家来。一度は引き返したが、1434年に{ボジャドール岬}をこえ、恐れが迷信にすぎないことを示した。"},
"カラベル船":{r:"からべるせん",d:"15世紀に{ポルトガル}などで使われた小型の帆船。長さ20メートルほど。三角帆（ラテン帆）で向かい風でも進め、浅瀬にも入れた。アフリカ西岸の探検や{コロンブス}の航海（ピンタ号・ニーニャ号）に使われた。"},
"羅針盤":{r:"らしんばん",d:"磁石で方角を知る道具。中国で生まれ、イスラーム世界を通ってヨーロッパに伝わった。星の高さをはかる道具と合わせて、陸の見えない海でも位置がわかるようになった。"},
"ラゴス":{t:"地",r:"らごす",y:"1444",d:"{ポルトガル}南部の港町。1444年、アフリカから連れてこられた人々がここで競りにかけられた。ヨーロッパ人による大西洋の{奴隷貿易}の始まりとされる。"},
"奴隷貿易":{r:"どれいぼうえき",d:"アフリカの人々を捕らえ、奴隷として売り買いした貿易。15世紀に{ポルトガル}が始め、16世紀からはアメリカ大陸の農園や鉱山に送られるようになった。19世紀までに1000万人以上が大西洋を渡らされた。"},
"コンスタンティノープル":{t:"地",r:"こんすたんてぃのーぷる",y:"1453",d:"ボスポラス海峡に面した大都市。{ビザンツ帝国}の都。1453年に{オスマン帝国}が攻め落とし、イスタンブルと呼ばれるようになった。"},
"オスマン帝国":{r:"おすまんていこく",y:"1299〜1922",d:"トルコ人のイスラーム国家。1453年に{コンスタンティノープル}を落とし、16世紀にはバルカン半島・西アジア・北アフリカにまたがる大帝国になった。東地中海の貿易を押さえた。"},
"ビザンツ帝国":{r:"びざんつていこく",y:"395〜1453",d:"東ローマ帝国のこと。ローマ帝国が東西に分かれたあとも、{コンスタンティノープル}を都に千年以上続いた。1453年に{オスマン帝国}に滅ぼされた。"},
"バルトロメウ・ディアス":{t:"人",r:"ばるとろめう・でぃあす",y:"1450ごろ〜1500",d:"{ポルトガル}の航海者。1488年、アフリカの南端を回り、インド洋に入った最初のヨーロッパ人となった。のちに{カブラル}の船隊に加わり、嵐で命を落とした。"},
"ジョアン2世":{t:"人",r:"じょあんにせい",y:"1455〜1495",d:"{ポルトガル}の王。アフリカ回りでインドへ行く計画を強く進め、{バルトロメウ・ディアス}を送り出した。{コロンブス}の西回りの計画は断った。{トルデシリャス条約}を結んだ王でもある。"},
"喜望峰":{t:"地",r:"きぼうほう",y:"1488",d:"アフリカ大陸の南の端近くにある岬。1488年に{バルトロメウ・ディアス}が回った。ディアスは「嵐の岬」と名づけたが、{ジョアン2世}が「良き望みの岬」と改めたと伝わる。"},
"コロンブス":{t:"人",r:"ころんぶす",y:"1451ごろ〜1506",d:"ジェノヴァ生まれの航海者。地球は丸いので西へ進めばアジアに着くと考え、{スペイン}の{イサベル女王}の支援で1492年に大西洋を渡り、カリブ海の島に着いた。4回航海したが、死ぬまでそこをアジアの一部だと信じていた。"},
"イサベル女王":{t:"人",r:"いさべるじょおう",y:"1451〜1504",d:"カスティリャの女王。夫のアラゴン王フェルナンドとともに{スペイン}をまとめ、1492年に{グラナダ}を落として{レコンキスタ}を終えた。同じ年、{コロンブス}の航海を認めた。"},
"レコンキスタ":{r:"れこんきすた",y:"8世紀〜1492",d:"「国土回復運動」。イベリア半島をイスラーム勢力から取り戻そうとした、キリスト教徒の国々の長い戦い。1492年の{グラナダ}陥落で終わった。"},
"グラナダ":{t:"地",r:"ぐらなだ",y:"1492",d:"イベリア半島南部の町。イスラームのナスル朝の都で、アルハンブラ宮殿がある。1492年1月に{スペイン}に降伏し、{レコンキスタ}が終わった。"},
"サンタ・マリア号":{r:"さんた・まりあごう",y:"1492",d:"{コロンブス}の第1回航海の旗艦。長さ20数メートル、乗組員は40人ほど。ピンタ号・ニーニャ号とともに大西洋を渡ったが、その年のクリスマスにイスパニョーラ島の近くで座礁した。"},
"サン・サルバドル島":{t:"地",r:"さん・さるばどるとう",y:"1492",d:"カリブ海のバハマ諸島にある島。1492年10月12日、{コロンブス}が最初に上陸したと考えられている。島の人々はグアナハニと呼んでいた。"},
"イスパニョーラ島":{t:"地",r:"いすぱにょーらとう",d:"カリブ海の大きな島。いまのハイチとドミニカ共和国。{コロンブス}が拠点を置き、スペインのアメリカ大陸支配の出発点になった。先住民のタイノの人々は、病気と強制労働でほとんどいなくなった。"},
"西インド諸島":{r:"にしいんどしょとう",d:"カリブ海の島々をまとめた呼び名。{コロンブス}がここをインド（アジア）の一部だと思いこんだことから、この名が残った。"},
"トルデシリャス条約":{r:"とるでしりゃすじょうやく",y:"1494",d:"{スペイン}と{ポルトガル}が結んだ条約。大西洋のヴェルデ岬諸島の西、約370レグア（およそ西経46度）に南北の線を引き、西をスペイン、東をポルトガルの勢力範囲とした。この線のおかげで{ブラジル}はポルトガル領になった。"},
"カブラル":{t:"人",r:"かぶらる",y:"1467ごろ〜1520ごろ",d:"{ポルトガル}の航海者。1500年、インドへ向かう途中で大きく西に回り、南アメリカの陸地に着いた。そこが{ブラジル}としてポルトガル領になった。"},
"ブラジル":{t:"地",r:"ぶらじる",y:"1500〜",d:"南アメリカ大陸の東側。1500年に{カブラル}が着き、{トルデシリャス条約}の線の東側だったため{ポルトガル}領になった。いまも南アメリカで唯一ポルトガル語の国。名前は染料の木「ブラジルボク」から。"},
"ヴァスコ・ダ・ガマ":{t:"人",r:"う゛ぁすこ・だ・がま",y:"1460ごろ〜1524",d:"{ポルトガル}の航海者。1497年にリスボンを出て{喜望峰}を回り、1498年にインドの{カリカット}に着いた。ヨーロッパからアフリカを回ってアジアへ行く航路を開いた。"},
"カリカット":{t:"地",r:"かりかっと",y:"1498",d:"インド南西部の港町（いまのコーリコード）。コショウの積み出し港としてイスラーム商人が集まっていた。{鄭和}の艦隊も寄り、1498年に{ヴァスコ・ダ・ガマ}が着いた。"},
"ゴア":{t:"地",r:"ごあ",y:"1510〜",d:"インド西岸の港町。1510年に{ポルトガル}が攻め取り、アジアでの拠点とした。{ザビエル}もここからアジアの布教に向かった。1961年までポルトガル領だった。"},
"マラッカ":{t:"地",r:"まらっか",y:"1511",d:"マレー半島の港町。インド洋と南シナ海を結ぶ海峡を押さえる貿易の中心地。{鄭和}の艦隊の中継地でもあった。1511年に{ポルトガル}が攻め取った。"},
"モルッカ諸島":{t:"地",r:"もるっかしょとう",d:"いまのインドネシア東部の島々。クローブやナツメグなど、ここでしかとれない{香辛料}の産地で「香料諸島」と呼ばれた。{ポルトガル}と{スペイン}が奪い合った。"},
"マゼラン":{t:"人",r:"まぜらん",y:"1480ごろ〜1521",d:"ポルトガル生まれの航海者。{スペイン}王の支援で1519年に西回りで出発し、南アメリカ南端の海峡（{マゼラン海峡}）を抜けて{太平洋}を横断した。1521年、フィリピンの{マクタン島}で戦死。船隊の残りが世界一周を果たした。"},
"サン・フリアン":{t:"地",r:"さん・ふりあん",y:"1520",d:"アルゼンチン南部の入り江。{マゼラン}の船隊が冬を越し、ここでスペイン人の船長たちの反乱が起きた。"},
"マゼラン海峡":{t:"地",r:"まぜらんかいきょう",y:"1520",d:"南アメリカ大陸の南の端と、フエゴ島の間の海峡。長さ約570キロ。1520年10月から11月にかけて{マゼラン}の船隊が通り抜け、大西洋と{太平洋}がつながっていることを確かめた。"},
"太平洋":{r:"たいへいよう",d:"世界でいちばん広い海。地球の表面の約3分の1を占める。{マゼラン}が、海峡を抜けた先のおだやかな海を「静かな海（マル・パシフィコ）」と呼んだのが名前の始まり。"},
"ピガフェッタ":{t:"人",r:"ぴがふぇった",y:"1491ごろ〜1531ごろ",d:"イタリアの人。{マゼラン}の船隊に加わり、生きて帰った18人の一人。航海のようすを細かく記録し、太平洋での飢え、マゼランの死、日付のずれなどを書き残した。"},
"マクタン島":{t:"地",r:"まくたんとう",y:"1521",d:"フィリピン中部、セブ島のとなりの小さな島。1521年4月、{マゼラン}がここで首長{ラプラプ}の軍と戦い、命を落とした。"},
"ラプラプ":{t:"人",r:"らぷらぷ",y:"16世紀",d:"{マクタン島}の首長。1521年、キリスト教への改宗と服従を求めた{マゼラン}の軍を迎え撃ち、マゼランを倒した。フィリピンでは外国の侵略に立ち向かった最初の英雄とされる。"},
"エルカーノ":{t:"人",r:"えるかーの",y:"1486ごろ〜1526",d:"スペインのバスク地方出身の航海者。{マゼラン}の死後、ビクトリア号を率いてインド洋・{喜望峰}を回り、1522年にスペインに帰った。国王から「汝、初めてわれを巡りし者」と刻まれた地球の紋章を与えられた。"},
"日付変更線":{r:"ひづけへんこうせん",d:"日付の境目となる、太平洋上の線。西へ地球を一周すると1日ずれるため、どこかで日付を変える必要がある。{マゼラン}の船隊が初めてこのずれに気づいた。"},
"コルテス":{t:"人",r:"こるてす",y:"1485〜1547",d:"スペインの征服者（{コンキスタドール}）。1519年、600人ほどでメキシコに上陸し、{トラスカラ}などの先住民を味方につけて、1521年に{アステカ王国}の都{テノチティトラン}を攻め落とした。"},
"アステカ王国":{r:"あすてかおうこく",y:"14世紀〜1521",d:"メキシコ中央高原の国。湖の島の都{テノチティトラン}を中心に、周りの人々から貢ぎ物を取り立てて栄えた。太陽の神に人をいけにえとして捧げる祭りもあった。1521年に{コルテス}に滅ぼされた。"},
"テノチティトラン":{t:"地",r:"てのちてぃとらん",y:"1325〜1521",d:"{アステカ王国}の都。テスココ湖の島の上に築かれ、土手道で岸と結ばれていた。人口は20万人をこえたともいわれる。征服のあとで壊され、その上にいまのメキシコシティが建てられた。"},
"マリンチェ":{t:"人",r:"まりんちぇ",y:"1500ごろ〜1529ごろ",d:"メキシコ湾岸の先住民の女性。マヤの言葉とアステカの言葉（ナワトル語）を話せ、のちにスペイン語も覚えて{コルテス}の通訳と相談役になった。征服を助けた人とも、二つの世界をつないだ人とも評価が分かれる。"},
"トラスカラ":{t:"地",r:"とらすから",d:"メキシコ中央高原の国。{アステカ王国}と長く戦っていて、征服されていなかった。{コルテス}と手を組み、何万もの兵を出して{テノチティトラン}攻めを支えた。"},
"モクテスマ2世":{t:"人",r:"もくてすまにせい",y:"1466ごろ〜1520",d:"{アステカ王国}の王。1519年、{コルテス}を都{テノチティトラン}に迎え入れたが、人質にとられた。1520年、都が騒乱になるなかで死んだ。死のいきさつは記録によって違う。"},
"天然痘":{r:"てんねんとう",d:"ウイルスでうつる、高い熱と発疹の病気。ヨーロッパやアジアでは昔からあり、かかって治った人は二度とかからない。アメリカ大陸の人々はこの病気に出会ったことがなく、免疫がなかったため、多くの命が失われた。1980年に地球上から根絶された。"},
"インカ帝国":{r:"いんかていこく",y:"15世紀〜1533",d:"南アメリカのアンデス山脈にあった大帝国。都は{クスコ}。南北4000キロにおよぶ道を整え、文字のかわりに縄の結び目（キープ）で記録した。1533年に{ピサロ}に滅ぼされた。"},
"クスコ":{t:"地",r:"くすこ",d:"{インカ帝国}の都。アンデス山中、標高3400メートルほどの高地にある。すき間なく石を組んだ石垣がいまも残り、その上にスペイン風の建物が建てられた。"},
"ピサロ":{t:"人",r:"ぴさろ",y:"1478ごろ〜1541",d:"スペインの征服者（{コンキスタドール}）。読み書きができなかったと伝わる。1532年、{カハマルカ}で皇帝{アタワルパ}を捕らえ、1533年に{インカ帝国}を征服した。のちに仲間との争いで殺された。"},
"アタワルパ":{t:"人",r:"あたわるぱ",y:"1502ごろ〜1533",d:"{インカ帝国}の皇帝。兄との跡継ぎ争いに勝った直後、{カハマルカ}で{ピサロ}に捕らえられた。部屋いっぱいの金銀を差し出したが、1533年に処刑された。"},
"カハマルカ":{t:"地",r:"かはまるか",y:"1532",d:"ペルー北部、アンデス山中の町。1532年11月、{ピサロ}がここで{アタワルパ}を捕らえた。金で満たされたと伝わる「身代金の部屋」が残っている。"},

"種子島":{t:"地",r:"たねがしま",y:"1543",d:"鹿児島県の南の島。1543年、ポルトガル人を乗せた中国人の船が流れ着き、{鉄砲}が伝わった（鉄砲伝来）。島の領主種子島時尭が2丁を買い、作り方を家来に学ばせた。"},

"イエズス会":{r:"いえずすかい",y:"1534〜",d:"カトリックの修道会。{ザビエル}らが創立した。宗教改革に対抗して、アジアやアメリカ大陸で布教や学校づくりを進めた。"},

"鹿児島":{t:"地",r:"かごしま",y:"1549",d:"九州南部の港町。1549年、{ザビエル}がここに上陸した。戦国大名の島津氏の本拠地。"},

"コロンブス交換":{r:"ころんぶすこうかん",d:"{コロンブス}の航海のあと、アメリカ大陸とほかの大陸の間で、作物・動物・病気が大きく行き来したこと。ジャガイモ・トウモロコシ・トマト・トウガラシが世界へ、馬・牛・小麦・{天然痘}がアメリカ大陸へ渡った。"},
"マニラ":{t:"地",r:"まにら",y:"1571〜",d:"フィリピンの港町。1571年に{スペイン}が築き、アジアでの拠点とした。{アカプルコ}からの{銀}と、中国の絹・陶磁器が取り引きされた。"},

"南京":{t:"地",r:"なんきん",d:"長江の下流にある中国の都市。{明}のはじめの都。{鄭和}の艦隊の船は、この近くの造船所で造られた。"},
"マリンディ":{t:"地",r:"まりんでぃ",d:"アフリカ東岸、いまのケニアの港町。イスラーム商人の町で、{鄭和}の艦隊が訪れ、王がキリンを{明}に贈ったと伝わる。{ヴァスコ・ダ・ガマ}もここでインド洋の水先案内人を雇った。"},
"ホルムズ":{t:"地",r:"ほるむず",d:"ペルシア湾の入り口の島の港。インド洋とペルシア湾を結ぶ貿易の要所。{鄭和}の艦隊が訪れ、1515年には{ポルトガル}が押さえた。"},
"サンルーカル":{t:"地",r:"さんるーかる",d:"スペイン南部、グアダルキビル川の河口の港町。{マゼラン}の船隊はここから出発し、1522年にビクトリア号がここへ帰ってきた。川をさかのぼると{セビリャ}がある。"},

 m:{ar:[{p:["リスボン","ヴェルデ岬",[-25,-12],[2,-32],"喜望峰",[36,-24],"マリンディ",[60,8],"カリカット"],s:"s",l:"ヴァスコ・ダ・ガマ"}]}},
{t:"喜望峰を回り、アフリカ東岸のマリンディで、インド洋をよく知る水先案内人を雇った。1498年5月、船はインドの{カリカット}に着いた。",m:{c:[60,0],r:1400}},
{t:"上陸した船乗りを迎えたのは、なんと北アフリカのチュニス出身の商人だった。スペイン語で、こうどなったと航海の記録にある。",img:["d_calicut"],m:{c:"カリカット",r:300,blink:"カリカット"}},
{sp:"tunis",t:"「なんてこった！　いったい何しに来やがった！」"},
{sp:"dagama",t:"「キリスト教徒と…\n香辛料を求めて来たのだ」"},
{t:"商人がおどろいたのも無理はない。インド洋には、アラビアやインドの商人たちの大きな貿易の網が、とうに広がっていた。ポルトガルは、そこへ遅れてやってきた新顔だった。"},
{t:"それでも、持ち帰った香辛料は航海の費用の何十倍にもなったと伝わる。間の商人を通さない道が、ついに開けたのだ。",m:{c:[33,2],r:3900,fw:4400}},
{t:"ポルトガルは大砲を積んだ船で港を攻め、要塞を築いていった。1510年に{ゴア}、1511年に{マラッカ}。香辛料の島、{モルッカ諸島}にも手を伸ばす。広い土地ではなく、港と港を結ぶ「点と線」の帝国だった。",
 m:{c:[100,5],r:1900,fw:2900,clear:1,pins:["ゴア","マラッカ","モルッカ諸島","ホルムズ"],blink:"マラッカ",fl:"pt",ar:[{p:["ゴア",[90,4],"マラッカ"],s:"s",l:""},{p:["マラッカ",[115,-3],"モルッカ諸島"],s:"s",l:"香辛料の島へ"},{p:["ゴア",[63,20],"ホルムズ"],s:"s",l:""}]}},

{scene:{y:1519,bgm:"rough_sea",era:"大航海時代",e:"マゼランの船隊",m:{c:[-40,-10],r:3200,pins:["サンルーカル"],blink:"サンルーカル",fl:"es"}}},
{t:"東回りの道は、ポルトガルに押さえられた。スペインに残された道は、西だけだ。"},
{t:"1519年、ポルトガル生まれの航海者{マゼラン}が、スペイン王の支援を受けて5隻の船で出発した。目標は、西回りで香辛料の島、モルッカ諸島へ行くこと。",
 m:{ar:[{p:["サンルーカル",[-25,10],[-36,-10],[-48,-28],"サン・フリアン"],s:"s",l:"マゼラン"}]}},
{t:"だが、南アメリカ大陸はどこまでも続いていた。冬を越すために停まった{サン・フリアン}で、スペイン人の船長たちが反乱を起こす。マゼランはこれをしずめたが、船は1隻沈み、食料は減っていくばかりだった。",m:{c:[-67,-50],r:500,pins:["サン・フリアン","マゼラン海峡"],blink:"サン・フリアン"}},
{t:"1520年10月、ついに大陸の南の端に、西へ抜ける細い水路が見つかった。のちの{マゼラン海峡}だ。入り組んだ岩の迷路のような海峡を、船はそろそろと進む。",img:["p_strait"],m:{c:"マゼラン海峡",r:260,blink:"マゼラン海峡",fl:"es",ar:[{p:["サン・フリアン",[-68.3,-52.4],"マゼラン海峡",[-74.5,-52.6]],s:"s",l:""}]}},
{sp:"captains",t:"「提督、食料はあとわずか…\n海峡の先に何があるかもわからぬ。\nここで引き返すべきです」"},
{who:"マゼランの決断",choice:"この先の海がどれほど広いのか、誰も知らない。マゼランは——",a:1,
 hm:{c:[-110,-30],r:1700,blink:"マゼラン海峡",fl:"es",ar:[{p:["マゼラン海峡",[-90,-45],[-120,-30]],s:"s",l:"未知の海へ"}]},
 o:[
 {t:"「ここまでだ。スペインへ引き返そう」",im:{c:[-40,-10],r:3200,blink:"マゼラン海峡",ar:[{p:["マゼラン海峡",[-55,-40],[-38,-15],[-25,15],"サンルーカル"],s:"if",l:"引き返す（IF）"}]},ifr:[
  "船は向きを変え、来た道をたどってスペインへ。長い航海の末に、船乗りたちは家族のもとへ帰った。",
  "だが待っていたのは、勝手に戻ってきた者への冷たい目と、取り調べだった。",
  "実はこの道を、本当にたどった船がある。海峡の探検中に、船隊の1隻サン・アントニオ号が姿を消し、勝手にスペインへ帰ってしまったのだ。",
  "1521年5月にスペインに着いた船乗りたちは、マゼランの悪口を言い立てた。だが彼らは、世界一周の名誉を自分で手放したことになった。"]},
 {t:"「進む。海峡の向こうには、必ず海がある」",h:1}],
 fb:"マゼランは進んだ。抜けた先には、おだやかな海が広がっていた。マゼランはこの海を「太平洋（静かな海）」と名づけた。"},
{t:"だが、{太平洋}は誰の想像よりも広かった。3か月以上、人の住む島にたどり着けない。船隊に加わっていたイタリア人、{ピガフェッタ}が記録を残している。",
 m:{c:[-153,-10],r:3200,fw:8800,clear:1,pins:["マゼラン海峡","マクタン島"],blink:null,ar:[{p:["マゼラン海峡",[-80,-48],[-110,-25],[-160,-5],[-215,13.4],"マクタン島"],s:"s",l:"太平洋横断"}]}},
{sp:"pigafetta",t:"「虫だらけの粉と化したビスケットを食べ…\n帆桁を包む牛の皮まで煮て食べた。\nネズミが半ドゥカートで売り買いされた」"},
{t:"1521年3月、ようやくフィリピンの島々に着いた。ところがマゼランは、{マクタン島}の首長{ラプラプ}と戦い、命を落とす。",m:{c:"マクタン島",r:420,blink:"マクタン島",fl:"k"}},
{t:"残った船乗りは、{エルカーノ}を中心にモルッカ諸島で香辛料を積み、そこから先は西へ。ポルトガルの船を避けながら、インド洋を渡り、喜望峰を回った。",
 m:{c:[-186,8],r:6000,rw:19500,pins:["帰着"],blink:"帰着",fl:"es",ar:[{p:["マクタン島",[-232.6,0.8],[-262,-12],[-300,-36],[-341.5,-34.8],[-372,0],"帰着"],s:"s",l:"エルカーノ"}]}},
{t:"そして1522年9月、冒頭の場面だ。帰ってきたのは18人。積んできた香辛料だけで、航海の費用をまかなえたという。"},
{t:"ふしぎなことが一つあった。日誌の曜日が、帰り道に寄った島の暦と1日ずれていたのだ。西へ地球を回ると、1日得をする。のちの{日付変更線}の考え方は、ここから始まった。",n:"ピガフェッタは毎日欠かさず日記をつけていたのに、1日足りなかったと書き残している。"},
{t:"国王はエルカーノに紋章を与えた。そこには地球と、ラテン語の言葉が刻まれていた。「汝、初めてわれを巡りし者」。",img:["d_victoria"]},

{scene:{y:1519,bgm:"lake_city",era:"大航海時代",e:"アステカ王国",m:{c:[-90,20],r:900,pins:["イスパニョーラ島","ベラクルス","テノチティトラン"],blink:"テノチティトラン",fl:"k"}}},
{t:"話は少しさかのぼる。マゼランが出発した1519年、カリブ海の島々からメキシコへ向かったスペイン人たちがいた。率いるのは{コルテス}。兵は600人ほど。"},
{t:"目指したのは{アステカ王国}。都{テノチティトラン}は湖の上に浮かぶ島の都で、人口は20万人をこえたともいわれる。同じころのヨーロッパのどの都市より大きかった。",img:["d_tenochtitlan"]},
{t:"コルテスは、通訳の女性{マリンチェ}を通じて各地の様子をつかみ、アステカに従わされて不満をためていた町々や、アステカと長く戦ってきた{トラスカラ}の人々を味方につけた。",
 m:{c:[-97.5,19.4],r:200,pins:["ベラクルス","トラスカラ","テノチティトラン"],blink:"トラスカラ",fl:"es",ar:[{p:["ベラクルス","トラスカラ","テノチティトラン"],s:"s",l:"コルテス"}]}},
{t:"アステカの王{モクテスマ2世}のもとには、ふしぎな見た目の人々が、鉄の服を着て、大きな獣（馬）に乗って近づいてくると知らせが届く。",m:{c:"テノチティトラン",r:120,blink:"テノチティトラン",fl:"k"}},
{who:"モクテスマ2世の決断",choice:"よそ者は少数だが、見たこともない武器を持ち、周りの敵をまとめている。モクテスマは——",a:0,
 hm:{c:"テノチティトラン",r:120,blink:"テノチティトラン",fl:"k"},
 o:[
 {t:"「客人として、都に迎え入れよう」",h:1},
 {t:"「都に入れてはならぬ。全軍で討ち果たせ」",im:{c:[-97.5,19.4],r:200,blink:"トラスカラ",ar:[{p:["テノチティトラン","トラスカラ"],s:"if",l:"アステカ軍（IF）"}]},ifr:[
  "アステカの大軍が都を出た。スペイン人の数は少ない。たとえ鉄砲や馬があっても、数で押しつぶせるはずだった。",
  "実はこの戦いは、翌年に本当に起きる。1520年6月の夜、アステカの人々は立ち上がり、スペイン人を都から追い出したのだ（悲しき夜）。",
  "ところが、勝ったはずの都を、目に見えない敵が襲った。スペイン人が持ちこんだ{天然痘}だ。",
  "この病気に免疫を持たない人々は、次々と倒れた。新しい王までが、天然痘で命を落とした。"]}],
 fb:"モクテスマはコルテスを都に迎え入れた。アステカの記録は、そのときの王の言葉を伝えている。"},
{sp:"moctezuma",t:"「わが君よ、お疲れでありましょう。\nあなたの都、メヒコに着かれたのです。\nどうか、その座にお着きくだされ」"},
{t:"ところがコルテスは、その王を人質にとった。都は乱れ、モクテスマは命を落とす。1520年、アステカの人々はスペイン人をいったん都から追い出した。"},
{t:"だが、都には{天然痘}が広がっていた。スペイン人が持ちこんだ病気だ。この病気を知らなかった人々は、次々と倒れた。",img:["d_smallpox"]},
{t:"1521年、コルテスはトラスカラなどの大軍とともに都を囲み、攻め落とした。湖の都は壊され、その上に今のメキシコシティが築かれていく。"},
{scene:{y:1533,bgm:"highland_wind",era:"大航海時代",e:"インカ帝国",m:{c:[-76,-8],r:900,pins:["パナマ","カハマルカ","クスコ"],blink:"クスコ",fl:"k"}}},
{t:"南のアンデスの山々には、もう一つの大帝国があった。{インカ帝国}だ。都{クスコ}を中心に、南北4000キロにわたって道をめぐらせていた。",img:["p_cusco"]},
{t:"これに目をつけたのが、{ピサロ}。パナマから何度も南へ探検に出たが、なかなかうまくいかない。仲間が帰りたがったとき、ピサロは剣で砂に線を引いて言ったと伝わる。"},
{sp:"pizarro",t:"「こちらへ行けばペルー、富が待つ。\nあちらへ戻ればパナマ、貧しさが待つ。\n勇気ある者は、線をこえよ」"},
{t:"インカでは、ちょうど天然痘が広がり、皇帝が亡くなったあとの跡継ぎ争いが起きていた。勝ったのは{アタワルパ}。",
 m:{c:[-78,-5],r:600,blink:"カハマルカ",fl:"es",ar:[{p:["パナマ",[-80.5,0],[-80.4,-4],"カハマルカ"],s:"s",l:"ピサロ"}]}},
{t:"1532年、ピサロは170人ほどの兵で、高地の町{カハマルカ}にいたアタワルパに会いに行き、不意打ちで捕らえた。",m:{c:"カハマルカ",r:120,blink:"カハマルカ",fl:"es"}},
{sp:"atahualpa",t:"「わしを放すなら…\nこの部屋を、手の届くところまで黄金で満たそう。\n隣の部屋は、銀で二度満たしてやろう」",img:["p_cajamarca"]},
{t:"約束どおり、黄金と銀は帝国じゅうから集められた。それでもピサロは、1533年、アタワルパを処刑した。その年のうちに、都クスコも占領される。",m:{c:[-75,-10],r:500,blink:"クスコ",ar:[{p:["カハマルカ",[-76.5,-11],"クスコ"],s:"s",l:""}]}},
{t:"こうした征服者を{コンキスタドール}と呼ぶ。数百人のスペイン人が大帝国を倒せたのは、鉄の武器と馬だけではない。現地の味方と、そして何より天然痘などの病気の力が大きかった。"},
{t:"アメリカ大陸の先住民の人口は、百年ほどのあいだに、9割近く減ったともいわれる。",n:"もとの人口の見積もりには幅があり、減り方の数字も研究者によって違う。"},
{t:"スペインの神父{ラス・カサス}は、植民地で見たことを本に書き、国王にうったえた。",m:{c:[-75,5],r:2000,blink:"イスパニョーラ島",fl:"es"}},
{sp:"lascasas",t:"「彼らは、おとなしい羊の群れのような人々であった。\nそこへ、何日も飢えた狼のように…\nスペイン人は入りこんだのだ」"},

{scene:{y:1543,bgm:"island_beach",era:"大航海時代",e:"日本へ",m:{c:[118,20],r:1500,pins:["マラッカ","種子島"],blink:"種子島",fl:"pt"}}},
{t:"ポルトガルの船は東アジアの海にも入りこんだ。1543年、中国人の船に乗ったポルトガル人が、九州の南の{種子島}に流れ着く。",
 m:{ar:[{p:["マラッカ",[110,12],[122,24],"種子島"],s:"s",l:"ポルトガル人"}]}},
{t:"彼らが持っていた{鉄砲}を、島の領主は大金で買い取った。鉄砲はやがて日本中に広まり、戦国時代の戦い方を変えていく。",m:{c:[131,31],r:180,blink:"種子島",pins:["鹿児島"]}},
{t:"1549年には、{イエズス会}の宣教師{ザビエル}が{鹿児島}に上陸し、キリスト教を伝えた。日本も、大航海時代の海とつながったのだ。",m:{c:[102,15],r:2000,fw:3000,blink:"鹿児島",ar:[{p:["ゴア",[90,4],"マラッカ",[112,12],[124,26],"鹿児島"],s:"s",l:"ザビエル"}]}},
{sp:"xavier",t:"「この国の人々は、これまでに出会った中で\n最もすぐれた人々である。\n名誉を何より重んじる」"},

{scene:{y:1545,bgm:"mine",era:"大航海時代",e:"銀の山",m:{c:"ポトシ",r:300,pins:["ポトシ"],blink:"ポトシ",fl:"es"}}},
{t:"1545年、アンデス山中の{ポトシ}で、山ごと銀でできているような大銀山が見つかった。",img:["d_potosi"]},
{t:"掘ったのは、強制的に働かされた先住民だった。標高4000メートルをこえる高地の、暗く危ない坑道で、多くの人が命を落とした。"},
{t:"掘り出された{銀}は、船でスペインへ運ばれた。ヨーロッパには銀があふれ、物の値段がどんどん上がっていく。{価格革命}だ。",
 m:{c:[-43,9],r:3300,fw:3900,pins:["ポトシ","パナマ","セビリャ"],blink:"セビリャ",ar:[{p:["ポトシ",[-72,-12],[-80,-2],"パナマ",[-72,15],[-50,25],[-25,33],"セビリャ"],s:"s",l:"銀"}]}},
{t:"同じころ、ジャガイモ・トウモロコシ・トマト・トウガラシがアメリカ大陸から世界へ。馬・牛・小麦、そして病気がヨーロッパからアメリカ大陸へ。動物や作物の大移動が始まった。{コロンブス交換}と呼ばれる。",
 m:{ar:[{p:[[-70,0],[-40,25],[-10,35]],s:"o",l:"ジャガイモ・トウモロコシ"},{p:[[-12,30],[-40,10],[-62,-5]],s:"o",l:"馬・牛・小麦・天然痘"}]}},
{scene:{y:1571,bgm:"calm_ocean",era:"大航海時代",e:"太平洋の道",m:{c:[-170,20],r:2600,fw:7400,pins:["アカプルコ","マニラ"],blink:"マニラ",fl:"es"}}},
{t:"1571年、スペインはフィリピンに{マニラ}の町を築いた。メキシコの{アカプルコ}との間を、大きな帆船が毎年行き来するようになる。{ガレオン貿易}だ。",
 m:{ar:[{p:["アカプルコ",[-150,12],[-200,13],"マニラ"],s:"s",l:"銀"},{p:["マニラ",[-210,36],[-160,40],[-125,36],"アカプルコ"],s:"o",l:"絹・陶磁器"}]}},
{t:"船が運んだのは、アメリカ大陸の銀。マニラで待っていたのは、絹や陶磁器を積んだ中国の商人たちだった。"},
{t:"そのころの明は、税を銀で納めさせるようになっていた。国じゅうが銀を必要としていたのだ。",m:{c:[-130,20],r:6000,rw:15500,pins:["アカプルコ","マニラ","セビリャ","ポトシ"],blink:"マニラ",fl:null,ar:[{p:["ポトシ","パナマ",[-50,25],"セビリャ"],s:"s",l:"銀"},{p:["アカプルコ",[-200,13],"マニラ",[-246,22]],s:"s",l:"銀"}]}},
{t:"かつて海から手を引いた明に、地球の反対側の銀が、海を渡って流れこんでいく。世界の海の道は、とうとう一つの輪になった。"},
{scene:{y:1571,bgm:"port_market",era:"大航海時代",e:"世界がつながる",m:{c:[-50,15],r:6000,rw:19500,pins:["リスボン","カリカット","マニラ","テノチティトラン","クスコ","種子島"],blink:"リスボン",fl:"pt"}}},
{t:"冒頭の問いに戻ろう。大きな艦隊を持っていた明ではなく、なぜ西の端の小さな国々が、世界の海をつないだのか。"},
{t:"明は、欲しいものが向こうから運ばれてくる大国だった。ポルトガルとスペインは、欲しいものを自分で取りに行かなければならない小国だった。香辛料、金、銀。外へ出なければ、豊かになれなかったのだ。\nそして国王が船乗りと商人を後押しし、二つの国が競い合ったことが、海の道を次々に広げた。"},
{t:"その道は、アフリカの人々には奴隷貿易を、アメリカ大陸の人々には征服と病気をもたらした。一方で、ジャガイモも、鉄砲も、銀も、この道を通って世界をめぐった。\n「世界がひとつになる」ことの光と影は、ここから始まったのだ。"},
