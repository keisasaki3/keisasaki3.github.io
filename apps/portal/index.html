<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>なつめポータル</title>
<script>
// ログインの戻り（Supabase の ?code= や #access_token）がここに来たら人生クエストへ渡す
(function(){var s=location.search,h=location.hash;if(/[?&]code=/.test(s)||/access_token|error_description/.test(h))location.replace("/life-quest/"+s+h);})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap">
<style>
:root{--pg:#f1f3ec;--card:#fff;--ink:#33382f;--muted:#737a6b;--line:#d7ddce;--head:#4b392e;--acc:#55734d;--soft:#e6eddd;
  --sys:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;--pop:"Zen Maru Gothic",var(--sys)}
@media (prefers-color-scheme:dark){:root{--pg:#2f2520;--card:#43322a;--ink:#f0f4f1;--muted:#c4b4a6;--line:#6c564a;--head:#f0e6da;--acc:#a8c29a;--soft:#523e34}}
*{box-sizing:border-box}
body{margin:0;background:var(--pg);color:var(--ink);font-family:var(--sys);line-height:1.6}
main{max-width:640px;margin:0 auto;padding:40px 16px 56px}
h1{font-family:var(--pop);font-weight:900;font-size:30px;color:var(--head);margin:0 0 4px;letter-spacing:.04em}
.sub{color:var(--muted);margin:0 0 28px;font-size:14px}
.apps{display:grid;gap:12px}
a.app{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:14px;padding:16px;background:var(--card);border:2px solid var(--line);border-radius:14px;color:inherit;text-decoration:none;transition:border-color .15s,transform .15s}
a.app:hover,a.app:focus-visible{border-color:var(--acc);transform:translateY(-1px);outline:none}
.ic{width:48px;height:48px;border-radius:12px;background:var(--soft);display:grid;place-items:center}
.ic img{width:32px;height:32px;image-rendering:pixelated}
.nm{font-family:var(--pop);font-weight:900;font-size:18px}
.ds{color:var(--muted);font-size:13px}
.go{color:var(--acc);font-size:20px;font-weight:700}
.tag{display:inline-block;margin-left:6px;padding:0 6px;border-radius:6px;background:var(--soft);color:var(--acc);font-size:11px;font-family:var(--sys);font-weight:700;vertical-align:2px}
footer{margin-top:32px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<main>
  <h1>なつめポータル</h1>
  <p class="sub">学びのアプリをここからひらく（仮のページ）</p>
  <nav class="apps">
    <a class="app" href="/life-quest/"><span class="ic"><img src="/life-quest/app-icons/favicon-32.png" alt=""></span><span><span class="nm">人生クエスト</span><br><span class="ds">わかったことと次に学ぶことを見える化</span></span><span class="go">›</span></a>
    <a class="app" href="/anki-taisen/"><span class="ic"><img src="/shared/icons/academics.svg" alt=""></span><span><span class="nm">激突！暗記大戦</span><br><span class="ds">札で覚えて、対戦で定着させる</span></span><span class="go">›</span></a>
    <a class="app" href="/history-novel/"><span class="ic"><img src="/shared/icons/history.svg" alt=""></span><span><span class="nm">武士の世のはじまり<span class="tag">試作</span></span><br><span class="ds">地図の上で読む歴史ノベル</span></span><span class="go">›</span></a>
  </nav>
  <footer>ログインは人生クエストのアカウントで共通です。</footer>
</main>
</body>
</html>
