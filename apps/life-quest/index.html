<!doctype html>
<html lang="ja" data-theme="dracula">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>人生クエスト</title>
<script>
try { var t = localStorage.getItem('lifeQuestTheme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="preconnect" href="https://rjydvhpqfhmlvpsykwzf.supabase.co" crossorigin>
<link rel="stylesheet" href="./theme.css">
<link rel="stylesheet" href="./subject-ui.css">
<link rel="stylesheet" href="./newspaper.css">
</head>
<body>
<div class="app">
<div class="topbar">
  <span class="brand" data-i18n="brand">人生クエスト</span>
  <span class="presence" id="presence"><span class="presence-dot"></span><span id="presenceLabel"></span></span>
</div>
<header class="top">
  <div class="lv"><span class="lv-label">Lv</span><span class="lv-value" id="profileLv">0</span></div>
  <div class="profile"><h1 id="profileName">名無し</h1><button class="rename" id="rename" type="button" data-i18n-aria="rename" aria-label="名前を変更">✎</button></div>
  <div class="title" id="rank">旅のはじまり</div>
</header>
<main class="main" id="main"></main>
<nav class="tabs">
  <button class="tab active" type="button" data-tab="subjects" data-i18n="tab.status">ステータス</button>
  <button class="tab" type="button" data-tab="newspaper" data-i18n="tab.newspaper">NEWSPAPER</button>
  <button class="tab" type="button" data-tab="settings" data-i18n="tab.settings">設定</button>
</nav>
</div>
<script src="https://unpkg.com/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script>
<script src="./i18n.js"></script>
<script src="./app.js"></script>
<script src="./subject-ui.js"></script>
<script src="./newspaper-service.js"></script>
<script src="./newspaper-ui.js"></script>
</body>
</html>
