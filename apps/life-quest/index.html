<!doctype html>
<html lang="ja" data-theme="dracula">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>人生クエスト</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="./app-icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="./app-icons/favicon-16.png">
<link rel="apple-touch-icon" href="./app-icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="人生クエスト">
<meta name="theme-color" content="#15131d">
<script>
try { var t = localStorage.getItem('lifeQuestTheme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="preconnect" href="https://rjydvhpqfhmlvpsykwzf.supabase.co" crossorigin>
<link rel="stylesheet" href="./theme.css">
<link rel="stylesheet" href="./subject-ui.css">
<link rel="stylesheet" href="./newspaper.css">
<link rel="stylesheet" href="./routine.css">
<link rel="stylesheet" href="./wish.css">
<link rel="stylesheet" href="./bgm.css">
</head>
<body>
<div class="app">
<div class="topbar">
  <span class="brand" data-i18n="brand">人生クエスト</span>
</div>
<header class="top">
  <button class="avatar" id="avatarBtn" type="button" data-i18n-aria="avatarChange" aria-label="サムネを変更"><img id="avatarImg" class="pending" alt="" width="64" height="64"></button>
  <input type="file" id="avatarFile" accept="image/*" hidden>
  <div class="pinfo">
    <div class="profile"><h1 id="profileName">名無し</h1><button class="rename" id="rename" type="button" data-i18n-aria="rename" aria-label="名前を変更">✎</button><div class="lv"><span class="lv-label">Lv</span><span class="lv-value" id="profileLv">0</span></div></div>
    <div class="job" id="jobName" hidden></div>
    <div class="title" id="rank">旅のはじまり</div>
  </div>
</header>
<main class="main" id="main"></main>
<nav class="tabs">
  <button class="tab active" type="button" data-tab="subjects" data-i18n="tab.status">ステータス</button>
  <button class="tab" type="button" data-tab="routines" data-i18n="tab.routines">デイリー</button>
  <button class="tab" type="button" data-tab="wishes" data-i18n="tab.wishes">学びたい</button>
  <button class="tab" type="button" data-tab="newspaper" data-i18n="tab.newspaper">ニュース</button>
  <button class="tab" type="button" data-tab="bgm" data-i18n="tab.bgm">BGM</button>
  <button class="tab" type="button" data-tab="settings" data-i18n="tab.settings">設定</button>
</nav>
</div>
<script src="https://unpkg.com/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script>
<script src="./i18n.js"></script>
<script src="./app.js"></script>
<script src="./subject-ui.js"></script>
<script src="./routine-ui.js"></script>
<script src="./wish-ui.js"></script>
<script src="./newspaper-service.js"></script>
<script src="./bgm-ui.js"></script>
<script src="./newspaper-ui.js"></script>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
</script>
</body>
</html>
