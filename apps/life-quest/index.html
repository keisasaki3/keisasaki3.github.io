<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>人生クエスト</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=DotGothic16&display=swap");
@font-face{font-family:"Geist Pixel";src:url("https://raw.githubusercontent.com/vercel/geist-font/main/fonts/GeistPixel/webfonts/GeistPixel-Square.woff2") format("woff2");font-style:normal;font-weight:400;font-display:swap}
*{box-sizing:border-box}body{margin:0;background:#f7f7f5;color:#20211f;font-family:"Geist Pixel","DotGothic16","Yu Gothic UI",sans-serif}.app{max-width:760px;margin:auto;min-height:100vh;background:#fff}.top{padding:22px 20px 15px;border-bottom:1px solid #ddd}.brand{font-size:13px;letter-spacing:.18em;color:#6d6d68}.profile{display:flex;align-items:center;gap:8px;margin-top:10px}.profile h1{margin:0;font-size:27px}.rename{border:0;background:none;color:#999;font-size:15px;padding:4px 6px;cursor:pointer}.title{font-size:12px;color:#777;margin-top:4px}.tabs{display:flex;border-bottom:1px solid #ddd}.tab{flex:1;padding:13px;text-align:center;font-size:14px;cursor:pointer}.tab.active{font-weight:700;border-bottom:2px solid #222}.main{padding:14px 16px 40px}.subject{border-bottom:1px solid #e6e6e1;padding:15px 2px;cursor:pointer}.subjectline{display:flex;align-items:center;gap:8px;min-width:0}.icon{font-size:17px;line-height:1;width:22px;flex:none;text-align:center}.name{font-size:17px;font-weight:700;white-space:nowrap}.en{font-size:13px;font-weight:400;color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stars{font-size:14px;font-weight:600;white-space:nowrap;margin-left:3px}.meta{font-size:12px;color:#777;margin-top:6px}.back{border:0;background:none;font-size:14px;padding:4px 0 14px;cursor:pointer}.mathhead{display:flex;align-items:center;gap:8px;padding-bottom:12px;border-bottom:1px solid #ddd}.mathhead h2{margin:0;font-size:24px}.mathhead .en{font-size:14px}.area{margin-top:20px}.area h3{font-size:15px;margin:0;padding:0 0 8px;border-bottom:1px solid #bbb}.topic{display:flex;align-items:flex-start;gap:11px;padding:12px 2px;border-bottom:1px solid #eee;cursor:pointer}.check{width:22px;height:22px;border:1px solid #888;border-radius:3px;flex:none;display:flex;align-items:center;justify-content:center;margin-top:1px}.topic.on .check{background:#222;color:#fff;border-color:#222}.topicbody{min-width:0;flex:1}.tname{font-size:15px;font-weight:500;line-height:1.55}.source{font-size:12px;color:#8a8a84;margin-top:3px}.master{margin-left:auto;align-self:center;flex:none;font-size:11px;font-weight:700;letter-spacing:.08em;color:#28705d}.search{width:100%;padding:10px 12px;border:1px solid #ccc;border-radius:5px;font:inherit;font-size:14px;margin:12px 0 2px;background:#fff}.empty{padding:30px 0;color:#777;text-align:center}.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}.modal{width:min(360px,100%);background:#fff;border-radius:8px;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.2)}.modal h3{margin:0 0 12px;font-size:17px}.modal input{width:100%;padding:10px;border:1px solid #bbb;border-radius:5px;font:inherit;font-size:16px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.actions button{padding:8px 13px;border:1px solid #bbb;border-radius:5px;background:#fff;cursor:pointer}.actions .savebtn{background:#222;color:#fff;border-color:#222}.settings{padding-top:8px}.settings h2{font-size:22px;margin:0 0 18px}.settingrow{padding:16px 0;border-bottom:1px solid #e6e6e1}.settingtitle{font-size:15px;font-weight:700;margin-bottom:9px}.dangerbtn{border:1px solid #c75b5b;background:#fff;color:#b64040;border-radius:6px;padding:9px 13px;font:inherit;font-weight:600;cursor:pointer}.dangerbtn:active{background:#fff2f2}.plainbtn,.primarybtn{width:100%;border:1px solid #bbb;background:#fff;color:#222;border-radius:6px;padding:10px 13px;font:inherit;font-weight:600;cursor:pointer}.primarybtn{background:#222;color:#fff;border-color:#222}.plainbtn.small{width:auto;padding:8px 12px}.select{min-width:180px;padding:9px 10px;border:1px solid #bbb;border-radius:6px;background:#fff;font:inherit}.authmain{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.authbox{width:min(380px,100%)}.authbrand{text-align:center;font-size:21px;font-weight:700;letter-spacing:.08em;margin-bottom:24px}.authform{display:grid;gap:10px}.authform input{width:100%;padding:11px 12px;border:1px solid #bbb;border-radius:6px;font:inherit;font-size:16px}.authmessage{min-height:22px;font-size:13px;color:#555;text-align:center;margin-top:2px}.authmessage.error{color:#b64040}.loading{width:100%;text-align:center;color:#888;padding:80px 0}.racechoices{display:grid;gap:8px}.racebtn{border:1px solid #bbb;border-radius:6px;background:#fff;padding:11px 12px;font:inherit;font-weight:600;cursor:pointer;text-align:left}.racebtn:hover{background:#f7f7f5}
@media(max-width:540px){.top{padding-top:18px}.profile h1{font-size:23px}.main{padding-left:14px;padding-right:14px}.en{font-size:12px}.subjectline{gap:7px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand">人生クエスト</div>
  <div class="profile"><h1 id="profile">名無し Lv.0</h1><button class="rename" id="rename" aria-label="名前を変更">✎</button></div>
  <div class="title" id="rank">旅のはじまり</div>
</header>
<nav class="tabs">
  <div class="tab active" data-tab="subjects">学問</div>
  <div class="tab" data-tab="daily">デイリー</div>
  <div class="tab" data-tab="settings">設定</div>
</nav>
<main class="main" id="main"></main>
</div>
<script src="https://unpkg.com/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script>
<script src="./app.js"></script>
</body>
</html>
