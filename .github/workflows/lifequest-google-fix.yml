name: Life Quest one-time fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lifequest-google-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix escaped quote entity
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/life-quest/app.js')
          s = p.read_text()
          old = "'\"':'&quot'"
          new = "'\"':'&quot;'"
          if old not in s:
              raise SystemExit('target not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "chatgpt-lifequest"
          git config user.email "actions@users.noreply.github.com"
          git add apps/life-quest/app.js
          git commit -m "Fix Life Quest HTML escaping"
          git push
